  quote_ru: The article presents fragments of canonical physics of mass particles’ collective interaction. Equations
    of self- consistent statics of mass particles and their solutions are given. The integral of "living forces"
    in plane symmetry is found. It allows to validate the field confinement of matter by a self-consistent field.
    A pair of forces of field origin, holding the layer in a static equilibrium state, is found - the compression
    force and the expansion force.
  statement_en: 'The article presents fragments of the canonical physics of mass particles'' collective interaction:
    equations of self-consistent statics of mass particles and their solutions are given; the integral of ''living
    forces'' in plane symmetry is found, allowing validation of the field confinement of matter by a self-consistent
    field; a pair of field-origin forces holding the layer in static equilibrium — the compression force and the
    expansion force — is found.'
