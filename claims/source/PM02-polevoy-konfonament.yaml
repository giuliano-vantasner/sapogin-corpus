  quote_ru: The first works were published by Lane and Emden. Two classes of ordinary differential equations of
    the second order were constructed. The first class described filled gas spheres in polytropic states with non-uniform
    temperature. The second class - the Emden E-equation, which describes a gas accumulation with a uniform temperature
    [1].
  statement_en: The first equilibrium-problem works for a substance of mass particles in an isolated gas sphere
    were published by Lane and Emden; two classes of second-order ordinary differential equations were constructed
    — the first described filled gas spheres in polytropic states with non-uniform temperature, the second is the
    Emden E-equation describing a gas accumulation with uniform temperature; the static equilibrium of mass particles
    was assumed to be maintained by two forces, the attractive force and the repulsive gas-pressure force.
