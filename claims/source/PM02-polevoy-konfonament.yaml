  quote_ru: The Tunguska phenomenon could have been a hollow, loose cosmic "snowball" of enormous mass, consisting
    of ice dust particles of nanoscopic dimensions (details in [14]). It was ejected by ice geysers from the depths
    of the Enceladus – the sixty-first satellite of the Saturn.
  statement_en: The Tunguska phenomenon could have been a hollow, loose cosmic 'snowball' of enormous mass consisting
