  quote_ru: The "damaging" factor of bubble's action should be considered its momentum. The average speed of solar
    wind is ~ 105 cm/s. With a bubble radius of 140.105 cm (temperature 1 K), a liquid wall thickness of 0.1 cm,
    its mass reduced by 106 times is ~ 250 tons, and reduced on another three orders of magnitude is 250 kg. The
    invisible bubble has a in the range from 2.5.108 kgm/s to 2.5.105 kgm/s. A train, consisting of 20 carriages
    by 60 tons’ weigh of each and traveling with the speed from 210 m/s to 0.2 m/s, has the same momentum.
  statement_en: 'The ''damaging'' factor of a bubble''s action should be considered its momentum: the average solar-wind
    speed is ~10^5 cm/s; a bubble with radius 1.4·10^5 cm (temperature 1 K) and liquid wall thickness 0.1 cm has
    a mass of ~250 tons when reduced by 10^6 times, and 250 kg when reduced by another three orders of magnitude;
    the invisible bubble''s momentum lies in the range from 2.5·10^8 to 2.5·10^5 kg·m/s — a train of 20 carriages
