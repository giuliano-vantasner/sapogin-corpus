  page: § «Суть канонических методов решения обыкновенных дифференциальных уравнений»
  quote_ru: 'Во всех указанных коллективно взаимодействующих физических системах сохраняется полное давление, которое всегда содержит в себе два слагаемых: давление поля и давление частиц (либо зарядов,
    либо токов).'
  statement_en: 'Sapogin asserts that in all collectively interacting physical systems (gravity, electrostatics, magnetism) the total pressure is conserved, always containing two terms: the field pressure
