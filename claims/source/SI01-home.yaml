  page: § «Каноническая форма и структура газовых скоплений»
  quote_ru: Углублённое исследование показало, что система уравнений в плоском случае имеет полный набор решений, состоящий из 4-х четных функций. **Интеграл полного давления,** состоит из разности давления
    токов и давления электрического поля, взаимодействующих между собой. Три функции описывают скин-эффект (выталкивание тока на поверхность), а четвёртая – эффект сжатия токового слоя, который также может
    происходить на переменном токе.
  statement_en: 'Sapogin asserts the Maxwell–Ohm system in the planar case has a complete set of 4 even-function solutions: three describe the skin effect (current expulsion to the surface) and the fourth
    describes current-layer compression, which can also occur on AC.'
