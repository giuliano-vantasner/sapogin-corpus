  quote_ru: для распределения потенциала было угадано будущим нобелевским лауреатом Лауэ в 1918 году [2]. Он обнаружил,
    что оно имеет три возможных класса аналитических решений в плоском случае, в зависимости от значений некоторой
    произвольной постоянной. Не выяснив физического смысла произвольной постоянной, он посчитал, что решения этого
    уравнения описывают распределения электростатических полей, возникающих в газе термоэлектронов. Через 30 лет
    система уравнений была получена Я.И.Френкелем (по- видимому, о работе Лауэ он ничего не знал). Эта система уравнений
  statement_en: 'Dimensionless functions Ex/E* = y(ξ,τ), ux/u* = u(ξ,τ), n/n₀ = z(ξ,τ) are introduced relative to
    the variables ξ = x/rd, τ = t/T* (star denotes the scale of the quantity); for the scales E* = sqrt(4πn₀kT/ε₀),
    rd = sqrt(ε₀kT/(4πe²n₀)), T* = mνrd²/kT, u* = eE*/(mν) the functions satisfy the system: z·y + ∂z/∂ξ + z·u =
    0 (4); ∂z/∂τ + ∂(z·u)/∂ξ = 0 (5); ∂y/∂ξ = 1 − z (6).'
