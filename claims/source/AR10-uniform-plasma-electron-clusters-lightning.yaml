  quote_ru: Интегрируя (13), получаем решение в классе периодических функций
  statement_en: At p ≠ 0 equation (12) has two implicit-function solutions which do not help obtain a physically
    meaningful result; since at y = 0, dp/dy = 0, a solution of (12) is sought for the class of periodic functions
    as a two-term series p = p₀ + αy² (13) with α > 0, p₀ > 0; substituting (13) into (12) and keeping terms proportional
    to y, the requirement y(2p₀α + p₀ − 1) = 0 (14) gives the connection p₀ = 1/(1+2α), α = (1/p₀ − 1)/2 (15); the
