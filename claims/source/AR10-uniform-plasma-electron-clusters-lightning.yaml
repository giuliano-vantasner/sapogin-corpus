  quote_ru: 'В [3] он дал однозначную физическую интерпретацию этому уравнению: он считает, что оно описывает возможные
    равновесия зарядов в статическом самосогласованном поле, которое они сами и создают.'
  statement_en: 'Thirty years later the system of equations was obtained by Ya.I. Frenkel (apparently unaware of
    Laue''s work); in the plane case it reduces to the equation guessed by Laue with insignificant differences;
    in [3] Frenkel gave an unambiguous physical interpretation: it describes possible equilibria of charges in the
    static self-consistent field which they themselves create; solving the boundary problem for electrons, he did
    not notice the existence of the conservation law in the plane system which confirms the unambiguity of his interpretation,
    and therefore explained his solutions as distributions of thermoelectrons.'
