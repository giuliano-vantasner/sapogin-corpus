  quote_ru: По-видимому, впервые, результирующее уравнение задачи для распределения потенциала было угадано будущим
    нобелевским лауреатом Лауэ в 1918 году [2]. Он обнаружил, что оно имеет три возможных класса аналитических решений
    в плоском случае, в зависимости от значений некоторой произвольной постоянной.
  statement_en: Apparently for the first time, the resulting equation of the problem for the potential distribution
    was guessed by the future Nobel laureate Laue in 1918; he found that it has three possible classes of analytical
    solutions in the plane case, depending on the values of a certain arbitrary constant; without clarifying the
    physical meaning of the arbitrary constant, he considered that the solutions describe electrostatic-field distributions
    arising in a gas of thermoelectrons.
