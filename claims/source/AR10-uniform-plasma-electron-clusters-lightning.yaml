  quote_ru: Существование закона сохранения полного давления в коллективном взаимодействии дало мне возможность
    провести однозначную классификацию возможных состояний, существующих в газе зарядов с однородной температурой
  statement_en: The existence of the full-pressure conservation law in the collective interaction allowed the author
    to make an unambiguous classification of the possible states existing in a gas of like charges with uniform
    temperature (not thermoelectrons, but simply a gas of like charges), and to reveal almost all possible distributions
    of physical parameters in the plane, cylindrical, and spherical cases; among them is the tangent-type distribution
    of the collective-field strength that Pustovoyt obtained in [1] solving the self-model equation in a single-component
    plane plasma.
