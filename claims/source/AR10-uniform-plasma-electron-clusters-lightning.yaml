  quote_ru: При протекании неустойчивости в системе проявляются три выделенных момента времени
  statement_en: 'During the instability three distinguished moments of time τ1 < τ2 < τ3 manifest themselves: the
    formation of the electron cluster on two scales of the system ends at the moment τ1 = (1/γ²)·ln[(1 − γ²)/2chγ]
    (33), found from the condition of stopping of the electrons u = 0, which find themselves at that moment at the
    boundary values of the coordinate ξ = ±1; the moment τ2 indicates that the maximum concentration of the electron
    cluster has become equal to γ² and the electrons of the fourth group disappear from the system; after that moment
    the electrons of the third group dominate in the cluster and it starts to decay; at the moment τ3 = −ln(2)/γ²
    (34) the instability ends: the maximum of the electron concentration distribution becomes zero, zM(τ3) = 0,
    and the electron cluster disappears, leaving behind a region of positive charge.'
