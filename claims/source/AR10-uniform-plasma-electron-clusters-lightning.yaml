  quote_ru: Из (30) видно, что все электроны системы разделены на 4-е класса.
  statement_en: 'The change of the electron velocity is found from (4): u(ξ,τ) = −y − (1/z)∂z/∂ξ = y(γ²/z − 1) (30);
    from (30) all electrons of the system are divided into 4 classes; the first class — electrons in the ξ = 0 plane,
    immobile at any moment of time; the second class — electrons with u = 0 at a certain point of space and moment
    of time (the round bracket in (30) vanishes); these electrons with concentration z0 = γ² exist until the moment
    τ2 while the maximum of the distribution zM becomes equal to γ², with τ2 = (1/γ²)ln[(1 − γ²)/2] (31); their
    positions on the ξ axis, ξ0(1,2) = ±(1/γ)·Arch[sqrt((1−γ²)/2)·exp(−γ²τ/2)] (32), are connected with the moment
    τ; the state of rest of these electrons in the dynamical system is explained by the equality of the forces holding
    the volume in equilibrium: for them the vector sum of the Bernoulli force fb = −grad(p) and the field-pressure
    gradient f = −enE acting on the electrons is zero.'
