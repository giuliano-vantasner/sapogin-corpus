- id: SC-AR10-010
  type: mathematical
  facet: theory
  priority: core
  page: 4
  quote_ru: Сумма решений уравнений (9) и (10) описывает нелинейные процессы протекания электрической неустойчивости,
    которая возникает на встречных продольных волнах в первоначально однородной плазме.
  statement_en: A pair of symmetric self-model equations is obtained for plane waves with parameters λ = 2πrd, T
    = 2πT*/γ, γ = vf/u* the reduced phase velocity; for the plane-wave phase θ = ξ+γτ, from (8) the first self-model
    equation for y1(θ) is y1″ − y1(1 − y1′) − γy1′ = 0 (9) (primes denote differentiation over θ); the second self-model
    equation for y2(ψ) for the counter-running wave phase ψ = ξ−γτ is y2″ − y2(1 − y2′) + γy2′ = 0 (10); the sum
    of the solutions of (9) and (10) describes the nonlinear processes of the electrical instability arising on
    counter longitudinal waves in the initially uniform plasma.
  quantities: []
  equations:
  - y_1'' - y_1(1 - y_1') - \gamma y_1' = 0
  - y_2'' - y_2(1 - y_2') + \gamma y_2' = 0
