  priority: core
  page: 5
  quote_ru: Поскольку максимальное значение концентрации электронов всегда меньше, чем концентрация положительных
    зарядов фона, то полученное решение описывает ограниченный в пространстве электронный кластер в дырочной плазме.
  statement_en: From (16) the static collective plasma field vanishes at ξ = 0 and its spatial period depends on
    the state parameter α; on the system asymptotes ξ1,2 = ±(π/2)·sqrt(α/(1+2α)) the field strength has a discontinuity,
    the vector directed along ξ in 0 < ξ < ξ2 and against ξ in ξ1 < ξ < 0; since the plasma electrons redistribute
    under the collective field, near the zero-field-pressure plane (where y² = 0) they form high-concentration regions;
    the concentration law from (6) is z = 1 − dy/dξ = 1 − (1+2α)⁻¹cos⁻²[√(α/(1+2α))·ξ] (17); the maximum of the
    electron concentration falls on the ξ = 0 plane, zM = 1 − 1/(1+2α) (18), and the cluster is bounded by the concentration
    zeros ξ3,4 = ±sqrt((1+2α)/α)·arccos(1/sqrt(1+2α)); since the maximum electron concentration is always less than
    the positive-background concentration, the obtained solution describes a spatially bounded electron cluster
    in a hole plasma.
  quantities:
