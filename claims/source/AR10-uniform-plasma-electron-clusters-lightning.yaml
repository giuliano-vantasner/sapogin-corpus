- id: SC-AR10-005
  type: physics
  facet: theory
  priority: core
  page: 2
  quote_ru: 'Как показывает аналитическое исследование, кулоновское взаимодействие скомпенсировано силой Бернулли.
    Компенсация сил приводит к новой физике, которая следует из закона сохранения: концентрация зарядов (давление)
    будет больше там, где больше давление самосогласованного поля и наоборот.'
  statement_en: 'The conservation law makes it possible to understand what compensates the Coulomb interaction in
    the statics: as the analytical study shows, the Coulomb interaction is compensated by the Bernoulli force; the
    compensation of forces leads to a new physics following from the conservation law: the charge concentration
    (pressure) is greater where the self-consistent field pressure is greater, and vice versa; a similar result
    appeared in Pustovoyt''s solutions — where the square of the tangent is greater (near the system asymptotes)
    the charge pressure is greater; the author''s results entered the monograph [4] published in 2000 in Taganrog.'
  quantities: []
