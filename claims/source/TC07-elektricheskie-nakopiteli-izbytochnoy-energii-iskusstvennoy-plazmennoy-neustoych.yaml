- id: SC-TC07-011
  type: physics
  facet: theory
  priority: normal
  page: 4
  quote_ru: Современный физик-теоретик, прекрасно владеющий знаниями фундаментальных законов электростатики, объяснит,
    что никакого дополнительного выделения энергии в таком колебательном контуре быть не может.
  statement_en: 'A modern theoretical physicist, fluent in the fundamental laws of electrostatics, will explain
    that no additional energy release is possible in such an oscillatory circuit: all static charges accumulated
    on the capacitor plates are immovable, and in rotation move along closed trajectories; the distributed charges
    of the moving plate can be represented as an atmosphere of point charges immovable relative to the plate, and
    the motion of a point charge in an inhomogeneous electrostatic field along the same closed contour does not
    change its energy over a full revolution and does no work (circulation theorem for the static electric field
    strength).'
  quantities: []
