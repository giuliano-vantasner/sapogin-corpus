  quote_ru: В настоящее время ею построены несколько различных установок на мощность 100 Вт, 300 Вт, 3 кВт и 10
    кВт, которые используются общиной для своего производства.
  statement_en: Inventor Paul Baumann calls his devices Testatik Machine M/L Converter of the religious group 'Methernitha'
