- id: SC-TC07-017
  type: physical
  facet: theory
  priority: core
  page: 6
  quote_ru: Она отличается от магнитной тем, что в свободном состоянии указывает направление напряжённости внешнего
    электрического поля и при высоких напряжённостях внешнего поля имеет достаточно большой электрический дипольный
    момент. Чем больше длина стрелки и чем больше напряжённость внешнего поля, тем больше дипольный момент электрической
    стрелки.
  statement_en: 'Each conducting sector glued radially on the circle is an electric arrow: it differs from the magnetic
    one in that in the free state it points along the external electric field strength and at high external field
    strengths has a rather large electric dipole moment; the longer the arrow and the higher the external field
    strength, the larger the arrow''s dipole moment.'
