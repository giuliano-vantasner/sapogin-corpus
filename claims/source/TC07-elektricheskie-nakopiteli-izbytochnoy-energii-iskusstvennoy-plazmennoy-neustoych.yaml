- id: SC-TC07-020
  type: physics
  facet: theory
  priority: core
  page: 7
  quote_ru: Мы утверждаем, что на каждый элемент объёма протяжённого одноимённо заряженного тела, находящееся во
    внешнем неоднородном электрическом поле
  statement_en: 'In the Testatika the interaction of the artificial plasmoid charges with the П-shaped capacitor
    charges is not described by Coulomb interaction: the Coulomb model is built only for point charges, which are
    not realized in nature, and is inapplicable to distributed charges; the authors assert that two volume forces
    act on each volume element of an extended like-charged body in an external inhomogeneous electric field: the
    electric force f1 = ρE, to be summed over all plasmoid charges of the arrow, and the force connected with the
    field pressure gradient, proportional to f2 = E·divE/4π, acting on the local distribution of the mass density
    of the plasmoid charges.'
