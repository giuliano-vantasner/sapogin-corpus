  page: 2
  quote_ru: Новая электромеханическая физическая система соединяет в себе одновременно вращающийся мотор и генератор,
    разъединяющий заряды. Пока диск крутится, она непрерывно выделяет энергию, то есть система имеет положительный
    энергетический инкремент. Вырабатываемой избыточной энергии за период движения системы оказывается достаточным,
    чтобы перекрыть все диссипативные потери, существующие в установке за тот же период.
  statement_en: 'The new electromechanical physical system combines a rotating motor and a charge-separating generator
    simultaneously: while the disk spins it continuously releases energy — the system has a positive energy increment;
    the excess energy produced per period of system motion suffices to cover all dissipative losses existing in
    the installation over the same period.'
