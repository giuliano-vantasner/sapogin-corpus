- id: SC-TC07-007
  type: physical
  facet: recipe
  priority: core
  page: 3
  quote_ru: её основной узел представляет собой колебательный контур, в котором в качестве электроёмкости используются
    неподвижные П-образные пластины конденсатора. Внутри пластин П-образного конденсатора вращается один или два
    акрилловых диска, с набором радиально наклеенных на них из тонкой фольги проводящих секторов (см. фиг. 11 на
    с. 28 в [1]). Вращение диска с проводящими секторами периодически изменяет электрическую ёмкость П-образного
    конденсатора в определённых пределах. Изменение ёмкости П-образного конденсатора и приводило к увеличению избыточной
    энергии в Тестатике.
  statement_en: The main node of the Testatika installation is an oscillatory circuit in which the capacitance is
    the fixed П-shaped capacitor plates; inside them rotate one or two acrylic disks with a set of conducting sectors
    of thin foil glued radially on them (fig. 11, p. 28 in [1]); the rotation of the disk with conducting sectors
    periodically changes the electric capacitance of the П-shaped capacitor within certain limits — this capacitance
    change led to the increase of excess energy in the Testatika.
  quantities: []
  equations: []
