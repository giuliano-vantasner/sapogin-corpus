- id: SC-TC07-015
  type: physics
  facet: theory
  priority: core
  page: 6
  quote_ru: 'Исследование статических решений модели указывает на возможность существования трёх видов плазмоидов
    в двухкомпонентной плазме: электронейтрального, заряженного положительно (электронный кластер в дырочной плазме),
    либо заряженного отрицательно (электронный кластер в электронной плазме), что совпадает с наблюдениями.'
  statement_en: 'The temporal process of plasmoid-chain formation (bead lightning) under an external DC current
    was first proposed in [7] (Pustovoit); the authors simplified the model for the absence of external current
    and studied the plasma instability at single-plasmoid formation; the static solutions of the model indicate
    the possible existence of three kinds of plasmoids in two-component plasma: electrically neutral, positively
    charged (electron cluster in hole plasma), or negatively charged (electron cluster in electron plasma), matching
    observations.'
