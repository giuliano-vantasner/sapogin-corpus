  priority: core
  page: 1
  quote_ru: Им удалось построить небольших размеров установку, очень похожую на электрофорную машину, но в которой
    отсутствовали щётки, снимающие заряд. В начальный момент нужно закрутить диск (диски) установки и она сразу
    начинает вырабатывать электрическую энергию, как-будто бы из ничего. Чтобы прекратить её работу необходимо механически
    остановить вращение дисков.
  statement_en: 'About 40 years ago Swiss engineers cut a window into a new direction of energetics: they broke
    the usual energy chain and built a small installation very similar to an electrostatic (electrophorus) machine
    but without charge-removing brushes; at the initial moment one spins the disk(s) and it immediately starts producing
    electric energy as if from nothing; to stop it one must mechanically halt the disk rotation.'
