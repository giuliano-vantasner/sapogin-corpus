  quote_ru: Когда стрелка попадает во внешнее электрическое поле, то на её концах искусственно образуются плазмоиды.
    Положительно заряженный плазмоид будет находится на «северном» конце стрелки, а отрицательно заряженный плазмоид
    – на «южном» конце стрелки.
  statement_en: 'When the arrow enters the external electric field, plasmoids form artificially at its ends: the
