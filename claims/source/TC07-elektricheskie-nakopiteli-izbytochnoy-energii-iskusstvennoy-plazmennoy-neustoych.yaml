- id: SC-TC07-016
  type: physical
  facet: process
  priority: core
  page: 6
  quote_ru: Затем в плазме быстро развивается электрическая неустойчивость, которая в конечном счёте формирует одиночный
    либо положительный, либо отрицательный плазмоид. Заряды плазмоида удерживаются в пространстве самосогласованным
    полем.
  statement_en: 'Non-static solutions indicate the following temporal sequence of plasmoid formation under electric-instability
    development: at some moment a spatially bounded region with electrically neutral plasma arises in the atmosphere;
    then the electric instability develops rapidly in the plasma, ultimately forming a single positive or negative
    plasmoid; the plasmoid charges are held in space by the self-consistent field; the electric energy accumulated
    by the plasmoid radiates into the atmosphere and the object ceases to exist; to take the energy accumulated
    by the plasmoid before it radiates, it must be created artificially inside the П-shaped capacitor plates as
    done in the Testatika.'
