- id: SC-TC07-014
  type: experimental
  facet: experiment
  priority: core
  page: 5
  quote_ru: Были зафиксированы светящиеся объекты, локализованные в пространстве и имеющие размеры от миллиметров
    до сантиметров. Время высвечивания объекта увеличивалось с увеличением его объёма.
  statement_en: For the last 30 years physical laboratories of many countries ran experiments on powerful short
    electric pulses in various conducting media; glowing objects localized in space with sizes from millimeters
    to centimeters were recorded; the object decay (glow) time increased with its volume; researchers noted the
    macroscopic charge separation inside the object held in a bounded region of space by a self-consistent electric
    field; experimentally the object can reside in three different electrization states — electrically neutral,
    positively charged, and negatively charged; these properties allow attributing it to the class of plasmoids
    and microplasmoids.
  quantities:
