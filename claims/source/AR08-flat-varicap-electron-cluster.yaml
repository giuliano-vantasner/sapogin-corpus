    discovered by Shoulders; electrons are supplied from a thin film of charges formed on the cathode surface; the
    strongly inhomogeneous field of the sharp cathode, by the gradient of its pressure (acting on the mass density
    of substance), dumps the charge film into the volume V always so that it, decreasing in volume, increases its
    volume charge density in the bubble.'
