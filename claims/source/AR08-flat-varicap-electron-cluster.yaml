- id: SC-AR08-019
  type: physics
  facet: theory
  priority: core
  page: 6
  quote_ru: В третьем режиме накопления ёмкость варикапа с пузырьками зарядов будет самая большая. Она будет увеличиваться
    пропорционально внешнему напряжению.
  statement_en: 'In a varicap with an electron cluster three charge-accumulation regimes are possible: in the first
    regime the electron concentration in the cluster is such that the effective charge q'' = CU0 = const (14) (or
    the volume-density scale) on the plates of the volume V does not depend on the external voltage, and the varicap
    capacitance decreases inversely proportional to the external voltage; at high electron concentrations a second
    regime is possible where the volume charge-density scale depends linearly on the external voltage and the capacitance
    does not depend on the voltage; at ultrahigh concentrations a third accumulation regime is possible in which
    a bubble structure forms inside the electron cluster, giving the largest varicap capacitance, increasing proportionally
    to the external voltage.'
  quantities: []
  equations:
  - q' = C U_0 = \mathrm{const}
