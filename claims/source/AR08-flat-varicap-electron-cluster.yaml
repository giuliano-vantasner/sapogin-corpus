- id: SC-AR08-017
  type: mathematical
  facet: theory
  priority: core
  page: 5
  quote_ru: Из (12) следует важнейшее свойство, позволяющее увеличивать масштаб ёмкости. Она тем больше, чем больше
    объём электронного кластера, находящегося между обкладками.
  statement_en: 'In the gas volume V there are N = ne·V electrons (9); the charge induced by the electrons on the
    whole plate is q'' = η·e·ne·V (10), accounting that only a fraction η of the electrons of the whole cluster
    volume goes to the plates; the capacitance of the capacitor with the electron cluster is C = q''/U0 = ηC* (11)
    with the scale C* = e·ne·V/U0 (12), which also depends on the voltage on the plates; from (12) follows the most
    important property allowing the capacitance scale to be increased: the larger the volume of the electron cluster
    between the plates, the larger the capacitance.'
  quantities:
  - C = eta C*
  - C* = e ne V / U0
  equations:
  - N = n_e V
  - q' = \eta\, e\, n_e V
  - C = q'/U_0 = \eta C^*
  - C^* = e\,n_e V/U_0
  materials: []
  geometry:
  - cluster volume V between plates
  procedure_steps: []
