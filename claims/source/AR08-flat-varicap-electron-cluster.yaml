  quote_ru: В этом и заключается важнейшее физическое отличие электризации газа электронов от электризации дипольных
    молекул во внешнем электрическом поле.
  statement_en: The case considered is electrization of the electron gas in which the response-field strength E'
    created by the electrons is greater than the external field strength E0; when deriving the standard dielectric
    relations it is assumed that the response field formed by dipole molecules of a dielectric is always smaller
    than the external field; herein lies the most important physical difference between electrization of an electron
    gas and electrization of dipole molecules in an external electric field.
