  quote_ru: Кулоновские силы взаимодействия между электронами кластера притягивающие. Уравновешивают систему зарядов
    силы полевого происхождения, обнаруженные В.Сапогиным [2]. Они действуют на массовую плотность электронного
    кластера и удерживают кластер внутри вакуумного диода с вынесенным анодом от коллапса.
