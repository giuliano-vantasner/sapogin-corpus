  quote_ru: 'Именно это свойство электронов и создаёт условия для неизвестного ранее, исключительно красивого физического
    явления: КЛАСТЕРИЗАЦИИ ЭЛЕКТРОНОВ В ПУЗЫРЬКИ ЗАРЯДОВ при их выходе из любого источника. Экспериментально это
    явление было впервые обнаружено в 1987 году американским исследователем К.Шоулдерсом в вакуумном диоде с острийным
    катодом [3].'
  statement_en: 'In an electron gas the Coulomb interaction forces between the electrons turn out to be ATTRACTIVE;
    the charge system is balanced against possible collapse by forces of field origin acting on their mass density;
    precisely this property of electrons creates the conditions for a previously unknown, exceptionally beautiful
    physical phenomenon: CLUSTERIZATION OF ELECTRONS INTO BUBBLES OF CHARGE upon their exit from any source; this
    phenomenon was first discovered experimentally in 1987 by the American researcher K. Shoulders in a vacuum diode
    with a sharp (point) cathode.'
