  quote_ru: Сильно неоднородное поле острийного катода градиентом своего давления (действует на массовую плотность
    вещества) сбрасывает плёнку зарядов в объём V всегда так, что она, уменьшаясь в объёме, увеличивает свою объёмную
    плотность зарядов в пузырьке.
  statement_en: 'Fig. 2 shows schematically a plane capacitor with electron gas: metal plates 1-1 with distance
    d apart have area S; 2 denotes the charge cluster in the closed volume V = S·l from which electrons cannot exit;
