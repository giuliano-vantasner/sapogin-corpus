  quote_ru: Тогда напряжённость результирующего поля E внутри области V подчиняется принципу суперпозиции
  statement_en: 'Under the external field E0 the electron cluster polarizes as shown in Fig. 3: E0 — direction of
    the external field lines, E'' — response field of the electrons, E — resulting field strength in the cluster;
    σ0 — surface charge density on the capacitor plates, σ'' — surface charge density of the response field; when
    one electron moves, a hole forms at its original place (a phenomenological object of solid-state physics with
    charge equal and opposite to the electron); the resulting field obeys superposition E = E'' + E0 (1), projected
    on the x axis as E = E'' − E0 (2), with the resulting field vector directed along x.'
