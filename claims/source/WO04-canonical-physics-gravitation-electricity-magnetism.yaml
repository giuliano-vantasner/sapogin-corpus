  quote_ru: 'Каноны представляли собой законы сохранения, существующие при решении разнообразных задач: закон сохранения
    энергии, закон сохранения импульса, момента импульса и их компонент.'
  statement_en: 'Not so many such mathematical canons have been found in physics over 200 years; they first appeared
    in Newtonian mechanics, gas- and hydrostatics, and optics; the canons were conservation laws existing in the
    solution of various problems: the energy conservation law, the momentum conservation law, the angular momentum
    law and their components.'
