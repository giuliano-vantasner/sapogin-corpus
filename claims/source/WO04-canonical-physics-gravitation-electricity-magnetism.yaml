  priority: normal
  page: 1
  quote_ru: Канонические методы отношу к разделу знаний, называемому «аналитические методы в физике». Мощь этих
    методов в том, что они позволяют представить решение задачи в известных физических переменных, наблюдаемых затем
    в экспериментах.
  statement_en: In solving various physical problems the quality of their mathematical description plays the most
    important role; the nature of physical phenomena is very deeply revealed by the so-called canonical methods
    of solving a certain class of differential equations, discovered in mathematical physics by the Irishman W.R.
    Hamilton almost 200 years ago; the author classes canonical methods under the branch of knowledge called 'analytical
    methods in physics'; the power of these methods is that they allow representing the solution of a problem in
    known physical variables subsequently observed in experiments.
