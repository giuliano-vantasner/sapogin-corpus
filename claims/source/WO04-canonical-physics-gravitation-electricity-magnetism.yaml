  quote_ru: Каноническая форма скопления – газовый пузырь с тонкой стенкой, внутри которого вещества нет.
  statement_en: 'Gas of mass particles: it can take the most diverse forms with different symmetries — plane, cylindrical,
    disk, spherical, toroidal; it can be shapeless formations localized in a bounded region of space; the canonical
    form of the accumulation is a gas bubble with a thin wall inside which there is no substance; the sizes depend
    on the temperature, number, and mass of the particles held by the collective field; the radii can be from 1
    km to solar-system sizes and above; the atmospheres of the accumulations can have a sharp boundary or be diffuse
    — everything depends on the ratio of the temperatures: the gas temperature and the characteristic temperature
    of the system.'
