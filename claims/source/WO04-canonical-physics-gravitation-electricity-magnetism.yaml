- id: SC-WO04-028
  type: physics
  facet: theory
  priority: core
  page: 6
  quote_ru: Пузырьки зарядов, движущиеся между металлическими электродами, образуют конденсатор с осциллирующим
    дипольным моментом.
  statement_en: Charge bubbles moving between metal electrodes form a capacitor with an oscillating dipole moment;
    the oscillating dipole moment creates a Maxwell current whose magnitude is proportional to the rate of change
    of the flux of the electric induction vector (the law of electrodynamical induction (EDI) lost in time, in which
    a variable flux of the electric field generates a variable Maxwell displacement current); the processes of generation
    of alternating displacement current do not obey the energy conservation laws; the EDI law allows creating devices
    for converting alternating current both with power reduction and with superunity power increase in an electric
    circuit — an exceptionally promising direction of creating various technical devices autonomously supplying
    inexhaustible electric energy to the consumer.
