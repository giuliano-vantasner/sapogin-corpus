- id: SC-WO04-012
  type: physics
  facet: theory
  priority: core
  page: 3
  quote_ru: 'Во всех указанных коллективно взаимодействующих физических системах сохраняется полное давление, которое
    всегда содержит в себе два слагаемых: давление поля и давление частиц (либо зарядов, либо токов).'
  statement_en: 'In the class of considered equations the function φ can play the role of a coordinate-dependent
    potential; the derivative over the coordinate is the field strength (gravitational, electric, or magnetic);
    the square of the strength, up to a constant quantity, coincides with the field pressure; the potential function
    plays the role of the pressure of either mass particles (gravitation), or like charges (electrostatics), or
    currents flowing in conductors (magnetism); in all the indicated collectively interacting physical systems the
    full pressure is conserved, which always contains two terms: the field pressure and the pressure of the particles
    (either charges or currents).'
  quantities: []
