  quote_ru: 'Теперь, полученное соотношение (2) можно трактовать как равенство градиентов давлений поля и давления
    частиц, порождающих это поле. Что означает: все рассматриваемые системы удерживаются в ограниченной области
    пространства градиентом давления собственного коллективного поля.'
  statement_en: 'The physical causes of the conservation law are exceptional: if (3) is differentiated with respect
    to the coordinate one arrives at equation (2); the obtained relation (2) can be treated as the equality of the
    pressure gradients of the field and of the pressure of the particles generating this field; this means that
    all the considered systems are held in a bounded region of space by the pressure gradient of their own collective
    field; further integration in (3) is usually carried out in the class of even functions; all solutions contain
    the integral of full pressure of the gaseous system and depend on it.'
