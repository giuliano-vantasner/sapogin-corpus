  quote_ru: В 50-х годах прошлого века советский физик-теоретик Я. Френкель в своей монографии «Статистическая физика»
    построил две системы уравнений.
  statement_en: 'In the 1950s of the last century the Soviet theoretical physicist Ya. Frenkel in his monograph
    ''Statistical Physics'' built two systems of equations: one described a gas of collectively interacting gravitating
    particles, the other a gas of charged particles of one sign; these systems of equations reduced, in the final
    analysis, to equations coinciding with the equations of R. Emden and M. Laue; but Ya. Frenkel apparently did
    not know this, because his work does not refer to this coincidence; in his opinion both systems of equations
    described states of gaseous substance held by a self-consistent field.'
