  page: 6
  quote_ru: 'Только каноническая теория электричества смогла разрешить древний парадокс электростатики: одноимённые
    заряды, сообщённые металлической поверхности, удерживаются от разлёта градиентом давлением собственного электрического
    поля.'
  statement_en: 'Typical charge bubbles observed in nature: a thin-wall charge bubble arising on the surface of
    a metal ball at its charging — in electrostatics the bubble radius coincides with the radius of the ball; only
    the canonical theory of electricity was able to resolve the ancient paradox of electrostatics: like charges
    imparted to a metal surface are held from dispersal by the pressure gradient of their own electric field.'
