  quote_ru: Газ токов. Любой ток, текущий в металле, представляет собой поток заряженных частиц одного знака, приходящих
    из источника.
  statement_en: 'Gas of currents: any current flowing in a metal represents a flow of charged particles of one sign
    arriving from the source; on the one hand the Coulomb force acts between them; on the other hand, currents of
    one direction attract each other by the Ampere force; the moving charges will also interact with the fields
    of the crystal lattice and with their own field; the interaction must depend substantially on the amplitude
    and frequency of the flowing current, the diameter of the wire, and its resistivity; the text then asks how
    to explain the incomprehensible phenomenon arising during current flow — like charges are not thrown off the
    surface by Coulomb forces.'
