  quote_ru: Интеграл позволил понять физические причины кратковременного удержания скопления одноимённых зарядов
    в ограниченной области пространства.
  statement_en: Later mathematical canons were built for other collective phenomena connected with gravitation (interaction
    of mass particles) and the magnetic field (interaction of currents); the canonical description defined the Hamilton
