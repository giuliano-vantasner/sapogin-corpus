  quote_ru: Прикатодный зарядовый кластер К.Шоулдерса микронных размеров в газе электронов.
  statement_en: 'Typical charge bubbles observed in nature also include: Shoulders'' near-cathode charge cluster
    of micron sizes in an electron gas; spherical plasmoids in the atmosphere; laboratory prototypes of ball lightning
    and ball lightning itself — a thin-wall bubble with uncompensated charge; charge clusters discovered in diverse
    experiments with anomalous energy release during current flow in gaseous, liquid, and solid media; space-charge
    waves (SCW) observed in a conductor during current flow — a periodic sequence of charge bubbles; beaded lightning
    consists of a sequence of plasmoid bubbles; the nucleus of any atom is the smallest thin-wall charge bubble
    in nature of fermi sizes with a high temperature of the order of 10^11 K.'
