  statement_en: 'In equation (2) the order of the differential equation can be lowered and the Hamilton function
    of the system obtained as the integral of full pressure; the algorithm for this class of equations is given
    in Kamke''s ''Handbook of Ordinary Differential Equations'', chapter VI, p. 139: multiplying both sides of (2)
