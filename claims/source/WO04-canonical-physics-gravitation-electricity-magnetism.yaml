  quote_ru: Энергия взаимодействия зарядов с полем (энергия связи) огромна и может быть как положительной, так и
    отрицательной величиной.
  statement_en: The interaction energy of charges with the field (binding energy) is enormous and can be both positive
    and negative; in some cases it can be two-three orders greater than the binding energy of the uranium-235 nucleus;
    the interaction energy is stored and usually radiated in the processes of synthesis/decay of charge bubbles;
    if charge bubbles form between metal electrodes, the decay of a bubble throws the excess energy into the capacitor
    in the form of a Maxwell displacement current closed onto the electrodes; it replenishes the energy of the electric
    circuit of the system in which the charge bubbles formed.
