  quote_ru: 'Каноническая форма скопления – газовый пузырь с тонкой стенкой, внутри которого вещества нет. Размеры
    зависят от температуры, числа и массы частиц, удерживаемых коллективным полем. Радиусы могут быть от 1 км до
    размеров солнечной системы и выше. Атмосферы скоплений могут быть с резкой границей и с диффузной. Всё зависит
    от соотношения температур: температуры газа и характеристической температуры системы. Типичные пузыри, наблюдаемые
    в космосе: газовые туманности, звёзды, нейтронные звёзды, пульсары, квазары. Солнце – плазменный газовый пузырь
    с высокой температурой 107 К. Толщина стенки солнечного пузыря может быть на порядок меньше радиуса. Непонятно,
    как огромные силы давления, возникающие внутри любой звезды, могут быть скомпенсированы очень слабыми гравитационными
    силами? Тунгусский феномен – холодный газовый пузырь из ледяной пыли. Был выброшен в космос ледяными гейзерами
    Энцелада. Оценки показывают, что внешний радиус пузыря мог быть 10 км, а внутренний 1 км. Удерживаемая масса
    от 108 до 1010 тонн льда. Чёрные дыры в центрах галактик с массами от 106 до 109 масс Солнца  газовые пузыри
    из нейтронов, водорода, либо гелия размерами в солнечную систему и температурой от 1011 до 1012 К. Энергия взаимодействия
    массовых частиц с полем (энергия связи) огромна и может быть как положительной, так и отрицательной величиной.
    Она будет увеличивать, либо уменьшать наблюдаемую массу скопления по сравнению с аддитивной. Газ зарядов. Может
    принимать самые разнообразные формы с различной симметрией: плоской, цилиндрической, дисковой, сферической и
    тороидальной. Может быть бесформенными образованиями, локализованными в ограниченной области пространства. Каноническая
    форма скопления – газовый пузырь с тонкой стенкой, внутри которого зарядов нет.'
  statement_en: 'Gas of charges: it can take the most diverse forms with different symmetries — plane, cylindrical,
    disk, spherical, toroidal; it can be shapeless formations localized in a bounded region of space; the canonical
    form of the accumulation is a gas bubble with a thin wall inside which there are no charges; it can have a plane,
    tubular, and toroidal configuration; the sizes depend on the temperature, number, and magnitude of the particle
    charges held by the collective field; the radii can be from 50 cm to nuclear sizes; the atmospheres of the accumulations
    can have a sharp boundary, be diffuse, and have a feature at the boundary; everything depends on the ratio of
    the temperatures — of the charge gas and the characteristic temperature of the system — and also on the sign
    of the charges of the accumulation; the distributions of a gas of like positive charges differ from the distributions
    of a gas of negative charges; a gas plasma with uncompensated charge has its own class of distributions which
    can be finite at the boundary.'
