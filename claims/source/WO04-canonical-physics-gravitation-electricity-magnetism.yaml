  quote_ru: В 2000-ом году мне удалось найти математический канон нового, недавно экспериментально открытого, физического
    объекта, названного «зарядовый кластер», К. Шоулдерс (Бодега, США, 1970 г.). Именно каноническое описание, основанное
    на законе сохранения полного давления в газе взаимодействующих зарядов, и переводит зарядовый кластер в новый
    физический объект.
  statement_en: In 2000 the author managed to find the mathematical canon of a new, recently experimentally discovered
    physical object named 'charge cluster' (K. Shoulders, Bodega, USA, 1970); precisely the canonical description
