  quote_ru: В последнем случае на омической нагрузке не возникает аномальный Джоуль. Просто схема берёт из источника
    1 Вт, а в нагрузку забрасывает 100 Вт, при коэффициенте преобразования мощности равном 100.
  statement_en: 'From (6) three power-conversion cases are possible: below unity (НЕП), unity, and super-unity (СЕП);
    in the super-unity case no anomalous Joule arises on the ohmic load — the circuit simply takes 1 W from the
    source and throws 100 W into the load at a conversion coefficient of 100.'
