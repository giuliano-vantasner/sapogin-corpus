- id: SC-TC05-001
  type: experimental
  facet: experiment
  priority: core
  page: 3
  quote_ru: Он смог «рассмотреть» пикосекундную структуру тока, возникающего между двумя электродами в вакууме,
    при импульсном напряжении порядка 10 кВ. Оказалось, что ток в вакуумном промежутке, ограниченным острийным катодом
    и планарным анодом, может дробиться на порции размерами до 10-и микрометров, содержащие в кластере от 108 до
    1011 электронов.
  statement_en: 'K. Shoulders'' outstanding discovery (1970s): he ''resolved'' the picosecond structure of the current
    between two electrodes in vacuum at impulse voltage of order 10 kV; the current in the vacuum gap bounded by
    a point cathode and planar anode can break into portions up to 10 micrometers in size containing from 10^8 to
    10^11 electrons in a cluster.'
  quantities:
  - U ~ 10 кВ (импульсное)
  - d(порции) ≤ 10 мкм
  - N(электронов в кластере) = 10^8–10^11
