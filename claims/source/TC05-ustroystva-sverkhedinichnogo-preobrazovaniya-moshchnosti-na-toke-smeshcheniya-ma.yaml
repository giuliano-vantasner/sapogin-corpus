- id: SC-TC05-017
  type: physical
  facet: recipe
  priority: core
  page: 6
  quote_ru: представляет собой генератор тока смещения (ГТС). Внутренний излучающий конденсатор (ИК) отмечен пунктиром.
    Он может иметь обкладки из металлической сетки. Для увеличения его ёмкости можно применять любой диэлектрик
    5. Приёмный конденсатор (ПК) (клеммы 3- 4) находится на оси системы и имеет металлические обкладки.
  statement_en: 'The simplest model of a capacitor with oscillating dipole moment is the ''flat capacitor inside
    a flat capacitor'' cell — a displacement-current generator (ГТС): the inner radiating capacitor (ИК) may have
    mesh plates and any dielectric (5) to increase capacitance; the receiving capacitor (ПК) (terminals 3-4) sits
    on the system axis with metal plates; the region occupied by the radiating capacitor with dielectric creates
    a volume V containing the variable dipole moment arising when AC voltage U is applied to terminals 1-2.'
  quantities: []
  equations: []
  materials:
  - металлическая сетка (обкладки ИК)
  - диэлектрик (позиция 5)
  geometry:
