  quote_ru: Физическое явление, лежащее в основе работы устройства [1], требует наличие источника постоянного тока.
    Без него неустойчивость плазмы возникнуть не может. Вследствие этого, коэффициент преобразования мощности источника
    постоянного тока в мощность флуктуационно- индукционного тока будет меньше 1.
  statement_en: That the bending oscillations of graphene arising from plasma instability turned the graphene film
    into a source of chaotic displacement current was an important finding (nanoscale energy harvesters proposed);
    but the physical phenomenon underlying device [1] requires a DC source — without it the plasma instability cannot
    arise; hence the power conversion coefficient of the DC source into fluctuation-induction current power will
    be less than 1.
