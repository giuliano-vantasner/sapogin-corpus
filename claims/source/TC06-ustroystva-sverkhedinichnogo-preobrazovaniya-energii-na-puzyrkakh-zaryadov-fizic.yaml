  type: physics
  facet: theory
  priority: core
  page: 4
  quote_ru: Из (3) видно, что на гигагерцах и выше амплитуда тока смещения огромна. На таких частотах в металлических
    экранах любой толщины ток смещения генерирует переменные дипольные моменты, которые превращают экраны в излучатели
    электромагнитной энергии. Экран, выполненный в виде «клетки Фарадея», уже пропускает через себя электромагнитные
    волны. Излучение такой частоты и большой амплитуды, направленное на микросхему, уничтожает её за микросекунды.
  statement_en: 'For the ''capacitor in capacitor'' cell the amplitude displacement current reduces to iM = A·C·U·ν;
    from (3), at gigahertz and above the displacement-current amplitude is enormous: at such frequencies, in metal
    screens of any thickness, the displacement current generates variable dipole moments turning the screens into
    emitters of electromagnetic energy — a Faraday-cage screen already passes EM waves, and radiation of such frequency
    and large amplitude directed at a microchip destroys it within microseconds.'
  quantities:
