  quote_ru: Неупругое взаимодействие полого сферического кластера зарядов с титаном оставляет характерный кольцевой
    проплавленный кратер с валиком из нерасплавленного вещества в центре. Кратер был зафиксирован в [2] на снимке,
    сделанном на электронном микроскопе. По объёму выплавленного металла удалось с достаточной точностью определить
    количество электронов в падающем на поверхность пузырьке.
  statement_en: 'The order of the electron number in a cluster was obtained from the distribution function of a
    charge bubble striking a plane surface: inelastic interaction of a hollow spherical charge cluster with titanium
