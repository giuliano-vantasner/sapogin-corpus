- id: SC-TC06-021
  type: physical
  facet: recipe
  priority: core
  page: 5
  quote_ru: 1. Нужно создать область, в которой дипольный момент, излучаемый веществом, изменяется периодически,
    а не хаотически.
  statement_en: 'The law in forms (2) and (3) can only propose a technology for building an AC device; whether the
    device performs super-unity energy conversion will be shown only by experiments. Technology steps 1-5: (1) create
    a region where the dipole moment emitted by the substance varies periodically, not chaotically; (2) the periodic
    electric moment generates corresponding displacement currents in the transmitting capacitor containing seed
    dipole moments; (3) the stationary transmitting capacitor becomes a capacitor with oscillating dipole charge;
    (4) the oscillating charge creates displacement currents, part of which enters the conducting plates of the
    receiving capacitor and turns into conduction currents; (5) the receiving-capacitor plates become a source of
    alternating voltage to be switched into a series LCR circuit operating in the current-instability mode (design
    method in [6]).'
  quantities: []
  equations: []
  materials: []
  geometry: []
  procedure_steps:
  - создать область периодически изменяющегося дипольного момента
  - периодический момент генерирует токи смещения в передающем конденсаторе с затравочными диполями
  - передающий конденсатор становится конденсатором с осциллирующим зарядом диполей
  - токи смещения частично попадают в пластины приёмного конденсатора и превращаются в токи проводимости
  - включить приёмный конденсатор в последовательный LCR-контур в режиме токовой неустойчивости
  measurements: []
  schematic_refs:
  - 'Технология: шаги 1-5'
