  quote_ru: Когда исследователи приложили однородное электрическое поле в [1] поперёк плёнки графена, то они вызвали
    в плёнке плазменную неустойчивость. Она проявила себя в том, что в графене стали образовываться сильно неоднородные
    области зарядов.
  statement_en: 'Applying a homogeneous electric field across the graphene film caused a plasma instability in it:
    strongly inhomogeneous charge regions formed in the graphene; these regions of bound electrons aligned across
    the film creating structures of dipole electric moments of different direction; the moment values differed between
    microregions and fluctuated in time creating a total dipole moment changing in space and time; the resulting
    chaotic field strongly depended on the seed value of the external field strength.'
