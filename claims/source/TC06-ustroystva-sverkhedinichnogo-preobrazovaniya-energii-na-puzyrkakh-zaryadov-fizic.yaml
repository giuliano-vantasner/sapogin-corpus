  quote_ru: Похожие микроскопические пузырьки зарядов из электронов, имеющих время высвечивания порядка двести пикосекунд,
    были обнаружены на острие
  statement_en: 'Heated graphene film is in continuous mechanical motion: the thermal motion of the graphene plasma
    constantly redistributes electron positions around lattice ions; instabilities inside the plasma can generate
    individual charge clusters (charge bubbles), apparently of picoscopic size, consisting of electrons, which generate
    collective thermal electric fields acting back on the lattice ions; similar microscopic electron charge bubbles
    with decay time of about two hundred picoseconds were discovered by K. Shoulders on the point of a vacuum diode.'
