  quote_ru: Исследования маломощных устройств, проведённые профессором по заказу общины в 1985 году, настолько его
    изумили, что он стал сомневаться в существовании любых законов сохранения, найденных «бумажной» физикой.
  statement_en: Unfortunately P. Baumann could not understand the physical-technical bases of the operation of his
    unique source; he wrote no articles himself and took no patents on his devices; readers first learned of the
