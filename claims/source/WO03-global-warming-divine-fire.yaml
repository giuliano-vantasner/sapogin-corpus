  quote_ru: Конструктивное решение устройства П. Баумана представляло собой усовершенствованный вариант электрической
    машины Д. Вимшурста (1883 г).
  statement_en: 'The constructive solution of Baumann''s device was an improved variant of the Wimshurst electric
    machine (1883): the pair of dielectric disks with applied electrization layers was replaced by Baumann with
    a pair of acrylic disks; tens of radial strips of electret were glued onto the disks; the brushes removing the
    electric charge from the electrization layer were removed; U-shaped plates of a capacitor connected to a high-voltage
    Tesla transformer transmit the charge to Leyden jars.'
