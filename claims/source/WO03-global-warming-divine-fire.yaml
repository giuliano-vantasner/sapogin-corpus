  quote_ru: Каноническое описание определило Гамильтонову функцию рассматриваемых коллективных систем в виде интеграла
    «живых сил»  интеграла полного давления.
  statement_en: The mechanisms of matter retention by a self-consistent field were investigated; a canonical physics
    of collective phenomena connected with gravitation (interaction of mass particles), with electricity (interaction
    of like-sign charges), and with magnetism (interaction of variable currents) was built; the canonical description
    defined the Hamilton function of the considered collective systems as the integral of 'living forces' — the
    integral of full pressure; the integral allowed understanding how plane and cylindrical layers, as well as bubbles
    of like-sign charges, can be held by the pressure of the collective electric field of the system analogously
    to how magnetic-field pressure holds hot plasma in thermonuclear fusion.
