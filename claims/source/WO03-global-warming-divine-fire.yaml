- id: SC-WO03-020
  type: physics
  facet: theory
  priority: core
  page: 4
  quote_ru: Оказалось, что при движении осциллирующего заряда в потенциальной яме привычные законы сохранения энергии
    не выполняются, и возможно как уменьшение полной энергии заряда, так и её увеличение.
  statement_en: '30 years ago an initiative group was organized for researching the physical mechanisms of the operation
    of the Testatika machine; the group began with studying the ideas expressed by S. Marinov; the technology of
    extracting electric energy turned out so science-intensive that several scientific directions had to be developed
    to understand the physics of its operation; among them: the regularities of motion of a wave-packet-charge in
    static force fields at nuclear and subnuclear scales were studied — it turned out that in the motion of an oscillating
    charge in a potential well the habitual energy conservation laws do not hold, and both a decrease and an increase
    of the total energy of the charge are possible.'
