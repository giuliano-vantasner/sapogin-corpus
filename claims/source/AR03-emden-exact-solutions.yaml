  priority: normal
  page: 1
  quote_ru: Подстановка y  (  )  2 , где   ln( x ) приводит к уравнению (штрихи означают дифференцирование
    по )
  statement_en: 'Equation (1) has a class of exact solutions for a = 1 (cylindrical symmetry): the substitution
    y = η(ξ) − 2ξ, ξ = ln(x) leads to η″ + β²exp(η) = 0 (2) with β² = b > 0; equation (2) admits order reduction
    and has the first integral (η′)²/2 + β²exp(η) = C(η′,η,0) = const > 0 (3); integrating (3) a second time gives
    the first exact general solution (4) for y with a new arbitrary constant x₀ = exp(ξ₀).'
  quantities:
  - a = 1 (cylindrical symmetry)
  - beta^2 = b > 0
  equations:
  - \eta'' + \beta^2\exp(\eta) = 0
  - \frac{(\eta')^2}{2} + \beta^2\exp(\eta) = C(\eta',\eta,0) = \mathrm{const} > 0
  materials: []
