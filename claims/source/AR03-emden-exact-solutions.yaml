  page: 2
  quote_ru: Интегралы плоской симметрии совпадают с полным давлением исследуемых систем, состоящим из давления поля
    и давления частиц (либо зарядов) системы, и позволяют выявить механизмы удержания вещества самосогласованным
    полем [4–6].
  statement_en: Equation (1) at a = 0 (plane symmetry) also admits order reduction and has, for b > 0 and b < 0,
    first integrals structurally similar to integrals (3) and (5); the plane-symmetry integrals coincide with the
    full pressure of the systems under study, consisting of the field pressure and the pressure of the particles
    (or charges) of the system, and allow one to reveal the mechanisms of matter retention by the self-consistent
    field.
