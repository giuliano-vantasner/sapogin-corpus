  quote_ru: Е-уравнение Эмдена, полученное в [1], относится к классу нелинейных обыкновенных дифференциальных уравнений
    второго порядка. Вместе с уравнением Эмдена-Фаулера оно играло важную роль на первом этапе решения задач о строении
    звезд, рассматриваемых как газовые образования, находящиеся в политропическом или изотермическом равновесиях
    [2].
  statement_en: The E-Emden equation, obtained in [1], belongs to the class of nonlinear second-order ordinary differential
    equations; together with the Emden-Fowler equation it played an important role at the first stage of solving
    stellar-structure problems, the stars being considered as gaseous formations in polytropic or isothermal equilibria.
