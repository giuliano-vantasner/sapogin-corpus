  quote_ru: Уравнение (5) имеет три типа решений. Первое из них получается из условия H= P12 >0.
  statement_en: 'Equation (5) has three types of solutions: the first is obtained from the condition H = P₁² > 0
    (quadrature (6) with sign function σ = sign(η′), giving exp(±η/2) via a hyperbolic sine (7) and the second exact
    general solution (8)); the third exact solution is obtained from the condition H = 0 and has the form y = −ln[−(bx²/2)·ln²(x₀/x)]
    (9); from the condition H = −P₂² < 0 one obtains the last exact solution (10) with a squared sine of ln(x₀/x).'
  quantities:
  - H = P1^2 > 0
  - H = 0
  - H = -P2^2 < 0
  equations:
  - y = -\ln\!\left[-\frac{b x^2}{2}\,\mathrm{sh}^2\!\left(P_1\ln(x_0/x)\right)\right]
  - y = -\ln\!\left[-\frac{b x^2}{2}\,\ln^2(x_0/x)\right]
  - y = -\ln\!\left[-\frac{b x^2}{P_2}\,\sin^2\!\left(\frac{P_2}{2}\ln(x_0/x)\right)\right]
