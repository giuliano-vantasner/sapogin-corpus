- id: SC-AR06-002
  type: physics
  facet: theory
  priority: core
  page: 1
  quote_ru: 'Численное моделирование показывает, что в рассмотренной системе могут существовать три класса периодических
    решений: в низкодобротном колебательном контуре они имеют вид затухающих колебаний; в контуре со средней добротностью
    они имеют вид биений, возникающих при параметрическом резонансе Мандельштама-Папалекси, а в высокодобротном
    контуре может развиваться токовая неустойчивость. Она проявляет себя в том, что приводит к неограниченному росту
    колебаний заряда и тока ёмкости для определённых значений глубины модуляции реактивного параметра.'
  statement_en: 'Numerical modeling shows that three classes of periodic solutions can exist in the system: in a
    low-Q circuit they are damped oscillations; in a medium-Q circuit they are beats arising from the Mandelshtam-Papaleksi
    parametric resonance; in a high-Q circuit a current instability can develop, which manifests itself in unlimited
    growth of charge oscillations and capacitance current for certain values of the reactive-parameter modulation
    depth.'
  quantities: []
  equations: []
