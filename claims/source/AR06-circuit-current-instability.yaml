    или нарастающих во времени колебаний на переменной частоте, близкой к резонансу.
  statement_en: In the general case 0 < ε < 1, periodic oscillations in the circuit with dissipation occur under
    the action of a restoring 'pumping force' depending on time and coordinate; the circuit energy is not conserved
