  quote_ru: 'Каноническое уравнение Хилла для смещения z(x) описывает уникальную колебательную систему, в которой
    обобщённая «жесткость» пружинного маятника с единичной массой зависит от двух конкурирующих факторов: статической
    диссипации системы ~ 1 / 4Q 2 и 1 динамической раскачки периодической возвращающей «силой» ~'
  statement_en: 'The canonical Hill equation for the displacement z(x) describes a unique oscillatory system in
    which the generalized ''stiffness'' of a unit-mass spring pendulum depends on two competing factors: static
