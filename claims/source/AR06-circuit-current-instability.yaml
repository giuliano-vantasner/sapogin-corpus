- id: SC-AR06-028
  type: physical
  facet: phenomenology
  priority: normal
  page: 8
  quote_ru: Отметим, что этот принцип известен миллионы лет жгутиковым бактериям, которые перемещаются в межклеточной
    жидкости. Опубликованные в январе 2018 года в Nature работы биологов объяснили принцип их перемещения, названный
    flagellar motors [6]. Внутри осесимметричного тела бактерии, диаметром порядка 100 нм, располагаются несколько
    слоёв мембран. Каждая мембрана выполнена в виде пропеллера и содержит в себе проводящие радиальные сектора (как
    на рис. 5). Различные бактерии имеют от 13 до 17 радиальных секторов в роторе. Можно оценить среднее количество
    разделённых зарядов для пробойной напряженности электрического поля в жидкости 5 мВ/нм. Для всей мембраны оно
    составляет порядок 20 электронов. То есть, на одном проводящем секторе мембраны размещается от одного до двух
    электронов. Такое разделение разноимённых зарядов и создает вращение бактерии, приводя её к перемещению в межклеточной
    жидкости.
  statement_en: This mechano-electric principle has been known for millions of years to flagellate bacteria moving
    in intercellular fluid; works published in Nature in January 2018 explained their movement principle, named
    flagellar motors; inside the axisymmetric bacterium body of about 100 nm diameter several membrane layers are
    located, each membrane made as a propeller and containing conducting radial sectors (as in Fig. 5); different
    bacteria have from 13 to 17 radial sectors in the rotor.
