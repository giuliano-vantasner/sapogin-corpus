- id: SC-AR06-001
  type: physics
  facet: theory
  priority: core
  page: 1
  quote_ru: 'Найдена физико-математическая модель, которая описывает периодическое изменение заряда в последовательном
    колебательном контуре без источника тока с механически изменяющейся по гармоническому закону ёмкостью. В уравнение
    входят три безразмерных параметра системы: добротность, отношение частоты модуляции ёмкости к частоте колебательного
    контура, и приведённая амплитуда модуляции реактивного параметра.'
  statement_en: 'A physical-mathematical model has been found describing the periodic change of charge in a series
    oscillating circuit without a current source, with capacitance varying mechanically according to a harmonic
    law; the equation contains three dimensionless system parameters: the quality factor, the ratio of the capacitance
    modulation frequency to the circuit frequency, and the reduced amplitude of the reactive-parameter modulation.'
  quantities: []
