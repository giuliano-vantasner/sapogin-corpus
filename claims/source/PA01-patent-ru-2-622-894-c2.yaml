- id: SC-PA01-003
  type: physics
  facet: recipe
  priority: normal
  page: 9
  quote_ru: '3. Планарная индуктивность с расширенным частотным диапазоном по п. 1, отличающаяся тем, что металлическая
    пленка (4), образующая витки планарной Стр.: 9 RU 2 622 894 C2 индуктивности, содержит, кроме упомянутого в
    п. 1 первого (6) участка металлической пленки (4), последовательно соединенные по длине второй (10) и N-й (11)
    (N=3, 4, …) дополнительные участки металлической пленки (4), к электрическим выводам от которых подключены входы
    соответственно второго (12) и N-го (13) (N=3, 4, …) 5 неинвертирующих повторителей напряжения, а также выходы
    второго (14) и N-го (15) (N=3, 4, …) неинвертирующих повторителей тока с низким входным и высоким выходным сопротивлениями,
    причем между выходами второго (12) и N-го (13) (N=3, 4, …) неинвертирующих повторителей напряжения и входами
    второго (14) и N-го (15) (N=3, 4, …) неинвертирующих повторителей тока включены соответствующие второй 10 (16)
    и N-й (17) (N=3, 4, …) корректирующие конденсаторы.'
  statement_en: 'Patent claim 3 (verbatim): the planar inductance of claim 1, characterized in that the metal film
    (4) forming the coils contains, besides the first (6) section, a second (10) and an N-th (11) (N=3,4,...) additional
    film sections connected in series along the length, to whose electrical terminals the inputs of the second (12)
    and N-th (13) non-inverting voltage followers and the outputs of the second (14) and N-th (15) non-inverting
    current followers are connected, with corresponding second (16) and N-th (17) correcting capacitors inserted
    between the voltage-follower outputs and the current-follower inputs.'
  quantities: []
