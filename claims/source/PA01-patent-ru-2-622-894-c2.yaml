- id: SC-PA01-001
  type: physics
  facet: recipe
  priority: normal
  page: 9
  quote_ru: 1. Планарная индуктивность с расширенным частотным диапазоном, содержащая первый (1) сигнальный и второй
    (2) общий выводы индуктивности, которые соединены по поверхности подложки (3) металлической пленкой (4), образующей
    витки планарной индуктивности, первый (5) неинвертирующий повторитель напряжения, вход которого 35 соединен
    с первым (6) участком металлической пленки (4), связанным с первым (1) сигнальным выводом индуктивности, общий
    металлический слой (7), на котором размещена подложка (3), отличающаяся тем, что в схему введен первый (8) неинвертирующий
    повторитель тока с низким входным и высоким выходным сопротивлениями, выход которого соединен с первым (6) участком
    металлической 40 пленки (4), связанным с первым (1) сигнальным выводом индуктивности, а вход через первый (9)
    корректирующий конденсатор подключен к выходу первого (5) неинвертирующего повторителя напряжения.
  statement_en: 'Patent claim 1 (verbatim): a planar inductance with extended frequency range containing a first
    (1) signal and second (2) common terminals connected along the substrate (3) surface by a metal film (4) forming
    the planar-inductance coils, a first (5) non-inverting voltage follower whose input is connected to the first
    (6) section of the metal film (4) tied to the first (1) signal terminal, and a common metal layer (7) carrying
    the substrate (3), characterized in that a first (8) non-inverting current follower with low input and high
    output impedances is introduced into the circuit, its output connected to the first (6) section of the metal
    film (4) and its input, through a first (9) correcting capacitor, connected to the output of the first (5) non-inverting
    voltage follower.'
  quantities: []
