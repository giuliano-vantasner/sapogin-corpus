- id: SC-PA01-005
  type: physics
  facet: theory
  priority: normal
  page: 8
  quote_ru: Из формулы (3) следует, что при Ki=1, Ky=1 за счет выбора отношения емкостей 20 корректирующих конденсаторов
    18 (С18) и 9 (С9) (например, С9≈С18) можно обеспечить увеличение ω0 заявляемой интегральной индуктивности в
    несколько раз.
  statement_en: 'From formula (3): at Ki=1, Ky=1, by choosing the ratio of the correcting-capacitor capacitances
    18 (C18) and 9 (C9) (e.g. C9≈C18) the own resonance frequency ω0 of the claimed integrated inductance can be
    increased several times; the graphs of figs. 5, 6, 8, 9 show that ω0 increases (depending on the inductance
    parasitic capacitances) by a factor of 2-4.'
