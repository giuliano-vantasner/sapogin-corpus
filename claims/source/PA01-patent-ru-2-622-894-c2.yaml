  statement_en: The claimed inductance uses non-inverting current amplifiers (e.g. common-base stages) and non-inverting
    voltage followers (emitter followers etc.); with SiGe-process transistors (IHP, Germany) with fα=200-300 GHz,
    the non-inverting current amplifier 8 and voltage follower 5 can operate in the extremely high frequency range
    50-80 GHz, providing effective compensation of parasitic capacitances.
