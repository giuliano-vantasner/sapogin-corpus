  quote_ru: 'например, при использовании транзисторов SiGe техпроцесса (IHP, Германия) с fα=200- Стр.: 8 RU 2 622
    894 C2 300 ГГц, неинвертирующий усилитель тока 8 и неинвертирующий повторитель напряжения 5 могут работать в
