- id: SC-PA01-004
  type: physics
  facet: recipe
  priority: normal
  page: 5
  quote_ru: Основная задача предлагаемого изобретения состоит в расширении диапазона 40 рабочих частот планарной
    индуктивности без применения в ее конструкции проводящего лепесткового экрана.
  statement_en: The main object of the invention is to extend the working-frequency range of the planar inductance
    without using a conducting petal screen in its construction, which essentially simplifies the inductance design
    because the number of deposited conducting layers decreases (the closest prototype, US 6.833.603, requires a
    special conducting screen under the metal-film coils, without which the own resonance frequency ω0 takes small
    values).
