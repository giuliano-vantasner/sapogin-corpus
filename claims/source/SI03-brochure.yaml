  page: § Газовые шары Эмдена в самосогласованной теории гравитации
  quote_ru: Из оценок следует, что Тунгусский феномен мог представлять собой полый, рыхлый космический «снежок» огромной массы, состоящий из ледяных пылинок. Плотность потока частиц при падении такого «снежка»
    на землю будет существенно меньше в центре, чем в соседних слоях. Тогда в эпицентре падения производимые разрушения будут минимальны, что совпадает с наблюдениями экспедиции Кулика. Cнежок мог быть
    сформирован ледяными гейзерами Энцелада – 61-го спутника Сатурна.
  statement_en: Sapogin asserts estimates indicate the Tunguska phenomenon could have been a hollow, loose cosmic 'snowball' of huge mass made of ice dust; particle flux density at impact is much lower
    at the centre than in adjacent layers, so destruction at the epicentre is minimal, matching Kulik's expedition observations; the snowball could have been formed by the ice geysers of Enceladus, the
    61st satellite of Saturn.
  quantities: []
