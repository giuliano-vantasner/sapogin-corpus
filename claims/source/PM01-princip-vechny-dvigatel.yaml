  quote_ru: Только в наше время кое-кому стало понятно, что земляне 200 лет назад обнаружили принцип построения
    уникальных устройств, в которых бесплатная энергия гравитационного поля могла превращаться в энергию самовращения
    вертушки. Устройство для своей длительной работы требовало затравочную энергию только в момент запуска.
  statement_en: Only in our time did it become clear to some that 200 years ago earthlings discovered the construction
    principle of unique devices in which the free energy of the gravitational field could be converted into the
    self-rotation energy of a wheel; for its long operation the device required seed energy only at the moment of
    launch.
