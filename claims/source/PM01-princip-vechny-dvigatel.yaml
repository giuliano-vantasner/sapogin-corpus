- id: SC-PM01-007
  type: physics
  facet: theory
  priority: core
  page: 3
  quote_ru: 'Джордж Габриэль Стокс (1845 г) обнаружил, что при вращении вертушки существует четыре взаимосвязанных
    закона сохранения: два векторных и два скалярных.'
  statement_en: 'George Gabriel Stokes (1845) discovered that at wheel rotation there exist four interrelated conservation
    laws: two vector and two scalar; they arise because the total torque vector applied to the wheel is zero — the
    action torque vector always equals the counter-action torque vector with opposite directions; the vector conservation
    laws are the conservation of the angular momentum vector and the angular velocity vector following from it;
    the scalar laws are the conservation of the wheel rotational energy and the conservation of power (obtained
    by multiplying both sides of the constant-torque equality by the constant angular velocity).'
  quantities: []
  equations: []
  materials: []
  geometry: []
  procedure_steps: []
  measurements: []
  schematic_refs: []
