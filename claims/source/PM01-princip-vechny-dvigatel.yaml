  quote_ru: 'Исследовано несколько вариантов: механические вертушки на скачке гравитационного поля  опыты Aldo
    Kosta (2000) и Игоря Белецкого (2023); вертушка Поля Баумана (1970) на скачке электрического поля «Тестатики»;
    подшипник Николаева на скачке магнитного поля (1980); источник тепла Росси-Фокарди  на скачке тока смещения
    (2002); конденсатор-бабочка Белецкого (2020). Инженеры создали ВД на силе Архимеда, на поле упругих сил, назвали
    их бестопливными генераторами (БТГ), и выставили в интернет.'
  statement_en: 'The initiative group (Sapogin L.G., Dzhanibekov V.A., Sapogin V.G., Savin Yu.P., 30 years of search)
    studied the physics of new energy devices: cold fusion (УТС), the Mandelstam-Papaleksi, Fleischmann-Pons, Katorgin-Marin,
    Rossi-Focardi experiments, and various working ВД technologies; several variants studied: mechanical wheels
    on the gravitational field jump (Aldo Costa 2000, Igor Beletsky 2023), Paul Bauman''s wheel on the electric
    field jump of the ''Testatika'' (1970), the Nikolaev bearing on the magnetic field jump (1980), the Rossi-Focardi
    heat source on the displacement current jump (2002), Beletsky''s butterfly capacitor (2020); engineers created
    ВД on the Archimedes force and the elastic-force field, called them fuel-free generators (БТГ) and posted them
    on the Internet.'
