- id: SC-PM01-008
  type: physics
  facet: theory
  priority: core
  page: 4
  quote_ru: И оказывается, что в ВД мощность момента силы действия вертушки всегда будет равна суммарной мощности
    момента сил противодействия – сил трения. Вертушка непрерывно забирает энергию из гравитационного «бензобака»
    и компенсирует ею потери мощности «ненавистного» трения.
  statement_en: 'In the ВД the power of the wheel''s action-force moment always equals the total power of the counter-action
    moment of the friction forces: the wheel continuously draws energy from the gravitational ''fuel tank'' and
    compensates with it the power losses of the ''hateful'' friction; the rate of gravitational-field energy intake
    has a definite direction coinciding with the rate of its absorption by friction, and therefore the ВД rotates
    at constant angular velocity.'
