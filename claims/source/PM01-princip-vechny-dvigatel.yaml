  quote_ru: Момент самовращения закручивает вертушку. Половину периода она забирает энергию из скачка поля, а вторую
    половину периода часть энергии возвращает назад. Обычно, возвращает меньше, чем забирает на первой половине
    периода. Так ВД участвует в длительном самовращении.
  statement_en: 'The self-rotation moment spins the wheel: for half the period it draws energy from the field jump,
    for the second half it returns part of the energy back — usually less than it drew in the first half-period;
    thus the ВД participates in long self-rotation, and thus some bodies can move linearly at constant speed in
    the gravity field in the presence of friction.'
