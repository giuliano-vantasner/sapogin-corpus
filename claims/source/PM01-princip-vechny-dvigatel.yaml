  quote_ru: Если движение тела происходит в таком поле по замкнутой траектории, то однородная сила, действующая
    на тело, работу за цикл не совершает. Правильный математический результат.
  statement_en: 'The circulation computed for the rotational motion of a single mass in a uniform gravity field
    equals zero — the remarkable property of the total mechanical energy conservation law for motion in a static
    potential field without friction: if the body moves along a closed trajectory in such a field, the uniform force
    acting on the body does no work over the cycle — a correct mathematical result.'
