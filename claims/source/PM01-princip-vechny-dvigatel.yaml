  quote_ru: А если сила действия приложена, то трение не может изменить вращательную энергию движущегося тела. Мощность
    силы действия будет всё время компенсировать мощность силы трения.
  statement_en: 'Such a motion variant in a friction medium exists — it is realized for moving bodies to which the
