- id: SC-PM01-005
  type: physics
  facet: theory
  priority: core
  page: 3
  quote_ru: Если вы запишете уравнение Ньютона для динамики вращательного движения (три момента сил), то оно имеет
    одно точное решение, при котором в среде с трением угловое ускорение вертушки будет равно нулю, а она будет
    крутиться с постоянной угловой скоростью.
  statement_en: 'In working ВД constructions three torques act on the masses on the wheel: the gravity moment (the
    internal self-rotation moment), the sliding-friction moment, and the air viscous-friction moment; Newton''s
    equation for rotational dynamics with three torques has one exact solution in which, in a medium with friction,
    the wheel angular acceleration is zero and it rotates at constant angular velocity.'
