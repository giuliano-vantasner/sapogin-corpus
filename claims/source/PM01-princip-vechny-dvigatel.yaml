  quote_ru: Вековое противостояние теоретиков с техническим устройством ВД выиграл ВД. Вертушку вращает механический
    принцип Стокса, утерянный в веках.
  statement_en: 'The age-long confrontation of theoreticians with the technical device of the perpetual motion machine
