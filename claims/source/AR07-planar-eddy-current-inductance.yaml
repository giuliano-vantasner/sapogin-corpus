  quote_ru: Табл. 2 указывает на возможность дальнейшего уменьшения площади, занимаемой интегральной индуктивностью.
    Такое уменьшение может привести к достижению предельных значений поверхностной плотности индуктивности вплоть
    до порядка 10 Гн/м2. Наноразмерный эффект перспективной технологии «проводящая плёнка в токовом кольца». Планарные
    индуктивности, которые реализуются на диэлектрической подложке в виде многовитковых круглых, спиральных, квадратных
    или более сложных геометрических форм широко используются в современных устройствах связи и телекоммуникаций
    в структурах «система на кристалле» или «система в корпусе» [10]. В ряде случаев интегральная индуктивность,
    предназначенная для СВЧ диапазона, выполняется в виде одного витка [10] из напыляемой на подложку металлической
    пленки, образующей токовое кольцо. Однако такое конструктивно-технологическое решение уменьшает численное значение
    индуктивности до единиц наногенри (она изменяется в диапазоне от 0,5 до 3,5 нГн для геометрических размеров
    от 20 мкм до 100 мкм, [10]). Рассмотрим конструкцию планарной индуктивности, которая использует обнаруженный
    выше наноразмерный эффект при своей реализации. Она приведена на рис. 5 и использует известную одновитковую
    топологию её создания [10]. Дополнительная Токовое тонкая пленка кольцо R A B R2 R1 1 2 Подложка а) Дополнительная
    Токовое тонкая пленка кольцо R h2 h1 Подложка б) Рис. 5. Предлагаемая конструкция индуктивности (а) и ее разрез
