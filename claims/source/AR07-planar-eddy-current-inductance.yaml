- id: SC-AR07-001
  type: physics
  facet: theory
  priority: core
  page: 1
  quote_ru: Предложен метод расчёта индуктивности сплошного немагнитного проводящего цилиндра произвольных геометрических
    размеров с азимутальной плотностью вихревого тока при наличии омических потерь и магнитных свойств токов Фуко.
  statement_en: A method is proposed for calculating the inductance of a solid nonmagnetic conducting cylinder of
    arbitrary geometric dimensions with azimuthal eddy-current density in the presence of ohmic losses and magnetic
    properties of Foucault (eddy) currents; radial distributions of the azimuthal component of the eddy electric
    field strength, Foucault current densities, and specific thermal power released in a local region of the cylinder
    are obtained.
