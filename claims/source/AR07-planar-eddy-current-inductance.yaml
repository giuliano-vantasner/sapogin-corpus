  quote_ru: Как видно из табл. 3, индуктивность изменяется в диапазоне от 100 нГн до 14 нГн, что значительно лучше
    (в 7-50 раз) максимальной индуктивности известных в КМОП – традиционных технологиях, достигаемых в одном слое
    [11].
  statement_en: 'The proposed construction of positive planar inductance with the ''conducting film in current ring''
    technology has essential advantages in the achievable microscopic integral inductance compared with the classical
    single-turn solution; the nanoscale effect discovered experimentally in [4] and confirmed theoretically in this
    work allows realizing higher microscopic inductance: per Table 3 the inductance varies from 100 nH to 14 nH,
    which is significantly better (7-50 times) than the maximum inductance of known CMOS traditional technologies
    achieved in a single layer; the choice of the film material resistivity allows shifting the operating frequency
    range of the proposed inductance into a specified frequency band.'
