- id: SC-AR07-002
  type: physics
  facet: theory
  priority: core
  page: 1
  quote_ru: Получены радиальные распределения азимутальной компоненты вектора напряженности вихревого электрического
    поля, плотности токов Фуко, удельной тепловой мощности, выделяемой в локальной области проводящего цилиндра.
    Из энергетических соображений получена формула для динамической частотно-зависимой индуктивности сплошного цилиндра.
    Из неё следует, что динамическая индуктивность обращается в нуль для двух характеристических частот системы
    и имеет положительные и отрицательные значения. Предложен метод расчёта частотно-независимой токовихревой индуктивности
    тонкой проводящей цилиндрической плёнки.
  statement_en: From energy considerations a formula is obtained for the dynamic frequency-dependent inductance
    of a solid cylinder; the dynamic inductance vanishes at two characteristic frequencies of the system and takes
    positive and negative values; a method is proposed for calculating the frequency-independent eddy-current inductance
    of a thin conducting cylindrical film.
