  statement_en: 'A substantial shortcoming of the model is that at ultra-low frequencies compared with the frequency
    scale the L(f) dependence has an unremovable singularity: the induced Foucault current squared is proportional
    to the frequency squared, and since the dynamic inductance is the proportionality coefficient between magnetic-field
    energy and current squared, the frequency squared enters the denominator; as f → 0 heating losses become small,
    the response field weak, the external-field energy constant — the current tending to zero gives an L increase
    ~ 1/f²; consequently the dynamic inductance does not pass into the static inductance at low frequencies, while
    in the experiments of [2] such a transition is always observed.'
