    r2 pv  j2  p* sin 2 t , (12) R2 где p*  j*2   2 f 2 B02 R 2 /  (13)  масштаб объемной плотности тепловой
    мощности. Как видно из (13), удельная мощность уже пропорциональна квадрату частоты и для проводящей среды с
    произвольным значением удельного сопротивления'
  statement_en: The electric field in the conducting cylinder creates Foucault eddy currents whose density j = (0,
    jφ, 0) is calculated from the differential Ohm's law jφ = Eφ/ρ (8), ρ being the resistivity; in a homogeneous
