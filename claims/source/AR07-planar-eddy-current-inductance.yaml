  quote_ru: Они имели растущие частотные зависимости добротности, которые достигали максимума на частоте около 2-х
    гигагерц и затем спадали к нулю на частотах около 7-8 Ггц. Как известно, нуль добротности индуктивности соответствует
    нулю индуктивности.
  statement_en: 'In May 1999 Yue and Wong proposed a new technological solution for planar inductors, studying three
    variants of planar placement of a spiral inductor, silicon substrate, and screen (solid or patterned): NGS (no
    ground shield), SGS (solid ground shield), PGS (patterned ground shield); the NGS and PGS structures exhibited
    growing quality-factor frequency dependences reaching a maximum near 2 GHz and then falling to zero near 7-8
    GHz; zero Q of an inductance corresponds to zero inductance; no quantitative explanations of the properties
    of the new class of inductances were offered.'
  quantities:
