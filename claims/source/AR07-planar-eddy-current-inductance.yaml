  quote_ru: Заполнение проводником всего пространства внутри соленоида даёт максимальный эффект отрицательной индуктивности,
    вносимой проводящим стержнем. Но при этом суммарная индуктивность системы соленоид-стержень всегда будет уменьшена,
    но останется положительной.
  statement_en: Placing the solenoid on a semiconducting or conducting substrate binds only an insignificant part
    of the external magnetic field lines, weakly changing the resulting solenoid inductance and its cutoff frequency;
    filling the entire space inside the solenoid with a conductor gives the maximal negative-inductance effect introduced
    by the conducting rod, but the total inductance of the solenoid-rod system will always be reduced while remaining
    positive.
