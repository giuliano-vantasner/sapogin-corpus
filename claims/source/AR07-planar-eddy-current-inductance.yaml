  quote_ru: Интегрирование за период скалярного произведения 2 B0 B1 обращается в нуль из-за наличия фазового сдвига
     / 2 между индукциями B1 и B0.
  statement_en: 'The magnetic energy entering the cylinder averaged over the period T is <W> = (1/T)∫∫(B²/2μ₀)dVdt
    (24) with the resulting induction B = B0 + B1 (25); <W> consists of the mean external-field energy <W0> = B0²πR²h/4μ₀
    (26) and the mean response-field energy <W1> = (B0²πR²h/4μ₀)·(β²/3) (27); integration of the scalar product
    2B0·B1 over a period vanishes because of the π/2 phase shift between B1 and B0, so a peculiar interference arises
    that sums both energies: <W> = <W0> + <W1> (28).'
