- id: SC-AR07-047
  type: physics
  facet: theory
  priority: core
  page: 20
  quote_ru: Расположение с одной стороны такого индуктора проводящей плёнки, с наноскопической толщиной, увеличит
    суммарную положительную индуктивность системы. Она будет частотно-независимой. Расположение с разных сторон
    спирального индуктора двух одинаковых проводящих плёнок с наноскопической толщиной ещё больше увеличит положительную
    суммарную индуктивность системы с сохранением её частотных свойств. Расположение с одной стороны спирали либо
    толстой проводящей, либо многослойной плёнки может дать состояние динамической индуктивности. В этом случае
    суммарная индуктивность системы станет отрицательной и будет зависеть от частоты. Расположение с обеих сторон
    спирали таких плёнок ещё больше увеличит отрицательную индуктивность системы.
  statement_en: 'Open inductors are those made as a planar spiral, creating magnetic field lines symmetrically located
    in both half-spaces: placing a conducting film of nanoscopic thickness on one side of such an inductor increases
    the total positive inductance of the system, which becomes frequency-independent; placing two identical nanoscopic-thickness
    conducting films on different sides of the spiral inductor further increases the positive total inductance preserving
    its frequency properties; a thick or multilayer film on one side can give a dynamic-inductance state — the total
    system inductance becomes negative and frequency-dependent; films on both sides further increase the negative
    inductance, and increasing the number of layers raises the total negative inductance of the open system proportionally
    to their count.'
