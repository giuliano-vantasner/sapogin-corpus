  quote_ru: Эксперименты не только подтвердили ход частотных зависимостей добротности, найденные в [1], но и обнаружили
    тот факт, что на гигагерцах индуктивность RPGS - индуктора (Radial Patterned Ground Shield) может обратиться
    в нуль, а на более высоких частотах даже стать отрицательной.
  statement_en: 'A planar inductance with cylindrical geometry was created in [2]: a cylindrical spiral loaded on
    a layered cylindrical structure of modified silicon layers on a conducting copper substrate with a radially-patterned
    screen; the experiments confirmed the Q frequency dependences found in [1] and also discovered that at gigahertz
    frequencies the inductance of the RPGS inductor (Radial Patterned Ground Shield) can vanish and at higher frequencies
    even become negative.'
