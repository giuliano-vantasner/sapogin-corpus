  statement_en: 'The author lists seven observed properties of the Tunguska phenomenon: (1) an unidentified
    object fell from space at about 40 km/s; (2) astronomers did not detect its motion in near-Earth space
    before the fall; (3) the object measured roughly 5 to 25 km in diameter by various estimates, and
    some witnesses hold there were two objects; (4) its atmospheric passage excited powerful light, sound
    and electromagnetic waves that circled the Earth several times; (5) high atmospheric activity was
    observed a day or two before the fall (precursors); (6) the impact produced the "mast forest" and
    taiga fall over many kilometers, with no characteristic meteorite crater; (7) two-three years after
    the fall the catastrophe traces disappeared; the author also notes a similar smaller body fell in
    the Krasnoyarsk taiga in 2004.'
