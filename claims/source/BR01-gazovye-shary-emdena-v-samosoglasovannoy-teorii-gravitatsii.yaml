  quote_ru: Законы распределения гравитирующих частиц, находя- щихся при однородной температуре в плоском
    самосо
  statement_en: 'Section 2 conclusions: the distributions of uniformly-temperature gravitating particles
    in a plane self-consistent field are uniquely determined by the first integral of total pressure (particle
    plus field pressures); the potential is a two-parameter family of potential wells with infinite walls;
    the equilibrium distribution coincides with the Boltzmann one; the field squeezes particles to the
    pit bottom creating high-concentration regions; the Bernoulli force in every plane of the system coincides
