  statement_en: The number of particles bound by the self-consistent field in the spherical cluster is
    obtained by integrating the concentration over the volume; with the psi-function representation N
    = (N0/2*beta)*exp(d/b)*[psi(1/2+alpha/4) - psi(alpha/4) - psi(1/2-alpha/4) + psi(1-alpha/4)], where
    N0 = 3*n0*V is the particle-number scale (V the volume of the zero-pressure sphere), d = Arch(sqrt((1+beta^2))/beta)
