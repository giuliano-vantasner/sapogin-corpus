  quote_ru: Тогда преобразование концентрации частиц n в поверхно- стную плотность
  statement_en: 'For a hollow spherical cluster (radii r2 > r1, uniform concentration, particle-number
    conservation, perpendicular impact) the transformation of volume concentration n into surface density
    on the impacted plane is sigma(rho) = 2n*(sqrt(r2^2-rho^2) - sqrt(r1^2-rho^2)); normalized with eta
    = r1/r2 and chi = rho/r1 the distribution sigma_n = (sqrt(1-eta^2*chi^2) - eta*sqrt(1-chi^2))/(1-eta)
    for 0<=chi<=1 and sigma_n = sqrt(1-eta^2*chi^2)/(1-eta) for 1<=chi<=1/eta; the surface density of
    incident particles has a strong radial inhomogeneity near chi ~ 1 (adjacent to the cavity radius):
    the maximum falls on r1 and vanishes at r2; the melt region depends on the critical surface density
    sigma_k above which the surface material melts.'
  quantities:
  - η = r1/r2
