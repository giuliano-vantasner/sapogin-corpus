  priority: normal
  page: 22
  quote_ru: Обобщая работы Лэна, Эмдена
  statement_en: 'The base equations of self-consistent gravitational statics generalize Lane and Emden
    with a Frenkel-style approach: equilibrium of an elementary volume rho*g + f = 0; div g = -4*pi*G*rho;
    g = -grad(phi); equations of state p = rho*k*T/m (uniform temperature) or p = K*rho^n (polytropic);
    f = -grad(p) defining the gas-hydrostatic Bernoulli force; the truncated system reduces to the Lane-Emden
    equation for density in polytropic states.'
  quantities: []
  equations:
  - \rho g + f = 0
  - \mathrm{div}\,g = -4\pi G\rho
  - g = -\mathrm{grad}\,\varphi
  - p = \rho kT/m;\ p = K\rho^n
  - f = -\mathrm{grad}\,p
