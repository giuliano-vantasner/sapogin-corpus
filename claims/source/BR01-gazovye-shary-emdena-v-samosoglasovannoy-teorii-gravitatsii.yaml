  page: 27
  quote_ru: Интеграл полного давления. Исследуем одно замечательное свойство уравнений самосогласованной
    гравистатики.
  statement_en: For a single-component plane field g = [gx(x),0,0] the equilibrium condition integrates
    to the total-pressure integral gx^2/(8*pi*G) + p = (phi')^2/(8*pi*G) + p(phi) = H(phi',phi) = const,
    the Hamiltonian function of the plane system with x as generalized time, phi as generalized coordinate
    and phi'/(4*pi*G) as conjugate momentum; in systems with this collective interaction only equilibria
    with positive total pressure exist, and the field pressure is always larger where the particle pressure
    is smaller.
  quantities: []
  equations:
  - g_x^2/(8\pi G) + p = H(\varphi',\varphi) = \mathrm{const}
