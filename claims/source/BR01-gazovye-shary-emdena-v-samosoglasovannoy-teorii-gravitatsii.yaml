  priority: normal
  page: 20
  quote_ru: Отличительные особенности самосогласованной стати- ки.
  statement_en: 'The authors characterize self-consistent statics: distribution functions from power-law
    to Boltzmann; first-kind states hold particles in potential wells (concentration maximal at the potential-energy
    minimum), second-kind states concentrate particles at the bottom of a slot; in spherically symmetric
    first-kind states there exists a sphere of zero field pressure (also zero collective field strength)
    dividing the cluster matter into inner and outer atmospheres with field directed outward inside and
    inward outside; for any state parameters the matter concentration tends to zero at the ball center,
    contradicting the Lane-Emden boundary conditions (maximal central density), which therefore had to
    be revised; in cold first-kind states a cavity forms where matter is practically absent and the ball
    becomes a bubble; potential energy is defined up to a constant and can take either sign.'
