  quote_ru: Она заключается в том, что для произвольного уравнения со- стояния
  statement_en: 'The retention condition G*g + grad(p) = 0 follows from equations (1.5) and (1.8): for
    any equation of state the system is in static equilibrium with the self-consistent gravitational field
    when the sum of the pressure gradients of field and particles vanishes in every elementary volume;
    this condition is restrictive enough to discard non-physical solutions; the self-consistent field
    plays a dual role, creating in matter a pressure gradient co-directed with its strength vector and
    simultaneously the static force compensating that gradient; the classical boundary conditions (density
    decreasing from center to surface) are artificial and must be revised, admitting hollow spherical
    gravitational clusters with two atmosphere types.'
