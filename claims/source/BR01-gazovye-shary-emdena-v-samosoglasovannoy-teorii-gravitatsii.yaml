  quote_ru: Учитывая уравнение состояния (1.4) и однородность температуры
  statement_en: Substituting the equation of state and uniform temperature into the equilibrium gives
    grad(m*phi/(kT) + ln rho) = 0, so any equilibrium of gravitating particles with uniform temperature
    has the scalar integral m*phi/(kT) + ln rho = const yielding the Boltzmann distribution rho = rho0*exp[-m(phi-phi0)/kT];
    substituting into the field equation collapses the system into the single equation Delta*phi = 4*pi*G*rho0*exp[-m(phi-phi0)/kT],
    the three-dimensional field analog of the Emden E-equation, first obtained by Frenkel in 1948.
  quantities: []
  equations:
  - \mathrm{grad}\left(\frac{m\varphi}{kT} + \ln\rho\right) = 0
  - \rho = \rho_0 e^{-m(\varphi-\varphi_0)/kT}
  - \Delta\varphi = 4\pi G\rho_0 e^{-m(\varphi-\varphi_0)/kT}
