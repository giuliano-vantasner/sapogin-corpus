- id: SC-BR01-001
  type: physics
  facet: theory
  priority: normal
  page: 19
  quote_ru: существует такой класс коллективного взаимодействия между гравитирующими частицами динамической
    системы
  statement_en: 'The self-consistent gravity theory rests on five postulates: (1) there exists a class
    of collective interaction between gravitating particles in which the macroscopic self-consistent gravitational
    field acts back on the particles that generate it; (2) this back-action always creates a retaining
    volume density of static field-origin forces tied to the self-consistent field pressure gradient and
    co-directed with it; (3) the system is in static equilibrium with its field when the pressure gradients
    of field and particles are equal in magnitude and opposite in direction in every elementary volume;
    (4) in plane dynamical accumulations the zero sum of the pressure gradients yields a conservation
    law for the scalar total-pressure function (field plus particle pressures) playing the role of the
    interaction Hamiltonian; (5) the equilibrium condition contradicts neither Gauss''s theorem nor Earnshaw''s
    theorem, which apply to systems of fixed point particles with only Newtonian (or Coulomb) forces and
    no field-origin volume forces.'
  quantities: []
