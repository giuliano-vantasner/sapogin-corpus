  quote_ru: Он состоит из измерительной стрелки 1, закреплённой на вертикальном подвесе 2, соединённой
    с измерительным электродом 3. Конструкция помещена в металлический цилиндрический корпус 4, который
    изолирован от измерительного электрода диэлектриком.
  statement_en: The school mechanical electrometer consists of a measuring needle (1) fixed on a vertical
    suspension (2) connected to a measuring electrode (3); the assembly is placed in a metal cylindrical
    housing (4) insulated from the measuring electrode by a dielectric; charge supplied to the electrode
    turns the needle by an angle set by the imparted charge Q.
