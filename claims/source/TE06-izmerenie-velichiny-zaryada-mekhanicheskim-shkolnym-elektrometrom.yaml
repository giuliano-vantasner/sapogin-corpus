- id: SC-TE06-011
  type: physical
  facet: phenomenology
  priority: normal
  page: 6
  quote_ru: Этот факт можно объяснить изменением угла расположения измерительной стрелки по отношению
    к вертикальному подвесу, а стало быть, к изменению среднего расстояния между обкладками конденсатора.
    Чем больше угол отклонения от вертикали, тем меньше уединённая электроёмкость. В табл. 3 она изменяется
    от 1,98 пФ до значения 8,6 пФ.
  statement_en: 'The authors assert that the measurement-to-measurement variation of the electrode self-capacitance
    is explained by the change of the needle angle relative to the vertical suspension, i.e. by the change
    of the mean distance between the capacitor plates: the larger the deflection from vertical, the smaller
    the self-capacitance, which varies from 1.98 pF to 8.6 pF across the calibration table.'
  quantities:
  - C = 1,98–8,6 пФ
  equations: []
  materials: []
  geometry: []
  procedure_steps: []
  measurements:
  - quantity: self-capacitance of measuring electrode
    value: 1.98..8.6
    unit: пФ
    conditions: varies with needle deflection angle across calibration
  schematic_refs:
