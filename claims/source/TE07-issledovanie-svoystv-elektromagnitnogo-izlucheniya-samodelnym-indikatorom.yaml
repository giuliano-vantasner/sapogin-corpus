- id: SC-TE07-002
  type: experimental
  facet: experiment
  priority: normal
  page: 2
  quote_ru: 'Наблюдаемый эффект. При прохождении через лампочку переменного электрического тока индикатор
    обнаруживает ЭМИ: он загорается.'
  statement_en: 'The author reports demonstration experience No. 1: when alternating current passes through
    a lamp (indicator placed 20-25 cm away), the EM-radiation indicator detects EM radiation (LED lights);
    with no current in the circuit the LED does not light, i.e. no EM radiation.'
  quantities:
  - индикатор и лампочка на расстоянии 20–25 см
  equations: []
  materials:
  - лампочка на 220 В
  - индикатор ЭМИ
  geometry:
  - indicator and lamp 20-25 cm apart
  procedure_steps:
  - place EM indicator and lamp 20-25 cm apart
  - connect lamp to AC mains
  - observe LED; switch the lamp off and observe again
  measurements: []
  schematic_refs: []
  tags:
  - experiment
  - EM-radiation
  - alternating-current
  notes: ''
  relations: []
