  type: experimental
  facet: experiment
  priority: normal
  page: 5
  quote_ru: Наблюдаемый эффект. Во втором случае (при наличии штукатурки на стене как среды) светодиод
    индикатора гаснет на расстоянии, которое меньше, чем в первом случае.
  statement_en: 'The author reports experience No. 7: measuring the distance at which the LED goes out,
    first for a wire in air and then for hidden wiring behind a plastered wall, the extinction distance
    with plaster is smaller than in air — EM radiation penetrates the medium (plaster) and the medium
    partially absorbs it.'
