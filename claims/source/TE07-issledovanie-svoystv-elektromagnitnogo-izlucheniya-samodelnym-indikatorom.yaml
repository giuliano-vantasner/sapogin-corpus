  quote_ru: Основное техническое устройство, позволяющее поставить описанные ниже опыты, - это прибор
    для обнаружения скрытой электропроводки,
  statement_en: The core device for the demonstrations is a hidden-wiring detector described by A. Borison
    in the journal "Radio" (1991, No. 8, p. 77); the author presents its schematic so the device can be
    built at school; EM-radiation detection is signalled by LED HL1 lighting up; main nodes are the LED
    indicator and the antenna.
  quantities: []
  equations: []
  materials:
  - LED indicator HL1
  - antenna
  geometry: []
  procedure_steps:
