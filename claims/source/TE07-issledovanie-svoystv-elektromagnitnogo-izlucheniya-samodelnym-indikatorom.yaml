- id: SC-TE07-010
  type: physics
  facet: procedure
  priority: normal
  page: 7
  quote_ru: Считаем, что вся потенциальная энергия упруго деформированной пружины передается шайбе (цилиндру)
    4 при ее отпускании. Силы сопротивления движению шайбы не учитываем.
  statement_en: The spring-stiffness lab work assumes the entire potential energy of the elastically deformed
    spring is transferred to the steel washer (cylinder) on release and motion-resistance forces are neglected;
    from energy conservation the spring stiffness k is then computed from the washer mass m, the lift
    height H and the spring deformation (equations lost in the extracted text).
  quantities: []
  equations:
  - \tfrac{1}{2}kx^2 = mgH \Rightarrow k = 2mgH/x^2
  materials:
  - пружина
  - направляющий стержень (велосипедная спица)
  - стальная шайба (цилиндр)
  - миллиметровая линейка 0–30 см
  - фиксатор
  geometry:
  - guide rod with sliding steel washer
  - millimetre ruler measuring range 0-30 cm
  procedure_steps:
  - compress the spring with the washer, storing elastic potential energy
  - release the washer and measure the lift height H
  - compute k from energy conservation with measured m, H, deformation
  measurements: []
  schematic_refs:
  - рисунок 1 (установка)
  - рис. 2 (энергетическая схема)
  tags:
  - procedure
  - spring-stiffness
  - energy-conservation
  - lab-work
