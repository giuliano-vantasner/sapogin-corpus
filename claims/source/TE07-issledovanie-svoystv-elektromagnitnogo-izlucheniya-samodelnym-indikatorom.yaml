  quote_ru: Наблюдаемые эффекты. Индикатор срабатывает, обнаруживая ЭМИ в разных точках около шнура и
    на различных расстояниях от него.
  statement_en: 'The author reports experience No. 6: the indicator triggers at different points around
    the cord of a burning lamp at various distances, but at a far enough distance from the cord it stops
    triggering — EM radiation exists at points of space around a wire carrying alternating current but
    weakens with distance.'
  quantities: []
  equations: []
  materials: []
  geometry: []
  procedure_steps:
