  statement_en: The author asserts from experiences No. 4 and 5 that charges stationary relative to the
    indicator antenna create no EM radiation (LED goes out when the accelerated rod is stopped), and uniformly
    moving charges create no EM radiation (rod carried at constant speed past the antenna does not trigger
    the indicator).
  quantities: []
