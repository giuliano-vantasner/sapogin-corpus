  quote_ru: В 2000 г. научно-техническая группа под руководством генерально- го конструктора, академика
    Б. Каторгина
  statement_en: 'The author describes the 2000 Katorgin group reactor (NPO Energomash, Khimki) intended
    as a space-based plasma engine: a reactor of two thin-walled coaxially spaced cylindrical brass electrodes
    with hydrogen pumped through, about 40 kV applied and a high-voltage glow discharge ignited; the electric
    field accelerated the discharge plasma so strongly that current disruptions frequently occurred because
    plasma electrons swept by the gas flow failed to reach the positive electrode; photographs show luminous
    tubular currents with high temperature between the electrodes; the current-time oscillogram contained
    chaotic current spikes, and anode and cathode oscillograms differed — cathode current could exceed
    anode current several times.'
  quantities:
