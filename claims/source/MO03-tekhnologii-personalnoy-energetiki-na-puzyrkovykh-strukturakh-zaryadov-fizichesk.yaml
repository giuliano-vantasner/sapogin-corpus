  quote_ru: В связи с этим, кластеры разных размеров могут, как притягиваться, так и отталкиваться друг
    от
  statement_en: 'The author argues the "Coulomb barrier" concept should be removed from physics as applicable
    only to point charges that do not really exist: all charge bubbles have extended structure from femto-
    to macro-sizes with smeared charge, and their interaction is always two-force — the familiar one-force
    charge interaction plus a force tied to the spatial change of field pressure proportional to the square
    of the interacting field strength; hence clusters of different sizes can attract, repel, merge, and
    form new clusters with different charge counts; the same two-force interaction explains G. Nikolaev''s
    magnets-on-cart experiment (carts attract when separated, repel when approaching) without invoking
    his scalar magnetic field.'
