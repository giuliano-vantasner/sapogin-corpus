  quote_ru: На мой взгляд, обнаруженный процесс синтеза/распада пу- зырьков заряда в токе газообразной
    плазмы универсальный.
  statement_en: 'The author asserts the charge-bubble synthesis/decay process in gaseous-plasma current
    is universal: Fleischmann and Pons hit it (under the unsuccessful name "cold nuclear fusion") in heavy-water
    electrolysis, where high ohmic resistance kept currents small and synthesis/decay efficiency low,
    explaining the absence of neutrons; the same process in hot solid-state cathode plasma produces Mesyats
    explosive thermoemission, breaking the cathode substance; it also drives energy growth in catalytic
    reactions of heated nickel powders (Rossi E-CAT generators), where enlarging the heated zone causes
    such powerful bubble-energy release that reactors begin to explode; in solar-corona plasma the synthesis/decay
    goes on for millions of years driven by the temperature gradient between corona and surface, the only
    mechanism that can explain the corona being much hotter than the solar surface; chaotic current components
    in LED and gas-discharge lamps arise from bubble synthesis/decay in incandescent solid-state plasma,
    explaining why their light output is an order above the electric input; uranium fission was the first
    bubble-structure-decay energy industry.'
  quantities:
  - на порядок выше
  - ΔT корона–поверхность
