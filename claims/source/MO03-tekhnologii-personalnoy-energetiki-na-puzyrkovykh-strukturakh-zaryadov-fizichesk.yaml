    энергию добыть нельзя.'
  statement_en: 'The author interprets the Bauman electromechanical system as a rotating motor plus generator
    forming a closed energy chain: while the periodically varying capacitance participates in self-rotation
    it continuously supplies energy into the closed circuit whose load includes high-voltage Tesla transformers
    and chokes with neodymium magnets, sufficient to cover all system losses per period; two design differences
    from the author''s source: (1) Bauman replaced conducting rods by radial planar sectors with an electret
    film whose constant dipole moment is directed along the radius (no centrifugal electron displacement,
    but the moment suffices to excite current instability of the plasma of the connecting wires — electret
    vs centrifugal seeding to be compared experimentally); (2) two counter-rotating disks double the capacitance
    modulation frequency relative to the circuit frequency, realizing the Mandelstam-Papaleksi parametric
    resonance condition; the author sees a drawback in the asymmetric take-off borrowed from the Wimshurst
    machine and argues symmetric take-off would raise the power an order of magnitude; the number of disks
    on one axis cannot be increased, limiting power growth.'
