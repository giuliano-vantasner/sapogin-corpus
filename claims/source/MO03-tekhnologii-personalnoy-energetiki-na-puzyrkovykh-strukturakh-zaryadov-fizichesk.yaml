  quote_ru: Физическая причина избыточного выделения энергии появилась позже.
  statement_en: 'The author interprets the Khimki excess heat: the current oscillograms indicate formation
    in the hydrogen plasma of diverse charge bubbles similar to charge clusters; for a mean spike of 60
    A of microsecond duration the current contains charge accumulations with a mean value of order 30
    uC, about 1e14 electrons, protons or their mixture (plasma bubbles); comparison with the Shoulders
    charge bubble shows that per microsecond the hot plasma continuously forms a bubble structure with
    a huge number of charge bubbles of the most diverse sizes; the hydrogen current was carried by plasma-generated
    charge bubbles moving toward each other, with synthesis costing the plasma less energy than their
    decay released (some bubbles radiate into the plasma, others lose energy passing from plasma into
    the electrode metal); two excess-heat causes were identified, one being the integral effect of squaring
    a chaotic current of alternating sign.'
