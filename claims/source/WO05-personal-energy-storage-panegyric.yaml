  quote_ru: Пока периодически изменяющаяся ёмкость участвует в самовращении, она непрерывно поставляет энергию в
    замкнутую электрическую цепь.
  statement_en: In the author's opinion the new electromechanical system combines a rotating motor and a generator
    forming a closed energy chain; while the periodically changing capacitance participates in the self-rotation
    it continuously supplies energy to the closed electric circuit; the load circuit includes high-voltage Tesla
    transformers and chokes with neodymium magnets; the energy supplied to the circuit is sufficient to cover all
    the losses of the system over the same period.
  quantities: []
