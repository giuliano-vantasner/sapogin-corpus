  quote_ru: В заметке найден ответ на вопрос о причинах исключительно медленного распространения технологий создания
    самовращающихся накопителей электрической энергии.
  statement_en: The note finds the answer to the question of the causes of the extremely slow spread of technologies
    for creating self-rotating storages of electric energy; a model of the operation of such a storage in the form
    of a closed energy chain is proposed; the model explains the mechanism of generation of rotational kinetic and
    electric energies existing in Nature; the generation of excess energy is confirmed by numerous experiments of
    recent years; the mechanism can help the energy industry in solving the problem of producing a personal storage
    not requiring the supply of energy from outside.
