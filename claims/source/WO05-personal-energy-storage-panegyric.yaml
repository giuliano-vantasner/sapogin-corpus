- id: SC-WO05-014
  type: mathematical
  facet: theory
  priority: core
  page: 3
  quote_ru: Сила реакции опоры изменяет своё направление в пространстве и величину за период.
  statement_en: 'The support-reaction force changes its direction in space and its magnitude over the period; and
    its circulation, understandably, is not equal to zero; this circulation coincides with the value of the work
    transferred to the spinner by the gravitational field over the period; this leads to understanding under what
    physical conditions the spinner will rotate and by what equation its motion is described; any student of a technical
    university familiar with rotational dynamics can now compose this equation: I·dω/dt = M0 − M1 − M2 (1), where
    I is the moment of inertia of the wheel, ω the angular velocity depending on time, and M0, M1, M2 three moments
    of forces acting on the spinner axis: M0 — the asymmetric rotation moment, M1 — the moment of sliding (rolling)
    friction forces in the bearing, M2 — the moment of viscous friction forces of air, which depends linearly on
    the angular rotation speed of the spinner, i.e. M2 = ηω, where η is the rotational viscosity coefficient.'
  quantities: []
  equations:
  - I\,\frac{d\omega}{dt} = M_0 - M_1 - M_2
  - M_2 = \eta\,\omega
  materials: []
