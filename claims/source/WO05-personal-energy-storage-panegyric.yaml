- id: SC-WO05-012
  type: physics
  facet: theory
  priority: normal
  page: 3
  quote_ru: 'Ведь, если внимательно посмотреть на периодическое вращение любого груза в реальной гравитационной
    вертушке, то на этот груз всегда действуют, как минимум, четыре силы: гравитационная, сила реакции опоры, сила
    трения скольжения и сила вязкого трения.'
  statement_en: 'In response to the mathematical argument of refusal it would be good to recall one of the sayings
    of the great and authoritative Russian scientist, academician of many academies of the world, M.V. Lomonosov:
    ''One experiment I place higher than a thousand opinions born only of imagination''; if one looks attentively
    at the periodic rotation of any weight in a real gravitational spinner, at least four forces always act on this
    weight: the gravitational force, the support reaction force, the sliding friction force, and the viscous friction
    force; it is the resultant action of these forces that makes the weight move in a circle; the action of only
    the gravitational force cannot create circular motion of a body.'
  quantities: []
