- id: SC-WO05-016
  type: mathematical
  facet: theory
  priority: core
  page: 4
  quote_ru: Самая важная информация следует из (1). Она определяет значение угловой скорости «вечного вращения»
    вертушки
  statement_en: 'The most important information follows from (1): it determines the value of the angular velocity
    of the ''eternal rotation'' of the spinner (dω/dt = 0): ω* = (M0 − M1)/η (2); from (2) the magnitude of the
    angular rotation velocity of the spinner depends on the difference of the moments of the rotation forces and
    the friction forces, and also on the magnitude of the rotational viscosity of air; the angular velocity does
    not depend on the moment of inertia of the system; engines in which the moment of the friction forces exceeds
    the asymmetric one will not rotate.'
  quantities:
  - omega* = (M0 - M1)/eta
  equations:
  - \omega^* = (M_0 - M_1)/\eta
