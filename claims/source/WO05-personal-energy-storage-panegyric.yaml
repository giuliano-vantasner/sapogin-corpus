  page: 3
  quote_ru: При таком движении гравитационная сила работу за период, конечно, не совершает.
  statement_en: In such motion the gravitational force, of course, performs no work over the period — this is already
    clear to any student; but during this period it transfers its energy to the weight through the support-reaction
    force associated with it; one can create an asymmetric moment of forces constantly acting on the wheel; the
    work of this force moment is always positive.
