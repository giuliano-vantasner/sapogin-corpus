  quote_ru: 'Граф Карл Гессен-Кассельский приобрёл последнюю модель двигателя, запустил её в закрытом помещении
    и три раза проверял её работу: через две недели, через 40 дней и через два месяца. Колесо непрерывно вращалось
    с «неослабевающей быстротой».'
  statement_en: 'Count Karl of Hesse-Kassel acquired the last model of the engine, launched it in a closed room,
    and checked its operation three times: after two weeks, after 40 days, and after two months; the wheel rotated
    continuously with ''unflagging speed''; the great Isaac Newton knew about Orfenius''s machine but failed to
    explain the phenomenon of its operation.'
