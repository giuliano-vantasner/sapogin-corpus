  quote_ru: Согласно монографии А.Фролова, по сведениям 1720 года, некто Иоганн Элиас Бесслер (Карл Орфериус), родившийся
    в Саксонии, изобрёл «самодвижущееся колесо».
  statement_en: 'According to A. Frolov''s monograph, by information of 1720, a certain Johann Elias Bessler (Karl
    Orferius) born in Saxony invented the ''self-moving wheel'': a thin wheel 3 feet in diameter (1 ft = 0.3 m)
    and 4 inches (1 inch = 2.54 cm) thick rotated on a horizontal axis at a constant speed of about 60 revolutions
    per minute and could lift a weight of several pounds (1 pound = 0.45 kg); a year later the inventor demonstrated
    a new wheel 5 feet in diameter and 6 inches thick; it rotated at 50 revolutions per minute and could lift a
    weight of 40 pounds.'
  quantities:
