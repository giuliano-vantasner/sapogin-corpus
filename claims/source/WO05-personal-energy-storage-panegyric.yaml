- id: SC-WO05-009
  type: physics
  facet: theory
  priority: core
  page: 2
  quote_ru: Оно заключается в существовании теоремы о циркуляции. Эта математическая теорема утверждает, что работа,
    совершаемая однородным гравитационным полем над массой, движущейся по окружности, всегда равна нулю за период
    такого движения.
  statement_en: 'What is the cause of the extremely slow spread of the technology of creating various self-rotating
    spinners and of such great distrust of them? In the author''s view this is connected with the thorough mathematical
    proof of the impossibility of the existence of such an engine invented by academic theorists; it consists in
    the existence of the circulation theorem: this mathematical theorem asserts that the work performed by a uniform
    gravitational field on a mass moving in a circle is always zero over the period of such motion; from this follows
    the inexorable conclusion: transferring the energy of the gravitational field to the moving wheel is impossible,
    therefore it will never rotate.'
  quantities: []
  equations: []
  materials: []
  geometry: []
  procedure_steps: []
