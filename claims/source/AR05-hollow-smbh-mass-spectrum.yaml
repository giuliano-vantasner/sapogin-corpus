- id: SC-AR05-062
  type: physics
  facet: theory
  priority: normal
  page: 1
  quote_ru: 'При интегрировании Е-уравнения Эмдена для плотности газового шара возникает математическая проблема
    выбора граничных условий. Полную систему уравнений, решаемую относительно гравитационного потенциала, удаётся
    свести к трёхмерному уравнению такого же вида. Фундаментальный закон сохранения полного давления, существующий
    в системе с плоской симметрией, формирует полевые граничные условия. Они заключаются в наличии эквипотенциальной
    поверхности, в которой давление самосогласованного поля обращается в нуль, а потенциал минимален. В сферической
    симметрии найдены два класса аналитических решений, описывающих распределения физических параметров в системах
    с потенциальной ямой и потенциальной щелью. Вычисления указывают на возможность существования полых скоплений
    высокотемпературных нейтронов, спектр масс которых для температур от 10 11 до 1012 К попадает в диапазон масс
    объектов, обнаруженных в центрах галактик и названных «сверхмассивными чёрными дырами». Ключевые слова: газовый
    шар, полевые граничные условия, гравитационный потенциал, закон сохранения полного давления, эквипотенциальная
    поверхность, сферическая симметрия, аналитические решения, потенциальная яма, потенциальная щель, полые скопления
    высокотемпературных нейтронов, центр галактики, сверхмассивные чёрные дыры, спектр масс. СПЕКТР МАСС ПОЛЫХ СВЕРХМАССИВНЫХ
    ЧЁРНЫХ ДЫР С ВЫСОКОЙ ТЕМПЕРАТУРОЙ 1 В.Г. Сапогин, 2К.В.Сапогин 1 Российская Академия Естествознания, sapogin@mail.ru
