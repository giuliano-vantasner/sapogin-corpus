  statement_en: 'The equilibrium distribution function of the system coincides with the Boltzmann one and indicates
    the reverse action of the field on the particles that create this field; in solving the problem the gravity-compensating
    Bernoulli force receives a new mathematical definition: it is created by a force of field origin coinciding
    in direction and magnitude with the pressure gradient of the system''s self-consistent gravitational field;
    each elementary volume of the system is in equilibrium under two forces: the volume density of Newtonian attraction
