  quote_ru: Самосогласованная теория полых газовых шаров предсказывает существование низкотемпературных скоплений
    нейтронов малых размеров. Имея масштаб длины ~ 105 cм при температуре 100 К, они обладают масштабом массы ~
    2,51022 г, что на три порядка меньше массы Луны.
  statement_en: 'The self-consistent theory of hollow gas balls predicts the existence of low-temperature neutron
    clusters of small sizes: with a length scale ~10⁵ cm at temperature 100 K they have a mass scale ~2.5·10²² g,
