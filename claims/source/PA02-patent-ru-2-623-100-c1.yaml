- id: SC-PA02-005
  type: physics
  facet: material
  priority: normal
  page: 7
  quote_ru: В предлагаемой конструкции, в отличие от известных, применяются неинвертирующие усилители тока (например,
    каскады с общей базой), которые (при идентичных технологиях исполнения) имеют 35 более широкий частотный диапазон
    коэффициента передачи по току, близкий к fα транзисторов (например, для SiGe техпроцесса fα=200-300 ГГц). Таким
    образом, в предлагаемом устройстве fα>>fв.
  statement_en: Unlike known solutions, the proposed construction uses non-inverting current amplifiers (e.g. common-base
    stages) which, at identical fabrication technologies, have a wider current-transfer frequency range close to
    the transistors' fα (e.g. fα=200-300 GHz for the SiGe process), so that in the proposed device fα >> fв (the
    voltage-follower-based known compensations depend on the voltage-transfer cutoff frequency fв); in widespread
    cascade structures (mixers, generators etc.) such current amplifiers are already integral parts of the circuit,
    simplifying practical application.
  quantities:
  - fα(SiGe) = 200–300 ГГц
  - fα >> fв
