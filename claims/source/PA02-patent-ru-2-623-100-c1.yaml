  quote_ru: Из формулы (3) следует, что за счет выбора величины Ki в диапазоне Ki=0,1÷0,99 можно обеспечить увеличение
    ω0 заявляемой интегральной индуктивности в несколько раз.
  statement_en: From formula (3), by choosing Ki in the range 0.1-0.99 the own resonance frequency ω0 of the claimed
    integrated inductance can be increased several times (confirmed by computer modeling in figs. 6, 8, 9); the
    prototype (US 6936764) has comparatively low own-resonance frequency values limiting its working-frequency range.
