  quote_ru: 1. Планарная индуктивность с расширенным частотным диапазоном, содержащая первый (1) сигнальный и второй
    (2) общий выводы индуктивности, которые соединены по поверхности подложки (3) металлической пленкой (4), образующей
    витки планарной индуктивности, проводящий экранирующий элемент (5), расположенный под металлической пленкой
    (4), общий металлический слой (6), на котором размещена 25 подложка (3), отличающаяся тем, что в схему введен
    неинвертирующий усилитель тока (7) с низким входным и высоким выходным сопротивлениями, вход которого связан
    с проводящим экранирующим элементом (5), а выход соединен с первым (1) сигнальным выводом планарной индуктивности.
  statement_en: 'Patent claim 1 (verbatim): a planar inductance with extended frequency range containing a first
    (1) signal and second (2) common terminal connected along the substrate (3) surface by a metal film (4) forming
    the coils, a conducting shielding element (5) located under the metal film (4), and a common metal layer (6)
    carrying the substrate (3), characterized in that a non-inverting current amplifier (7) with low input and high
    output impedances is introduced into the circuit, its input connected to the conducting shielding element (5)
    and its output connected to the first (1) signal terminal of the planar inductance.'
