  priority: core
  page: 3
  quote_ru: Скопления зарядов (СЗ) образуются в зазоре между катодом и ано- дом при создании сильного
  statement_en: 'The dissertation abstract characterizes charge accumulations (CA): they form in the cathode-anode
    gap under a strong field of 2 to 10 kV, have small sizes from fractions to tens of micrometers, a
    large negative charge of 1e8 to 1e11 electrons, and a lifetime of 30 to 100 ps exceeding the possible
    charge-dispersal time; sometimes the mean electron concentration exceeds the mean electron concentration
    in metal by an order; at such concentrations, having no crystal lattice, the accumulations display
    mechanical properties inherent to solids; in some cases inelastic collision with a metal surface leaves
    a characteristic ring melted crater with a rim of unmelted material in the center; Russian researchers
    found such accumulations in explosive thermoemission flows (ectons), and in the USA similar autonomous
    accumulations on a tip cathode in vacuum were named Electrum Validum (EV) and applied in metal surface
    processing.'
  quantities:
  - 2–10 кВ
  - доли – десятки мкм
  - 108–1011 электронов
  - время жизни 30–100 пс
