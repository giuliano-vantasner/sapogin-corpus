- id: SC-DI01-021
  type: physics
  facet: theory
  priority: core
  page: 29
  quote_ru: Предлагаемая последовательная теория скоплений одноименных заря- дов, кратковременно удерживаемых
    в ограниченной области пространства,
  statement_en: 'The defended theory rests on fundamental provisions: (1) there exists a class of collective
    interaction between like charges in which the macroscopic self-consistent field acts back on the charges
    generating it; (2) this back-action always creates a retaining volume density of hydro-aerostatic
    field-origin forces tied to the self-consistent field pressure gradient, equal to it in magnitude
    and opposite in direction; (3) the dynamic charge system is in hydrostatic equilibrium with its field
    when the field and charge pressure gradients are equal in every elementary volume; (4) the equality
    of pressure gradients in plane dynamic accumulations for any equation of state, and in collisionless
    cases, yields a conservation law of the scalar total-pressure integral composed of the DIFFERENCE
    of field and charge pressures playing the role of the interaction Hamiltonian; (5) the equilibrium
    condition does not contradict Earnshaw''s theorem, which is formulated for a system of fixed charges
    with only Coulomb forces and no volume hydrostatic field-origin forces.'
