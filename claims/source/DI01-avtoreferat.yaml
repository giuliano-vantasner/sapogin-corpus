- id: SC-DI01-004
  type: mathematical
  facet: theory
  priority: core
  page: 12
  quote_ru: На основе трехмерного обобщения работ Лэна−Эмдена и Френкеля
  statement_en: 'The base system of electric hydrostatics (CGS absolute units): rho*E + f = 0; div E =
    4*pi*rho; E = -grad(phi); p = rho*k*T/q or p = K1*rho^(n+1); f = -grad(p); the compensating volume
    force f = -rho*E = -E(div E)/4*pi = -G is created by the self-consistent field pressure gradient G
    = E(div E)/4*pi, is opposite to it in direction, acts on the charge density like an ordinary pressure
    gradient, and in static equilibria compensates the volume electric force rho*E; the retention condition
    is G = grad(p): for any equation of state the system is in hydrostatic equilibrium when the equality
    of field and charge pressure gradients holds in every elementary volume; the self-consistent electric
    field retains a nonuniform system of like charges in a bounded region by forces of non-electromagnetic
    origin, and the solutions admit spatially bounded hollow charge clusters with two atmosphere types
    (outer with density growing along x, inner with density decreasing along x).'
  quantities: []
  equations:
  - \rho E + f = 0
  - \nabla\cdot E = 4\pi\rho
  - f = -E(\nabla\cdot E)/4\pi = -G
  - G = \nabla p
