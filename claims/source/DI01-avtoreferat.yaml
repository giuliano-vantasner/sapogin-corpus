  quote_ru: 1. Получены количественные закономерности, которым подчиняются статические равновесия бесстолкновительной
    динамической системы зарядов
  statement_en: 'Main results 1-4: quantitative laws of static equilibria of a collisionless charge system
    with plane self-consistent field show two-flow systems form a charge atmosphere holding most charges
    near the return plane, while one-flow systems form an atmosphere with most charges near the zero-field-pressure
    plane and the rest self-accelerating; for polytropic states the distribution laws of pressure, potential,
    field strength and temperature show bounded system sizes for positive or zero total pressures depending
    on state parameter and Emden temperature, with most charges concentrated near the zero-potential plane;
    for uniform temperature the system length is bounded for negative total pressure and depends on the
    state parameter, with charges held in deep potential wells at the boundary in bounded systems and
    near the zero-potential plane in unbounded ones; for thermodiffusion systems the length in positive-total-pressure
    states is bounded for -infinity < alpha < 0.5, the growing temperature gradient thins the charge layer,
    and the charge atmosphere concentrates near the zero-potential plane at small gradients and at the
    system boundary at large ones.'
