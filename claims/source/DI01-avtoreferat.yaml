  quote_ru: 1. Предложен метод решения задач равновесия динамической бес- столкновительной системы зарядов
  statement_en: 'Scientific novelty item 1: a method is proposed for the equilibrium of a collisionless
    dynamic charge system in two-flow or one-flow motion with a plane static self-consistent field, showing
    the equilibrium distributions are determined both by the collisionless distribution function and by
    the Hamiltonian function representing the total pressure of the system; distribution laws of velocities,
    pressures, potential, field strength and charges are found for states with positive, zero and negative
    total pressures; the physics of charge retention by the self-consistent field is substantiated; the
    geometric length of the system is determined for nonnegative total pressure, the charge motion period
    in the interaction space is computed, and in states with negative total pressure a charge self-acceleration
    effect is discovered.'
