  quote_ru: Численное моделирование позволяет сделать следующие выводы о свойствах равновесия динамической
    системы зарядов с полем
  statement_en: 'Numerical modeling of the thermodiffusion system at heat-sink efficiency coefficient
    delta = 1/2 and state parameter beta = 1/2 shows: (1) the length of positive-total-pressure states
    is bounded for the total field-strength parameter satisfying -infinity < alpha < 0.5, with decreasing
    alpha increasing the temperature gradient at x=0 and thinning the charge layer; (2) at the system
    boundary the absolute temperature and pressure vanish; (3) the concentration distribution has a sharp
    boundary — for alpha = -0.25 and -0.5 it vanishes at the boundary, for alpha = -0.75 and -1.0 the
    distribution law changes with unlimited concentration growth at the boundary (the growing temperature
    gradient moves more charges to the outer boundary); (4) a heat flux exists whose density direction
    depends on alpha (along x for -infinity < alpha < 0.5, against x for alpha > 0.75); (5) within -2
    < alpha < 0.5 the system length with thermodiffusion increases 12-fold.'
