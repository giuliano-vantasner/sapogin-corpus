  quote_ru: Под зарядовым кластером нами понимается динамическая система одноименных зарядов, удерживаемая
    кратковременно
  statement_en: The author defines a charge cluster as a dynamic system of like charges held briefly within
    a bounded region of space by field-origin forces under the condition of zero mean current density
    in any volume of the cluster; clusters not satisfying this condition are called current clusters and
    are not considered; the work develops and generalizes gravitational-equilibrium methods of Lane, Ritter
    and Emden to a gas of like charges, and shows star-matter retention is provided by an expelling hydrostatic
    field-origin force tied to the field pressure gradient, equal to it in magnitude and direction.
