  statement_en: 'Scientific novelty items 2-4: for polytropic states the system distributions are determined
    by the power-law distribution function and the total pressure, with spatial laws of potential, field
    strength, temperature, volume retention forces, field and charge pressures, and the geometric length
    of the bounded system depending on the state parameter and polytropic temperature; for constant temperature
    the distributions are determined by the Boltzmann function and the total-pressure function, with the
    retention mechanism substantiated and system sizes found for negative total pressure; for thermodiffusion
    systems with distributed heat sinks the distributions depend on two integrals — the scalar total-pressure
    integral and a vector integral representing the total field-strength vector of the system, composed
    of the difference of the effective thermodiffusion field strength and the self-consistent field strength.'
