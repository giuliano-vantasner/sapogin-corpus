  quote_ru: В случае α2>>1 (холодный кластер зарядов) найдено приближенное решение уравнения (31)
  statement_en: For the spherical cluster with alpha^2 >> 1 (cold cluster), the approximate solution of
    the radial equilibrium equation for boundary conditions x=1, y(1)=0, y'(1)=0 (implying a zero-field-pressure
    sphere) is q*phi/(2kT) = ln[(alpha*r/R)/sqrt(alpha^2-1) * sin(A)] with A = arcsin(sqrt(alpha^2-1)/alpha)
    - ln(r/R)*sqrt(alpha^2-1); the self-consistent field potential of positive cluster charges is negative
    in all space with a maximum on the zero-field-pressure sphere, which divides the space into inner
    and outer atmospheres; the volume-force distributions computed from the solution show expanding forces
    co-directed with E and the charge pressure gradient, compensated by forces created by the field pressure
    gradient taken with opposite sign, so the main part of cluster charges is held near the system boundaries
    in deep potential wells creating high-concentration layers able to mechanically destroy solid surfaces;
    the zeros of the sine give asymptotes bounding the interaction space and indicating an internal cavity
    with no charges; the layer thickness is d = r2 - r1 = pi*R/alpha = pi*k*T/(q*sqrt(2*pi*n0)); already
    at state parameter alpha = 3.0 a cavity arises in the cluster.
  quantities:
