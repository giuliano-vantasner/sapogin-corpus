- id: SC-DI01-003
  type: physics
  facet: theory
  priority: normal
  page: 5
  quote_ru: Уравнение равновесия термоэлектронов, предложенное Ричардсо- ном, Шоттки и Лауэ примерно в
    то же время
  statement_en: The author states that the thermoelectron equilibrium equation of Richardson, Schottky
    and Laue can be transformed into a charge-density equation differing from the Emden equation only
    by the sign of the right-hand side (attraction replaced by like-charge repulsion); the image-charge
    potential does not enter the equilibrium equation and does not influence its solutions, so the retention
    condition and the nature of the forces holding the thermoelectron layer remained unexplained in that
    approach; in 1948 Frenkel independently introduced the same field-calculation method for gravitating
    systems and extended it to interacting like charges, calling the macroscopic fields self-consistent,
    but his two conclusions (the gravitational equilibrium equation has no physically meaningful solutions;
    the charge equilibrium equation only describes the static cloud distribution) proved premature and
    the idea was not developed.
