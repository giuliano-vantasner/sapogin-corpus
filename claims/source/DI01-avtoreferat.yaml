  quote_ru: 'Отмечены особенности решений: во всех случаях цилиндр нулевого давления поля делит всё пространство
    взаимодействия кластера'
  statement_en: 'Cylindrical-cluster exact solutions for three temperature cases share these features:
    the zero-field-pressure cylinder divides the cluster interaction space into inner and outer atmospheres;
    all solutions have two asymptotes (outer and inner) near which the potential has a logarithmic singularity;
    the potential of the cylindrical cluster is negative everywhere for positive charges; the main part
    of cluster charges is held by the field in potential wells on the axis or at the system boundaries;
    the solutions satisfy the equality of field and charge pressure gradients in every elementary volume;
    cold states differ principally — a cylindrical cavity with no charges arises and the accumulation
    becomes tubular; the electric and magnetic field distributions in cylindrical beams are studied and
    the diameters and currents of equilibrium beams with characteristic temperature are computed.'
