  quote_ru: Три года назад нами была найдена математическая модель, которая позволяет описать периодическое
    нарастание заряда в последовательном колебательном контуре с гармонически изменяющимся реактивным
    параметром, и выяснить физические причины этого красивейшего явления
  statement_en: 'The authors state they found a mathematical model (ordinary linear second-order ODE with
    variable coefficients, three dimensionless parameters: Q, frequency ratio, reduced modulation depth)
    describing periodic charge growth in a series circuit with a harmonically varying reactive parameter;
    the equation admits no order reduction (no conservation-law integrals), has only the trivial analytic
    solution, and Runge-Kutta simulation shows three kinds of periodic solutions (damped at low Q, beats
    at medium Q, unbounded growth at high Q at twice the modulation frequency).'
