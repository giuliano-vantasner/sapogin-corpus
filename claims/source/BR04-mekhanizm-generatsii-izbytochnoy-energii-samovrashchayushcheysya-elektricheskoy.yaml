  quote_ru: Третий случай – практически равномерное движение концов стрелки вертушки по окружности. Такой
    случай устанавливается в системе при условии наличия пробоя воздушного промежутка между стрелкой и
    высоковольтными электродами.
  statement_en: 'The authors report three qualitatively distinct motion regimes of the high-voltage rotor
    (Franklin-arrow wheel between axisymmetric pin electrodes): (1) angle-finite oscillations about the
    equilibrium direction (the line through the HV electrodes) without air breakdown, normally damping
    to rest; (2) infinite rotation that stops and converts to finite motion settling at equilibrium; (3)
    practically uniform circular motion of the arrow ends, established only when air breakdown occurs
    between the arrow and the HV electrodes; rotation speed depends on applied voltage, electrode shape,
    friction and air-resistance torques.'
