  quote_ru: В момент разряда за один проход проводящего сектора мимо П- образного конденсатора происходит
    перекачка накопленной энергии плазменной неустойчивости в энергию тока смещения Максвелла, в свою
    очередь, закачивающего энергию в индуктивность контура.
  statement_en: 'The authors describe the closed energy chain (ЗЭЦ) operation: an initial mechanical impulse
    to the sector disk separates charges and creates dipole plasmoids in the sectors; the fluctuating
    sector potential provokes circuit instability producing high voltage on the П-shaped capacitor plates;
    at each sector discharge the accumulated plasma-instability energy is transferred into Maxwell displacement
    current energy which pumps the circuit inductance; attraction before discharge and same-sign repulsion
    after discharge preserves the mechanical torque direction, and each of the disk sectors supplies excess
    energy once per revolution, enough to cover dissipative, resistive and load losses, after which the
    system rotates steadily without external power.'
