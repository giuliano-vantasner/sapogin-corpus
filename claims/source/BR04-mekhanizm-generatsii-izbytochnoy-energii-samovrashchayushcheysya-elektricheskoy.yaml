  quote_ru: Эксперименты проводились на цилиндрической ёмкости, которая имела ротор и статор. Она содержала
    26 дисков диаметром 28,5 см, разделённых каждый на 16 радиальных секторов. Расстояние между соседними
    дисками равно 2 мм.
  statement_en: 'The authors describe the Mandelstam-Papaleksi experimental capacitor: a cylindrical rotor-stator
    capacitance with 26 disks of 28.5 cm diameter, each divided into 16 radial sectors, with 2 mm spacing
    between neighboring disks; the Paschen law gives breakdown field about 2.5 kV/mm at atmospheric pressure,
    the working voltage approached but did not exceed the 5 kV breakdown value, and a 5 kV spark gap was
    connected in parallel so mode 3 was unreachable, with transition into the beat mode 2 regulated by
    a variable resistance.'
  quantities:
