- id: SC-TE03-003
  type: physics
  facet: theory
  priority: normal
  page: 7
  quote_ru: Период вертикальных колебаний также не зависит от амплитуды колебаний маятника на пружине.
    Это отличает их от немалых колебаний математического маятника в однородном поле силы тяжести.
  statement_en: The authors assert that the period of vertical oscillations of a spring pendulum does
    not depend on the oscillation amplitude, which distinguishes them from finite-amplitude oscillations
    of a mathematical pendulum in a uniform gravitational field.
