- id: SC-TE03-005
  type: mathematical
  facet: theory
  priority: normal
  page: 7
  quote_ru: В системе с медленно изменяющимися параметрами сохраняется приведённая энергия системы, играющая
    роль адиабатического инварианта. При медленном изменении потенциальной энергии равновесного состояния
    груза, вызванной уменьшением коэффициента жёсткости, энергия колебаний груза уменьшается.
  statement_en: The authors assert that in a system with slowly varying parameters the reduced energy
    of the system is conserved as an adiabatic invariant, and that a slow decrease of the spring stiffness
    coefficient decreases the oscillation energy, hence also the oscillation amplitude and the amplitude
    values of the oscillation velocity.
  quantities: []
  equations:
  - J/\pi = 2E/\omega_0^2 = E/kx^{*2} = E/mg^2
  materials: []
  geometry: []
  procedure_steps: []
