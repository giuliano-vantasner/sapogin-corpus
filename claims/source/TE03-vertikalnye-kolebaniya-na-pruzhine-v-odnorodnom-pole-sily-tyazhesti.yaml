  priority: normal
  page: 1
  quote_ru: 'вертикальные колебания груза на пружине делятся на два класса: малые колебания с отрицательной
    полной энергией и колебания с положительной полной энергией.'
  statement_en: 'The authors assert that vertical oscillations of a weight on a spring in a uniform gravitational
    field divide into two classes: small oscillations with negative total energy (reduced energy ranging
    from -1/2 to 0) and oscillations with positive total energy.'
  quantities:
