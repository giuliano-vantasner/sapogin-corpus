- id: SC-TE03-002
  type: physics
  facet: theory
  priority: normal
  page: 7
  quote_ru: Вертикальные гармонические колебания груза на пружине в однородном поле силы тяжести совершаются
    на частоте, совпадающей с частотой колебаний пружинного маятника. Она не зависит от ускорения свободного
    падения.
  statement_en: The authors assert that vertical harmonic oscillations of a weight on a spring in a uniform
    gravitational field occur at a frequency coinciding with the oscillation frequency of a spring pendulum,
    and that this frequency does not depend on the gravitational acceleration.
  quantities: []
  equations:
