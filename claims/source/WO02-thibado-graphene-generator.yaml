  quote_ru: Первый случай реализовался тогда, когда электрическая энергия, запасённая в элементарном плазменном
    слое, была порядка его тепловой энергии.
  statement_en: 'Two different cases of dipole-moment distribution were discovered in principle: the first case
    was realized when the electric energy stored in the elementary plasma layer was of the order of its thermal
    energy — in this case the thermal energy made the electric moment of the dipole change chaotically in time and
    space, which changed the magnitude of the bending deformation of the film caught in the field, and it swayed
    randomly in time constantly changing its distance relative to the second conducting electrode; the second case
    of large electric fields stored in the film electric energy orders of magnitude greater than thermal; the dipole
    structures oriented mainly in one direction and practically did not depend on time; the process of transferring
    thermal energy to them did not lead to a change of their dipole moment in space; the bending deformation of
    the film was static and did not allow strongly changing its distance relative to the second conducting electrode.'
