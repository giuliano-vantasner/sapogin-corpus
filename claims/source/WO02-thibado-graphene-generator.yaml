- id: SC-WO02-002
  type: physical
  facet: theory
  priority: core
  page: 1
  quote_ru: Внутри плазмы при комнатной температуре могут возникать различные неустойчивости, которые приводят к
    генерации отдельных зарядовых кластеров (пузырьков зарядов) наноскопических размеров, состоящих из электронов.
  statement_en: 'A heated freestanding graphene film is always in continuous mechanical motion; the cause is simple:
    the thermal motion of the graphene plasma constantly redistributes in space and time the positions of electrons
    around the ions of the crystal lattice; inside the plasma at room temperature various instabilities can arise
    leading to the generation of individual charge clusters (bubbles of charges) of nanoscopic sizes consisting
    of electrons; they generate collective electric fields which act on the crystal-lattice ions and lead to continuous
    stochastic motion of its surface; the charge bubbles arising in graphene can apparently be observed by illuminating
    the film through with rays of the visible spectrum of various wavelength.'
  quantities: []
