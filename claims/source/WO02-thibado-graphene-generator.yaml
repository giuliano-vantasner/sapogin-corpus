    свой наведённый дипольный момент.
  statement_en: 'The law of electrodynamical induction led to the charges on the capacitor plates already creating
    their own induced dipole moment; further, the displacement currents closed onto the source through the conduction
    currents arising in the circuit; a closed circuit formed in which two ''electromotive forces for current'' arose
