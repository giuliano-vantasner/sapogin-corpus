  quote_ru: Теоретически он был открыт гением Максвелла.
  statement_en: The plasma instability allowed revealing one more phenomenon little known to the wide circle of
    researchers of plasma electrodynamics, which the author calls the law of electrodynamical induction (not to
    be confused with the law of electromagnetic induction); theoretically it was discovered by the genius Maxwell;
    the appearance on an electrode of a capacitor consisting of a graphene film of a chaotically changing dipole
    moment led to the generation around it of an electric induction forming a displacement current; i.e. the change
    in time of the dipole moment in the graphene volume created a Maxwell displacement current which closed through
    the vacuum to the second electrode and generated in it a chaotically changing dipole moment of another direction.
  quantities: []
