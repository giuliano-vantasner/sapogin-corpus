- id: SC-WO02-023
  type: physics
  facet: procedure
  priority: core
  page: 6
  quote_ru: На рис. 1 представлен вариант взаимно перпендикулярного расположения двух конденсаторов.
  statement_en: 'Fig. 1 presents a variant of mutually perpendicular arrangement of two capacitors: the first capacitor
    1-2 with the graphene film must be connected into a series oscillating LCR circuit with parameters leading to
    current instability; part of the alternating voltage is returned from the circuit back into the capacitor 3-4
    made of ordinary conducting plates; a pulse-periodic startup of the circuit operation is provided; at the appearance
    of alternating voltage on the terminals 3-4 an electric instability of the graphene plasma arises along the
    film; at large voltages it will not contain a chaotic component; an oscillating dipole moment appears in the
    film; it generates a Maxwell current and throws it onto the terminals 1-2; the voltage in the circuit also becomes
    alternating; after the oscillation process is established and the exit from instability, the alternating voltage
    source must be switched off keeping the circuit connections; the circuit enters a stationary oscillation of
    the whole closed energy chain; part of the energy must be taken and returned via a transformer circuit assembled
    on the LCR circuit inductance onto the plates 3-4.'
  quantities: []
  equations: []
  materials:
  - graphene film
  - ordinary conducting plates
  geometry:
  - mutually perpendicular capacitors
  procedure_steps:
  - arrange two capacitors mutually perpendicular
  - connect graphene-film capacitor 1-2 into series LCR circuit tuned to current instability
  - return part of AC voltage to capacitor 3-4
  - provide pulse-periodic startup
  - after oscillations establish, switch off external AC source keeping connections
  - feed back part of energy from transformer circuit on L inductance to plates 3-4
  measurements: []
  schematic_refs:
  - Рис. 1
