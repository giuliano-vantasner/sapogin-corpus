  quote_ru: 'Основной смысл предлагаемого технического устройства заключается в том, что команда профессора P.M.Thibado
    обнаружила новое физическое явление: тепловое движение графена может генерировать в цепи флуктуационно-индукционный
    ток, который в дальнейшем можно использовать в качестве вечного генератора электрической энергии.'
  statement_en: 'In February 2020 the journal Physical Review E published professor P. Thibado''s article ''Fluctuation-induced
    current from freestanding graphene: toward nanoscale energy harvesting''; the main sense of the proposed technical
    device is that Thibado''s team discovered a new physical phenomenon: the thermal motion of graphene can generate
    a fluctuation-induction current in a circuit which can subsequently be used as a perpetual generator of electric
    energy.'
