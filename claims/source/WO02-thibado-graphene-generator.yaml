  quote_ru: Токовая неустойчивость приведёт к дополнительной раскачке тока в контуре. Затем она выйдет в насыщение.
  statement_en: 'The law in the form (2) can only suggest a definition of the possibility of the existence of such
    sources: one needs to create a region in which the dipole moment of the substance changes periodically; this
    moment will generate the corresponding displacement currents; the displacement currents will hit the corresponding
    plates of a capacitor; the capacitor plates will become an element of a series LCR circuit tuned to the current
    instability; the current instability will lead to additional pumping of the current in the circuit, then it
    will reach saturation; on the circuit inductance one will have an alternating current, part of whose energy
    must be returned to pumping the initial dipole moment of the substance and part transferred to the consumer;
    this necessity leads to all continuously supplied sources of energy being closed energy chains in which there
    are interconnected ''MOTOR'' and ''GENERATOR''; the details of organizing closed energy chains (CEC technologies)
    can be found in [1].'
