- id: SC-WO02-003
  type: experimental
  facet: phenomenology
  priority: core
  page: 1
  quote_ru: Когда инженеры-физики наложили поперёк плёнки графена однородное электрическое поле, то они спровоцировали
    в плёнке плазменную неустойчивость, которая развивалась поперёк плёнки.
  statement_en: When engineer-physicists applied a uniform electric field across the graphene film they provoked
    in the film a plasma instability developing across the film; it manifested itself in strongly inhomogeneous
    charge regions forming in the graphene; these inhomogeneous electron regions aligned across the graphene film
    creating structures of dipole electric moments of different directions; the values of the electric moments differed
    on passing from one microregion of the film to another; they fluctuated in time creating in the whole film a
    total dipole moment which changed its direction in space and time; the resulting chaotic electric field generated
    by the integral dipole moment strongly depended on the seed value of the external DC electric field strength.
  quantities: []
  equations: []
