  quote_ru: Гениальный швейцарский инженер Поль Бауман [3] в своей машине «Тестатика» (1970 г.) сумел создать на
    прототипе электрофорной машины Д. Вимшурста (machine J.Wimshurst, 1883) механическую ёмкость с самовращением
    (то есть совместить «Мотор» с «Генератором»).
  statement_en: The brilliant Swiss engineer Paul Baumann in his 'Testatica' machine (1970) managed to create, on
    the prototype of the Wimshurst electrostatic machine (1883), a mechanical capacitance with self-rotation (i.e.
    to combine the 'Motor' with the 'Generator'); this improvement allowed him to build the first on earth mechanical
    alternating-current generator of long duration not requiring energy input from outside; he managed to create
