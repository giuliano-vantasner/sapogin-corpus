- id: SC-WO02-025
  type: physics
  facet: measurement
  priority: core
  page: 7
  quote_ru: Мощность, даваемая таким устройством при 100-омной нагрузке, можно оценить порядка 10-18 Вт.
  statement_en: 'The flaw of the proposed design of the perpetual energy generator is its small size: all the electrons
    of the graphene film, of which there are very few, can be driven into oscillation; the power delivered by such
    a device at a 100-ohm load can be estimated at about 1e-18 W; this terrible shortcoming can be overcome by replacing
    the proposed construction with macroscopic conducting plates of centimeter sizes; the power of such a device
    will immediately increase 1e20 times; it would be impossible to assemble it by creating that number of nanoscale
    energy sources.'
