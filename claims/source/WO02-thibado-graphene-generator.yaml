  quote_ru: Недостаток заключался в том, что для создания флуктуационно-индуцированного тока в неустойчивой плазме
    всегда требуется наличие источника постоянного тока. Без него неустойчивость плазмы возникнуть не может.
  statement_en: 'But the researchers did not notice one flaw of the physical effect they discovered: the flaw was
