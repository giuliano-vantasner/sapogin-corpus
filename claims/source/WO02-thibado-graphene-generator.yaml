  quote_ru: 'Они обнаружили экспериментально новое физическое явление, которое возникает в плазме графена, при наложении
    на него внешнего статического электрического поля. Это явление может иметь название: «Плазменная неустойчивость
    плёнки графена в поперечном статическом электрическом поле».'
  statement_en: 'In this sense the researchers can be congratulated: they discovered experimentally a new physical
    phenomenon arising in the graphene plasma when an external static electric field is applied to it; this phenomenon
    can be named ''Plasma instability of a graphene film in a transverse static electric field''; but unfortunately
    the Hamiltonian formalism given in the article has no relation to describing the mentioned effect; here one
    needs to seek the laws of conversion of the external static field energy into the energy of chaotic oscillations
    of the plasma dipole moment; from which laws of physics they can be found is not yet clear.'
