  quote_ru: приоритет экспериментального открытия закона электродинамической индукции принадлежит швейцарцу П. Бауману, который первым в мире изобрёл неисчерпаемый механо-электрический источник переменного
    тока, названный им «Тестатика». Ток смещения возникал у него в П-образных конденсаторах, через пластины которых двигался дипольный момент, создаваемый вращающейся пластиной радиального электрета.
  statement_en: Sapogin asserts experimental priority for the law of electrodynamic induction belongs to Swiss P. Baumann, inventor of the first inexhaustible mechano-electric AC source, the 'Testatika';
    the displacement current arose in his П-shaped capacitors through whose plates a dipole moment moved, produced by a rotating radial-electret plate.
