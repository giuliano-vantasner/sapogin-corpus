  quote_ru: На установке А. Атаманченко был получен размах переменного напряжения на принимающем конденсаторе в киловольты. Напряжение измерялось электрометрами и возникало при вращении дипольного момента
    порядка 10 нКл*м с частотой 0,5 Гц.
  statement_en: 'Sapogin reports Atamanchenko''s 2020 replication (replacing the radial electret by two hollow oppositely charged metal cylinders on a mechanical rotation axis): peak-to-peak AC voltage
    on the receiving capacitor reached kilovolts, measured by electrometers, arising from rotating a dipole moment of order 10 nC*m at 0.5 Hz.'
  quantities:
