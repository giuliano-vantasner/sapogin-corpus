  quote_ru: ёмкостные трансформаторы на токе смещения Максвелла, которые он использовал, могут преобразовывать входную электрическую мощность переменного тока, как с понижением выходной мощности, так и
    с её сверхединичным превышением. В ёмкостных трансформаторах не выполняются привычные законы сохранения энергии так, как они выполняются в законе электромагнитной индукции.
  statement_en: Sapogin asserts capacitive transformers on the Maxwell displacement current can convert input AC power either with step-down or with over-unity output, and that the usual energy conservation
    laws do not hold in capacitive transformers the way they do in electromagnetic induction.
