  page: § Спектр масс полых сверхмассивных чёрных дыр с высокой температурой
  quote_ru: Фундаментальный закон сохранения полного давления, существующий в системе с плоской симметрией, формирует полевые граничные условия. Они заключаются в наличии эквипотенциальной поверхности,
    в которой давление самосогласованного поля обращается в нуль, а потенциал минимален.
  statement_en: 'Sapogin asserts the fundamental conservation law of total pressure in a flat-symmetry system forms field boundary conditions: an equipotential surface where the self-consistent field pressure
    vanishes and the potential is minimal.'
