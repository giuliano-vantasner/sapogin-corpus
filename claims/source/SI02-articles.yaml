  page: § Биволновая природа принципа наименьшего действия релятивистской частицы-заряда
  quote_ru: Интеграл содержит в себе две плоские волны действия, связанные с движущейся частицей-зарядом. Одна из них совпадает с де Бройлевской волной (временная волна действия), имеющей фазовую скорость
    больше скорости света. Другая плоская волна (координатная волна действия) движется с фазовой скоростью меньше скорости света. Длина её волны зависит от скорости и при малых скоростях движения совпадает
    с комптоновской длиной волны.
  statement_en: 'Sapogin asserts the action integral contains two plane action waves bound to the moving charge particle: one coinciding with the de Broglie wave (temporal action wave) with phase velocity
    above light speed, the other (coordinate action wave) moving below light speed, its wavelength speed-dependent and coinciding with the Compton wavelength at low speeds.'
  quantities: []
