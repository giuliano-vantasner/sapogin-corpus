  page: § Электрическая неустойчивость однородной плазмы к формированию нестационарных электронных кластеров
  quote_ru: Исследована электрическая неустойчивость электронного кластера в дырочной плазме, которая возникает на быстрых встречных волнах. Неустойчивость описывает процесс синтеза/распада электронного
    кластера. В зависимости от параметров коллективного электрического поля неустойчивость может быть «взрывной» и происходить за микросекунды.
