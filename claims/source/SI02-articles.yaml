  page: § Электрическая неустойчивость однородной плазмы к формированию нестационарных электронных кластеров
  quote_ru: Четвёртый класс электронов перемещается против напряжённости поля. Их движение обеспечивает градиент давления коллективного поля, действующий на массовую плотность электронов. В этих областях
    плазмы градиент давления оказывается больше силы Бернулли.
  statement_en: Sapogin asserts the fourth class of electrons moves against the field strength; their motion sustains the collective-field pressure gradient acting on the electron mass density, and in these
    plasma regions the pressure gradient exceeds the Bernoulli force.
