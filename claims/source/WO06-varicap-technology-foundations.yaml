  quote_ru: 3. Вижу уникальное свойство высоковольтных ВК. Они могут быть применены в качестве устройства сверх
    единичного преобразователя электрической мощности.
  statement_en: 'Direction 3: the author sees a unique property of high-voltage varicaps (VC): they can be applied
