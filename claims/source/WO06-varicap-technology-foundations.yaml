  quote_ru: Почему нужен острийный катод? Всё дело в том, что в такой геометрии электроны начинают уходить от нагретой
    большой поверхности конуса к острию в холодную область.
  statement_en: 'Why is a point cathode needed? In such geometry the electrons begin to move away from the heated
    large surface of the cone toward the point, into the cold region; the temperature gradient pushes them; the
    collective electric field retains them in such a way that they cannot jump out through the lateral surface of
    the cone; therefore single electrons cannot appear in the vacuum gap in this variant; it is the same as making
    a conical metal pipe: passing water through such a fitting one achieves its exit through the small hole under
    high pressure.'
  quantities: []
  equations: []
