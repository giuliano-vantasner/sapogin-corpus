  priority: normal
  page: 1
  quote_ru: Металлические баллоны с кислородом могут выдерживать уже десятикратное давление атмосферы.
  statement_en: 'School-physics background: a gas balloon holds gas whose pressure varies within certain limits
    — a glass balloon can withstand pressure up to about three times atmospheric, at four times it explodes; metal
    oxygen cylinders can withstand ten times atmospheric pressure; if a filled gas balloon is thrown into a furnace
    and heated it will eventually explode — the causes can be explained in different physical terms: (1) the gas
    pressure in the balloon exceeded the pressure the metal balloon can withstand; (2) the temperature of the heated
    molecular gas turned out higher than the characteristic temperature of the metal balloon; gas balloons usually
    indicate the limit pressure in megapascals (10^6 Pa).'
  quantities:
  - glass balloon limit ~3 atm
  - metal cylinders ~10 atm
  - limit pressure units MPa (10^6 Pa)
