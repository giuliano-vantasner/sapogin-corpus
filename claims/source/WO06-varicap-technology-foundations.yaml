- id: SC-WO06-003
  type: physics
  facet: theory
  priority: core
  page: 1
  quote_ru: 'Физика вроде тоже простая: если давление зарядов окажется больше давления поля, то кластер либо взорвётся,
    либо увеличит свои размеры.'
  statement_en: 'The physics is also simple: if the charge pressure turns out greater than the field pressure, the
    cluster either explodes or increases its size; if the field pressure is greater than the charge pressure, the
    charge bubble compresses; the charge pressure, as in an ordinary gas, is determined directly by their temperature
    (the school formula p = nkT); i.e. in a diode the creation of a gas medium consisting of individual electrons
    with a definite concentration and definite temperature is possible; charge bubbles can also be in the medium;
    in clusters the electric fields always counteract the thermal fields.'
  quantities: []
  equations:
  - p = nkT
