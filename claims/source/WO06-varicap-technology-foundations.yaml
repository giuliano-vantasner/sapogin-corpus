  priority: core
  page: 1
  quote_ru: 'И нам с вами нужно сделать оценки важнейших параметров кластера. Из них нужно понять, при каких концентрациях
    и температурах (роль стекла играет давление поля, образованное зарядами; условие удержания: давление поля должно
    быть равно давлению зарядов) эта система будет удерживаться.'
  statement_en: 'The posed task: we have a vessel representing a charge bubble (the same as a gas of molecules in
    a ''glass balloon'') heated to a definite temperature, and we need to estimate the most important cluster parameters;
    from them to understand at what concentrations and temperatures (the role of glass is played by the field pressure
    formed by the charges; the retention condition: the field pressure must equal the charge pressure) this system
    will be retained; only one who has built the physical theory of charge clusters and understands it can make
    these estimates.'
  quantities: []
