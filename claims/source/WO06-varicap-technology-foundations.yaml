  quote_ru: Это конденсаторы на Д-М-Д структурах (диэлектрик-металл-диэлектрик). На них наткнулись недавно в Китае
    (слой 4 нм) и, вроде бы, в Ростове, в ЮФУ (слой 10 нм).
  statement_en: 'Direction 5: the author recently understood that a new class of capacitors on conducting films
    of nanometer thickness exists in nature, which will be a serious competitor to the addressee''s high-voltage
    findings: capacitors on D-M-D structures (dielectric-metal-dielectric); they were stumbled upon recently in
    China (a layer of 4 nm) and, it seems, in Rostov at SFU (a layer of 10 nm); the government of China is looking
    for those who will help understand why such a capacitance decreases inversely proportional to the voltage; exceptionally
    beautiful physics of the effect, but they do not understand it; explanation: when an external electric field
    whose strength is greater than the strength of the intracrystalline field is applied to a thin metal film, a
    double electric layer forms; the dipole electrization of the film arises immediately; at first glance the technology
    is nanoscale, but it can be made exceptionally cheap and low-voltage.'
