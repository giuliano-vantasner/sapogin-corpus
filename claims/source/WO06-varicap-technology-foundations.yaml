  quote_ru: Из параметра (1) можно вычленить его характеристическую температуру
  statement_en: In a charge cluster there is the dimensionless parameter eφ/kT (1), where e is the electron charge,
    φ the mean electric potential of the cluster, k the Boltzmann constant, T the absolute temperature of the cluster;
    from parameter (1) one can extract its characteristic temperature T* = eφ/k ≈ φ·10^4 K (2), which defines the
    characteristic temperature scale of any electron cluster located under a mean potential.
  quantities:
  - T* = e phi/k ~ phi x 1e4 K
  equations:
  - e\varphi/kT
  - T^* = e\varphi/k \approx \varphi\cdot 10^4\ \mathrm{K}
