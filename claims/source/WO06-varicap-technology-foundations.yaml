  quote_ru: При формировании электрической схемы последовательно с диодом включить омическую вставку, которая позволит
    наблюдать за зависимостью протекающего в диоде тока от времени.
  statement_en: In forming the electric circuit, connect an ohmic insert in series with the diode which will allow
    observing the dependence of the current flowing in the diode on time; perhaps a wire of 10 cm inserted into
    the oscilloscope input will suffice; the diode in the cluster regime will radiate electromagnetic waves into
    the surrounding space very strongly; if the oscilloscope shows chaotic pulses with large surge amplitudes, it
    means you have hit the generation of charge bubbles; check at different voltages up to 30 kilovolts; but charge
    bubbles will begin appearing already at voltages even of 10 kV.
