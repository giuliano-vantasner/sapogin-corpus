  quote_ru: Что показали последние эксперименты? Они показали развитие электрической плазменной неустойчивости внутри
    электронного газа.
  statement_en: Those vacuum diodes (French kenotrons) that the addressee investigated were apparently well made
    and lacked the needed number of sharp-point elements (or surface roughnesses, as with G. Mesyats) on the cathode
    surface; they did not supply micron charge bubbles into the electron gas; the latest experiments showed the
    development of an electric plasma instability inside the electron gas; what did this instability do to the electrons?
    When a large-amplitude pulse was applied, the electron gas, heating up, began chaotic motion and formed various
    growth fronts; hot electrons strove to leave into cold regions; the electrons heated these regions and again
    sought cold regions; at that, the instability could not generate any charge clusters.
