  page: 7
  quote_ru: Мы с А. Атаманченко проверили её простым образом. Взяли чёрную копирку (тонкая проводящая плёнка графита),
    положили на заряженную обкладку конденсатора через листы бумаги, и потенциал на электрометре рухнул до нуля.
    Заряд на обкладках оставался постоянным.
  statement_en: 'The author together with A. Atamanchenko checked it in a simple way: they took black carbon paper
    (a thin conducting graphite film), laid it on a charged capacitor plate through sheets of paper, and the potential
    on the electrometer collapsed to zero; the charge on the plates remained constant; on a film thickness of nanometers,
    at centimeter transverse sizes, one volt is enough to obtain millifarads; this is a competitive physical mechanism
    capable of pushing the addressee''s not-yet-mastered technology into the background, because such capacitors
    are required in huge quantities for processors made by the 5 nm technology.'
  quantities:
  - 1 V across nanometer film at cm sizes gives millifarads
  - plate charge constant during test
  equations: []
  materials:
  - black carbon paper (thin graphite film)
  - sheets of paper
  - capacitor plate
  - electrometer
  geometry:
  - graphite film of nanometer thickness, centimeter transverse sizes
  procedure_steps:
