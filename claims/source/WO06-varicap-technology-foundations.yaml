- id: SC-WO06-017
  type: physics
  facet: recipe
  priority: core
  page: 4
  quote_ru: Пусть катод будет из металлического конуса (материал такой, чтобы мог выдерживать температуру нагрева
    в 3000 К, – наверное, вольфрам).
  statement_en: 'Constructive proposal for an atmospheric current discharger in another variant: the cathode should
    be a metal cone of a material withstanding a heating temperature of 3000 K (probably tungsten); assume the large
    base diameter 1-2 cm; the small base should be ground and polished to micron sizes; the cone angle 30 degrees
    relative to the axis; attach to the large base a heater rated for the required power of heating the cone from
    1000 K to 2000 K (see fig. 5 on p. 43 of ''Технологии…''); at an axial distance from 2 mm to 5 cm (a way to
    vary this distance should be considered) place co-axially a cylindrical anode in the form of a Faraday cage
    with a lid of diameter from 2 to 4 cm; assemble all this on a vacuum stand; the result is exactly the same diode
    as Shoulders''s, but differing from his design by the macroscopic size of the point cathode and the cathode
    heating.'
  quantities:
  - cathode material tungsten (3000 K)
  - large base diameter 1-2 cm
  - cone angle 30 degrees
  - heating 1000-2000 K
  - anode distance 2 mm - 5 cm
  - anode diameter 2-4 cm
  equations: []
  materials:
  - tungsten cone cathode
  - Faraday-cage cylindrical anode with lid
  geometry:
