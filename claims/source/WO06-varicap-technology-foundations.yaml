- id: SC-WO06-004
  type: physics
  facet: theory
  priority: core
  page: 1
  quote_ru: 'Четыре параметра: концентрация, температура, потенциал системы и заряд, – определяют существование
    такого стационарного зарядового кластера, в котором в любом месте кластера давление поля'
  statement_en: Four parameters — concentration, temperature, potential of the system, and charge — determine the
    existence of such a stationary charge cluster in which at any place of the cluster the field pressure equals
    the local charge pressure; a situation is possible when at these parameters a cluster of, say, 4 meters forms;
    such a size does not fit the dimensions of a vacuum diode; and since this is so, expecting the appearance of
    Shoulders' micron clusters in such a gas medium can take years — one begins to understand that in such a 'broth'
    they may never appear at all.
