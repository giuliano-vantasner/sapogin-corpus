  quote_ru: 1. Проверить режим прямого преобразования тепловой энергии нагретого катода в электрическую энергию.
    Такой диод будет называться термоэлектронным преобразователем (см. мою последнюю брошюру и брошюру «Источники
    постоянного тока на физическом принципе….»). Греете катод и измеряете возникающее электрическое напряжение между
    катодом и анодом. Эти милливольты будут зависеть от температуры конуса (чем больше температура, тем больше напряжение).
    Интересно измерить коэффициент преобразования тепловой энергии в электрическую энергию.
  statement_en: 'Direction 1: check the regime of direct conversion of the thermal energy of the heated cathode
    into electric energy; such a diode will be called a thermoelectron converter; heat the cathode and measure the
    arising electric voltage between cathode and anode; these millivolts will depend on the temperature of the cone
    (the higher the temperature, the higher the voltage); it is interesting to measure the coefficient of conversion
    of thermal energy into electric energy; these studies failed in the Soviet Union in the 1970s; a device attached
    to a hot surface will constantly produce a small amount of electricity as long as the surface is hot.'
  quantities: []
