- id: SC-TC02-008
  type: physics
  facet: theory
  priority: core
  page: 5
  quote_ru: Рассмотренные квазистатические заряд/разряд конденсатора формируют два канала движения электромагнитной
    энергии, а не один, как считалось ранее. Первый из них, «проводящий» канал, связан с проводниками, подключенными
    к обкладкам конденсатора, и порождается током проводимости. Второй канал, «непроводящий», перебрасывает электромагнитную
    энергию через боковую поверхность конденсатора. Он связан с током смещения.
  statement_en: 'Quasistatic charge/discharge of a capacitor forms two channels of electromagnetic energy motion,
    not one as previously believed: a ''conducting'' channel through the wires connected to the plates (conduction
    current) and a ''non-conducting'' channel that transfers electromagnetic energy through the lateral surface
    of the capacitor (displacement current).'
  quantities: []
