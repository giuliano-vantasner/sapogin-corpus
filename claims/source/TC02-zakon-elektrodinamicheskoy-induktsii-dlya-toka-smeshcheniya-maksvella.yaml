  type: physics
  facet: theory
  priority: core
  page: 5
  quote_ru: Нужно понимать, что такая циркуляция потоков электромагнитной энергии может возникать только в случае,
    когда источник электромагнитного поля находится внутри конденсатора. Этим источником служит область с газом
    непрерывно осциллирующих диполей, помещённая внутри обкладок конденсатора. Область активна. Она является «реактором»
    (источником тока смещения) закольцованной схемы и заменяет собой диэлектрик, находящийся внутри обкладок конденсатора,
    представленный на рис. 1.
  statement_en: 'Such circulation of electromagnetic energy fluxes arises only when the source of the electromagnetic
    field is inside the capacitor: the source is a region of gas of continuously oscillating dipoles placed between
    the plates — an active region, the ''reactor'' (source of displacement current) of the looped circuit, replacing
