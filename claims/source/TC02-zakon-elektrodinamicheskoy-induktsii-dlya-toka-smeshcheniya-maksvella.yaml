  type: physics
  facet: theory
  priority: core
  page: 8
  quote_ru: Поэтому он более эффективен, чем первый. Электростатические законы сохранения энергии не проявляют себя
    в этом законе по причине того, что все поля и токи зависят от времени. Вследствие этого следует ожидать преобразование
    мощности переменного тока, как с её понижением, так и с её повышением.
  statement_en: The electrodynamic induction law is therefore more effective than the electromagnetic one; electrostatic
    energy conservation laws do not manifest themselves in it because all fields and currents depend on time — power
    conversion of alternating current should be expected both downward and upward.
