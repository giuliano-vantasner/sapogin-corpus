- id: SC-TC02-022
  type: physical
  facet: recipe
  priority: core
  page: 8
  quote_ru: Закон (2) создаст новое направление энергетики, в которой преобразование мощности переменного тока будет
    осуществляться током смещения Максвелла. Преобразователь имеет простое схемное решение. Создаётся газ осциллирующих
    диполей. Он помещается вместо диэлектрика в конденсатор, нагруженный на омическое сопротивление (см. рис. 5).
    Преобразованная мощность, генерируемая газом диполей в мощность переменного тока, выделится на омическом сопротивлении
    R.
  statement_en: 'Law (2) creates a new direction of energetics in which AC power conversion is performed by the
    Maxwell displacement current: an oscillating-dipole gas is created and placed instead of the dielectric into
    a capacitor loaded by an ohmic resistance R; the power converted by the dipole gas into AC power is released
    on R.'
  quantities: []
  equations: []
  materials: []
  geometry: []
  procedure_steps:
