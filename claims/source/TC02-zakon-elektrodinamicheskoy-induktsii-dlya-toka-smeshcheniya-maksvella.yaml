  quote_ru: Математическая структура закона (2) совпадает со структурой закона электромагнитной индукции. Каноническая
    форма записи закона указывает на формирование тока смещения Максвелла либо в вакууме, либо в веществе переменным
    потоком электрической индукции через любую замкнутую поверхность, окружающую источники в виде газа переменных
    дипольных моментов.
