  quote_ru: Сделаны оценки предельно достижимых положительных и отрицательных токовихревых
  statement_en: 'Limit estimates for analog microcircuitry: in a layer 1 mm thick with 1 cm2 area one
    can place 16,000 inductors in 40 layers, creating a positive macroinductance at the 1 mH level, with
    the negative-inductance value an order higher; the prospect technology "conducting film in a current
    ring" operating in the nanoscale Foucault-eddy-current effect regime can integrate ~10 nH inductances
    (per layer up to 500 nm thick) in microchips, while the 10-30 double-layer branch yields passive negative
    inductances with extremely high volume density of about -2.0e7 H/m3; a seven-step experimental program
    is proposed: master multilayer film processes per the Ohio work, replicate Al-Cu results from two
    to 30 layers, verify the nanoscale positive eddy-current inductance effect in a single film, show
    the film inductance dependence on geometry, investigate independence of film inductance from resistivity,
    determine the film frequency-range vs resistivity dependence, and demonstrate dynamic eddy-current
    inductance on a thick single-layer film with the minimal negative value frequency dependence.'
