- id: SC-MO01-002
  type: physical
  facet: phenomenology
  priority: normal
  page: 9
  quote_ru: Увеличение индуктивности свёрнутой ленты микросоленоида с ростом частоты можно объяснить только
    увеличением линейной
  statement_en: 'The author explains the frequency growth of rolled ribbon-microsolenoid inductance by
    the increase of the linear current density in the ribbon — possible only if the AC forms a thin cord
    whose diameter becomes smaller than the ribbon width; as the frequency approaches the cutoff the cord
    "disappears" and the solenoid loses its inductive properties; cord thinning at microwave frequencies
    is explained via the forces retaining the cylindrical cord: with frequency growth the external source
    injects fewer like charges per half-period, lowering the volume density of Coulomb repulsion, while
    the volume density of constricting (Ampere) forces stays constant or falls more slowly; the cutoff
    frequency is when the cord catastrophically collapses into a pinch, where the inductance of a single
    inductor rises sharply and then the solenoid loses its inductive properties.'
  quantities: []
  equations: []
  materials: []
  geometry:
  - current cord thinner than ribbon width
  procedure_steps: []
