  quote_ru: Ключевая работа по упомянутым физическим свойствам, проявляемым планарными индукторами на
    гигагерцах, вышла в 2001 г.
  statement_en: 'The author cites the key 2001 experimental work of Kuhn and Ibrahim: studying current
    flow at high frequencies in single multi-turn square, rectangular and spiral inductors they discovered
    an effect directly opposite to the skin effect — AC at gigahertz frequencies formed a spatially localized
    current cord in the conductor of an inductor of any geometry; with frequency growth the cord decreased
    its cross-section, so the ohmic resistance and inductance of the inductor grew with frequency and
    the AC flow no longer obeyed Ohm''s law.'
