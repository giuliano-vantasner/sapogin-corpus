  quote_ru: В работе [5] приведены частотные зависимости индуктивности ленточных микросоленоидов диаметром
    800 мкм
  statement_en: 'The author reports frequency dependencies of ribbon microsolenoids of 800 um diameter,
    length 1.6 to 2.4 mm, with four to six turns used in power output stages: at low frequencies the inductance
    equals its static value; then low-frequency inductance jitter appears, tied to mechanical resonance
    on longitudinal mechanical oscillations of the elastic turns caused by turn-to-turn attraction from
    co-directed Ampere forces acting each half-period; with further frequency growth toward the cutoff
    the inductance increases by an order and then abruptly loses its inductive properties; American researchers
    also discovered frequency-independent inductances of ultrathin conducting layers (Al+Cu, thickness
    from 200 nm) operating in a definite frequency range.'
