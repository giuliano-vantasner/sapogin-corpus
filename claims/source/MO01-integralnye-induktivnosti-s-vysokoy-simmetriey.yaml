  quote_ru: Рассчитаем физические параметры цилиндрической плёнки из используемого фирмой PARC кремния
  statement_en: 'PARC silicon film parameters (resistivity 10.0 ohm*cm, radial component neglected): the
    film is placed in a six-turn microcoil with cutoff frequency 2.1 GHz and inductance 10 nH; after insertion
    the first inductance zero occurs at F1 = 1010 Hz; the frequency scale f* = F1/0.1605 = 62.3 GHz gives
    a film radius of 900 um, requiring a 2.25-fold increase of the original solenoid radius; for axial
    film thickness 2 um the inductance scale is L* = 1.6 (unit degraded in source); at f = F1/2 = 5 GHz
    the film contributes a very large inductance L = 77.3*L* = 124 (same unit), with working frequency
    2.3 times above the cutoff; at working frequency f0 = f*/(2*pi) = 19.8 GHz the film inductance is
    negative, L0 = -15.3 nH, usable as a microscopic compensator of parasitic series inductance in integrated
    circuits — a tenfold radius decrease lowers the negative inductance by two orders; at f = 12 THz the
    inductance is again positive, LEHF = L*/3 = 533 nH; different working frequencies give a wide spectrum
    of inductance values on one microcoil.'
