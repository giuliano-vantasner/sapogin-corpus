  quote_ru: Применение технологии GaAs и сапфировых кристаллов к концу 80-х гг. позволило создать спиральные
    индуктивности порядка 25 нГн
  statement_en: 'The monograph reports the state of the art: late-1980s GaAs and sapphire technology produced
    spiral inductors of about 25 nH with self-resonance frequency above 3 GHz and geometrical sizes up
    to 500 um; a planar silicon-crystal inductor gave self-resonance at 2.47 GHz at nominal value 9.3
    nH, with square flat shape, nine turns, 230 um linear size, 6.5 um conductor width and 5.5 um strip
    spacing, and maximum Q equal to 3; early-1990s 3D integral structure modeling led to CMOS planar inductors
    — for a low-noise 800-900 MHz amplifier a two-metal-layer silicon spiral inductance of tens to hundreds
    nH with about 2 um thickness was realized.'
  quantities:
