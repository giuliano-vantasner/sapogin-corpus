  page: 229
  quote_ru: К закрытым индукторам отнесём классические соленоиды конечной длины.
  statement_en: 'The author classifies current inductors by field-line geometry into closed and open:
    closed — classical finite-length solenoids whose internal mean magnetic field-line density is always
    higher than outside; placing nanoscale-thin films transverse to the field lines inside can substantially
    raise the positive inductance, produce frequency-independent inductance and raise the cutoff, while
    thick or multilayer films can create dynamic-inductance states with positive values different from
    the original solenoid inductance; filling the whole solenoid space with a conductor gives the maximal
    negative introduced inductance, and the solenoid-rod system inductance always remains reduced but
    positive; open — planar spirals with symmetric field lines in both half-spaces: a nanoscale film on
    one side raises the total positive inductance (frequency-independent), two identical films on both
    sides raise it further, and a thick or multilayer film on one or both sides gives negative frequency-dependent
    dynamic inductance growing proportionally to the layer count, with single-turn current rings increasing
    the achievable volume inductance density.'
  quantities: []
