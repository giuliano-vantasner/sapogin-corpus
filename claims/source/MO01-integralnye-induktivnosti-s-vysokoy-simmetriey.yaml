  quote_ru: Как показывают расчёты, второй нуль частотной зависимости индуктивности RPGS-индуктора должен
    приходиться
  statement_en: Calculations show the second zero of the RPGS-inductor inductance frequency dependence
    should fall at 1.9e12 Hz — a value the 3D EM modeling could not reproduce and experiments did not
    observe; the theoretical estimates agree well with the Italian experimental results, indicating the
    RPGS-inductor class belongs to introduced inductances whose basic physical parameters can be pre-computed
    from the theory; comparisons with American (Dayton university) measurements of a spiral microinductor
    on ultrathin Al and Cu conducting nanolayers showed the two-layer conducting film inductance is practically
    constant to 15% over 0.1 to 10 MHz, confirming the positive frequency-independent flux inductance
    predicted in section 3.3; attention is drawn to layered nanofilms with high volume inductance density
    up to 2.6e4 H/m3; in films with more than 6 layers a dynamic-inductance regime arises, and for ten
    layers a second inductance zero was found at F = 6.2 MHz; the 30-layer experiments independently confirm
    the dynamic-inductance theory and point to passive negative inductance technology with high volume
    density; calculated nanofilm volume inductance density spans 2.5e6 to 2.5e8 H/m3.
  quantities:
