  statement_en: 'Italian technologists created a planar inductor five years after the studied one, differing
    by cylindrical geometry and the number of layers: the spiral inductor was loaded on a layered cylindrical
    structure of modified silicon layers on a conducting copper substrate with a radial patterned ground
    shield; because the variable magnetic field geometry was cylindrical — most favorable for axial eddy
