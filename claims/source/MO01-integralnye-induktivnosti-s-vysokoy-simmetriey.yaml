  quote_ru: Достоинство цилиндрической симметрии заключается в том, что вихревая плотность тока в системе
    не имеет скачкообразных изменений
  statement_en: 'The author states the advantage of cylindrical symmetry: the eddy current density has
    no abrupt changes of current-path direction, whereas abrupt direction changes at high frequencies
    under skin-effect or "Current Crowding Effects" lead to kinking of the current cord and additional
    electron ejection onto the substrate; in the first inductor class a two-layer inductance with azimuthal
    eddy-current direction uses a single-turn conducting current ring instead of generally accepted designs,
    and in the frequency range where negative inductance is realized can give values several times larger
    than spiral-inductor systems; the "conducting film in a current ring" planar inductance for system-on-chip
    has a metal ring on sapphire with one layer of cylindrical conducting or semiconducting film sputtered
    so the film has no ohmic contact with the ring but has contact via mutual induction.'
