  quote_ru: 'Она обладала неожиданными свойствами: ёмкость возникала при небольшом напряжении, приложенному к металлическим
    обкладкам, увеличивалась скачком, а затем убывала обратно пропорционально внешнему напряжению.'
  statement_en: 'Information published on site [1] (G. Detinich, ''Chinese scientists developed a 3-nm transistor'',
    3dnews.ru/988458) states that Chinese technologists were the first in the world to create the smallest-size
    capacitance with a distance between plates of 4 nm; it possessed unexpected properties: the capacitance arose
    at a small voltage applied to the metal plates, increased jumpwise, and then decreased inversely proportional
    to the external voltage.'
  quantities:
