  quote_ru: Факт появления ёмкости в плёнке толщиной в нанометры можно объяснить тем, что в структуре возникает
    двойной электрический слой, определяющую роль в котором играют свободные электроны плазмы плёнки.
  statement_en: The fact of the appearance of capacitance in a film of nanometer thickness can be explained by the
