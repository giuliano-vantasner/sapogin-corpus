  priority: core
  page: 2
  quote_ru: Механизм позволяет понять, объяснить и рассчитать измеренную зависимость ёмкости от напряжения для различных
    плёночных структур, состоящих из проводников, либо полупроводников.
  statement_en: Recently an idea came to the author which, he believes, can clarify the previously unknown physical
    mechanism of formation of such a capacitance; the mechanism allows understanding, explaining, and calculating
    the measured dependence of capacitance on voltage for various film structures consisting of conductors or semiconductors;
    the idea turned out closely connected with the methods of calculating charge clusters discovered experimentally
    by the American researcher K. Shoulders at the end of the last century; using the methods of calculating the
    distribution of substance in charge bubbles the author prepared the monograph 'Mechanisms of matter retention
    by a self-consistent field' and published about 20 scientific works.
