- id: SC-WO07-009
  type: experimental
  facet: measurement
  priority: core
  page: 2
  quote_ru: Оценки показывают, что плёнка толщиной 4 нм (температура комнатная, концентрация свободных электронов
    1025 м-3) образует двойной электрический слой при напряжении срыва 0,4 В.
  statement_en: Estimates show that a film of thickness 4 nm (room temperature, free-electron concentration 10^25
    m⁻³) forms a double electric layer at a breakdown voltage of 0.4 V; a film of thickness 40 nanometers polarizes
    already at a voltage of about 4 V; the working voltage of the capacitor is always greater than the voltage of
    the plasma-instability breakdown; the varicap capacitance is small at voltages less than the breakdown voltage;
    at the breakdown voltage it is the largest and then decreases inversely proportional to the external voltage;
    the approximate volt-farad characteristic is presented in Fig. 1.
  quantities:
