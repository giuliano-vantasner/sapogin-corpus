- id: SC-WO07-004
  type: experimental
  facet: phenomenology
  priority: core
  page: 1
  quote_ru: Американские исследователи харвейстеров под руководством профессора П.М.Тибадо создали конденсатор,
    один электрод которого состоял из плёнки графена, а другой был острийным.
  statement_en: 'American researchers of harvesters under the guidance of professor P.M. Thibado created a capacitor
    one electrode of which consisted of a graphene film and the other was pointed; they discovered two different
    cases of dipole-moment distribution in graphene: the first case was realized when the electric energy stored
    in the elementary layer of the film was of the order of its thermal energy — the thermal energy made the electric
    moment of the film dipole change chaotically in time and space, which changed the magnitude of the bending deformation
    of the film caught in the external electric field, and it oscillated randomly in time and generated a fluctuation-induction
    current; the second case of large electric fields stored in the film electric energy orders of magnitude greater
    than thermal; the dipole structures oriented mainly in one direction and practically did not depend on time;
    the transfer of thermal energy to them did not lead to a change of their dipole moment in space; generation
    of the fluctuation-induction current was absent.'
  quantities: []
