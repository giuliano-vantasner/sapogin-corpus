- id: SC-WO07-008
  type: physics
  facet: theory
  priority: core
  page: 2
  quote_ru: Неустойчивость плазмы возникает потому, что при таких высоких напряжённостях давление внешнего поля
    оказывается больше, чем давление газа электронов твёрдого тела при данной температуре.
  statement_en: If a static electric field is applied to a thin film then, at strength values greater than the intracrystalline
    field strength, an electric instability of the solid-body plasma arises — a new physical effect explaining the
    polarization properties of the solid-body plasma; the plasma instability arises because at such high strengths
    the pressure of the external field turns out greater than the pressure of the electron gas of the solid body
    at the given temperature; the electrization of the solid-body plasma arising under pressure leads to a macroscopic
    separation of charges; the electrons are thrown off by the field and form the dipole electric moment of the
    film.
  quantities: []
  equations: []
