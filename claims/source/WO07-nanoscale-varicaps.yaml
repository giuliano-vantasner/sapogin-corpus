- id: SC-WO07-003
  type: experimental
  facet: measurement
  priority: core
  page: 1
  quote_ru: Происхождение ёмкости они объяснили существованием в плёнке подвижной доменной стенки, дипольная структура
    которой была сориентирована так, что ёмкость, как утверждают авторы, стала отрицательной.
  statement_en: 'Russian technologists from the Southern Federal University (SFU) A. Razumnaya and Yu. Tikhonov
    also created a similar capacitance with a distance between plates of 10 nm; they explained the origin of the
    capacitance by the existence in the film of a movable domain wall whose dipole structure was oriented so that
    the capacitance, as the authors assert, became negative; the film exhibited the same property as with the Chinese
    technologists: its capacitance decreased inversely proportional to the external voltage; this indicates that
    the physical mechanism of formation of the double electric layer in a film of nanoscale thickness under an external
    static electric field has the same, still unknown to technologists, nature.'
  quantities:
