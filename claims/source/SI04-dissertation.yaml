  quote_ru: Скопления зарядов (СЗ) образуются в зазоре между катодом и анодом при создании сильного (от 2 до 10 кВ) электрического поля, имеют малые размеры (от долей до десятков микрометров), большой отрицательный
    заряд (от 108 до 1011 электронов в скоплении) и время жизни от 30 до 100 пс, превышающее время возможного разлета зарядов.
  statement_en: Sapogin reports charge clusters (CZ) form in the cathode–anode gap under a strong (2–10 kV) electric field, have sizes from fractions to tens of micrometres, large negative charge (10^8
    to 10^11 electrons per cluster), and lifetime 30–100 ps exceeding the possible charge-dispersal time.
