- id: SC-PA03-001
  type: physics
  facet: recipe
  priority: normal
  page: 14
  quote_ru: '1. Планарная индуктивность, содержащая как минимум один виток (1) из металлической пленки толщиной
    h1, расположенный на изолирующей подложке (2), первый (3) и второй (4) выводы интегральной индуктивности для
    ее включения в электронную схему, отличающаяся тем, что во внутреннюю область витка (1) из Стр.: 14 RU 2 614
    188 C1 металлической пленки толщиной h1 введена дополнительная тонкая пленка (5) толщиной h2<<h1 из материала,
    обладающего заданной электропроводностью и не имеющего электрического контакта с витком (1) планарной индуктивности.'
  statement_en: 'Patent claim 1 (verbatim): a planar inductance containing at least one coil (1) of metal film of
    thickness h1 located on an insulating substrate (2), with first (3) and second (4) integrated-inductance terminals
    for connection into an electronic circuit, characterized in that an additional thin film (5) of thickness h2
    << h1, made of a material with specified electrical conductivity and having no electrical contact with the coil
    (1), is inserted into the inner region of the coil (1).'
  quantities: []
  equations: []
  materials:
  - металлическая пленка толщиной h1
  - дополнительная тонкая пленка h2<<h1
  - изолирующая подложка (2)
  geometry:
  - h2 << h1 (толщина дополнительной пленки от десятков до сотен нанометров)
  procedure_steps: []
