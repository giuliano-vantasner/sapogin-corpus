  quote_ru: Данные табл. 3 указывают на возможность дальнейшего уменьшения площади, занимаемой интегральной индуктивностью
    с предлагаемой конструкцией. Такое уменьшение может привести к достижению предельных значений поверхностной
    плотности индуктивности вплоть до 9,8 Гн/м2.
  statement_en: 'Table 3 data indicate the possibility of further reducing the area occupied by the integrated inductance
    of the proposed construction, up to limiting surface inductance densities of 9.8 H/m2; computer modeling (tables
    1 and 2) confirms the claimed task: changing the additional thin film thickness from 50 nm to 350 nm changes
    the inductance in the range from 100 to 14 nH, which is significantly better (5-50 times) than the maximum single-turn
    inductance of known constructions achieved in one layer.'
