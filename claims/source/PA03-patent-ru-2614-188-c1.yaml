  quote_ru: Из (27) следует, что средняя за полупериод потоковая индуктивность Lф 45 дополнительной тонкой пленки
    5 не зависит от частоты и может быть как положительной, так и отрицательной величиной.
  statement_en: From (27), the half-period-averaged flow inductance Lф of the additional thin film does not depend
    on frequency and can be either positive or negative; at h2<R the film thickness coincides with the elementary
    current-vortex thickness only for h2 below one micron, where a positive frequency-independent flow inductance
    is realized and the eddy currents display unexpected paramagnetic properties; at h2>1 µm with h2<R violated,
    the conducting cylinder is either in negative frequency-independent inductance (strong diamagnetism at macroscopic
    scales) or in frequency-dependent dynamic inductance vanishing at two characteristic frequencies.
  quantities:
  - Lф не зависит от частоты; знак ±
  - положительная Lф при h2 < 1 мкм (h2<R)
