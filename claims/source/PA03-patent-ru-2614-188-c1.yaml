  page: 12
  quote_ru: 'За счет обнаруженных наноэффектов она позволяет реализовать в 5÷50 раз более высокие Стр.: 12 RU 2
    614 188 C1 значения индуктивности, но только при строго определенных значениях толщин h2<<h1.'
  statement_en: Thanks to the discovered nano-effects the proposed integrated-inductance construction allows realizing
    5-50 times higher inductance values, but only at strictly defined thicknesses h2<<h1; the choice of the additional
    thin film material allows shifting the working frequency range of the claimed inductance into a given frequency
    band (the coil (current ring) inductance Lк for ~50 µm geometries does not exceed 1 nH up to frequencies of
    order 1 GHz).
  quantities:
  - L × 5–50 при h2 << h1
  - Lк ≤ 1 нГн до ~1 ГГц (геометрия ~50 мкм)
