- id: SC-PA03-003
  type: physics
  facet: recipe
  priority: normal
  page: 5
  quote_ru: 'По существу в настоящем изобретении предлагается увеличить в 5-50 раз 45 поверхностную плотность индуктивности
    путем расположения на той же площади кристалла дополнительной тонкой пленки 5. Причем толщина h2 этой пленки
    должна находиться в диапазоне от десятков до сотен нанометров. При других значениях толщины h2 заявляемый положительный
    результат не обеспечивается, т.к. он связан с Стр.: 5 RU 2 614 188 C1 наноразмерными эффектами.'
  statement_en: The invention essentially proposes increasing the surface inductance density 5-50 times by placing
    an additional thin film 5 on the same chip area; the film thickness h2 must lie in the range from tens to hundreds
    of nanometers — at other h2 values the claimed positive result is not achieved because it is connected with
    nanoscale effects.
  quantities:
  - плотность индуктивности × 5–50
  - h2 = десятки–сотни нм
