  page: 8
  quote_ru: В таких сверхтонких пленках токи Фуко формируют 10 частотнонезависимую положительную индуктивность Lф,
    которая приводится к выводам 3 и 4 интегральной индуктивности, проявляя свои неожиданные парамагнитные свойства.
  statement_en: 'In cylindrical films of tens and hundreds of nanometers thickness (per experiments of American
    technologists [36]) the value σ=-1 arises: Foucault (eddy) currents form a frequency-independent positive flow
    inductance Lф referred to the inductance terminals 3 and 4, displaying unexpected paramagnetic properties; σ=+1
    is realized for eddy currents in conducting cylinders at macroscopic scales, which display their natural diamagnetic
    properties (the cylinder height h2 then must exceed its radius R and significantly exceed 1 µm).'
  quantities:
  - 'σ = -1 (наноплёнки): парамагнитные свойства'
  - 'σ = +1 (макроцилиндры): диамагнитные свойства'
  - h2 > R и h2 >> 1 мкм (для σ=+1)
