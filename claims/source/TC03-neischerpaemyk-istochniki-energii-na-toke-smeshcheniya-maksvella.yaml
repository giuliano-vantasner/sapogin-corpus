- id: SC-TC03-001
  type: experimental
  facet: experiment
  priority: core
  page: 1
  quote_ru: Он смог «рассмотреть» пикосекундную структуру тока, возникающего между двумя электродами в вакууме при
    импульсном напряжении порядка 10 кВ. Оказалось что ток, в вакуумном промежутке между острийным катодом и планарным
    анодом, может дробиться на сферические порции с диаметрами от 5 до 15-и микрометров, содержащие в кластере от
    108 до 1011 электронов.
  statement_en: 'Ken Shoulders'' outstanding discovery (1970s): he managed to ''resolve'' the picosecond structure
    of the current arising between two electrodes in vacuum at impulse voltage of order 10 kV; the current in the
    vacuum gap between a point cathode and a planar anode can break into spherical portions with diameters from
    5 to 15 micrometers containing from 10^8 to 10^11 electrons in a cluster.'
  quantities:
  - U ~ 10 кВ (импульсное)
  - d(порции) = 5–15 мкм
  - N(электронов в кластере) = 10^8–10^11
