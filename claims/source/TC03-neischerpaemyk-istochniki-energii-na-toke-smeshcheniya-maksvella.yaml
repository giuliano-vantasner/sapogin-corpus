    на короткое время в ограниченной области пространства пузырёк зарядов, имеющий тонкую стенку.
  statement_en: These portions were first called 'Elektrum Validum (EV)', then renamed 'charge cluster'; recent
    studies refined the name again — the charge portion is now perceived by many as a charge bubble with a thin
