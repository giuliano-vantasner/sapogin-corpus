  quote_ru: Показано, что в слое толщиной в 1 мм и площадью 1 см^(2) можно разместить 16 000 индукторов в 40 слоях. Это позволит создать положительную макроиндуктивность, значение которой будет лежать на
    уровне 1 мГн. Для отрицательной индуктивности последнее значение будет больше на порядок.
  statement_en: Sapogin reports estimates that a 1-mm-thick, 1-cm^2 layer can host 16,000 inductors in 40 layers, giving a positive macroinductance at the 1 mH level, with the negative inductance value
    an order of magnitude larger.
