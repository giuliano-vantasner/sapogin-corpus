  page: § Технологии персональной энергетики на пузырьковых структурах зарядов (физические основы)
  quote_ru: Опыты К.Шоулдерса, Г.Месяца, Б.Каторгина показали, что протекание тока в вакууме или в горячей плазме характеризуется образованием микроскопических структур газообразного вещества в виде пузырька
    зарядов или скоплений из пузырьков заряда. На синтез одного пузырька затрачивается электрической энергии на три порядка меньше, чем он потом излучает при распаде.
  statement_en: Sapogin reports the experiments of Shoulders, Mesyats and Katorgin showed current flow in vacuum or hot plasma features formation of microscopic gas-like structures as charge bubbles or
    clusters of charge bubbles, and synthesizing one bubble consumes three orders of magnitude less electric energy than it later radiates upon decay.
