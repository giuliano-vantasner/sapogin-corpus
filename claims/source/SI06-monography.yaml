  page: § Технологии персональной энергетики на пузырьковых структурах зарядов (физические основы)
  quote_ru: Этот факт указывает на существование физического механизма необратимого нарастания энергии в процессах синтеза/распада любых пузырьков зарядов. Механизм объясняет причины существенного увеличения
    температуры плазмы газового разряда, солнечной короны, возрастания световой энергии в светодиодных и газонаполненных лампах. Он же объясняет причины нарастания электрической энергии зарядов проводника
    при любых способах их разделения.
  statement_en: Sapogin asserts the 1000x synthesis/decay asymmetry points to a physical mechanism of irreversible energy growth in synthesis/decay of any charge bubbles, explaining the significant temperature
    increase of gas-discharge plasma and the solar corona, the growth of light energy in LEDs and gas-filled lamps, and the growth of electric energy of conductor charges under any method of their separation.
