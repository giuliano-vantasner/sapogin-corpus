  quote_ru: Уравнения (20) и (21) не интегрируются в элементарных функциях.
  statement_en: 'The instability process forming various plasmoids at its initial stage follows from equation (7);
    the method of counter plane waves reduces (7) to a pair of self-model equations for two plane-wave phases θ
    = ξ+γτ and ψ = ξ−γτ, where γ = vf/u* is the reduced phase velocity and σ = ±1 the sign multiplier distinguishing
    the two possible directions of phase-velocity propagation: y1″ + 2y1y1′ − β²y1 − 2σγy1′ = 0 (20) for phase θ,
    and y2″ + 2y2y2′ − β²y2 + 2σγy2′ = 0 (21) for phase ψ; at γ = 0 equations (20) and (21) pass into the static
    equation (8); they are not integrable in elementary functions.'
  quantities: []
  equations:
  - y_1'' + 2y_1y_1' - \beta^2 y_1 - 2\sigma\gamma y_1' = 0
  - y_2'' + 2y_2y_2' - \beta^2 y_2 + 2\sigma\gamma y_2' = 0
