- id: SC-AR09-018
  type: mathematical
  facet: theory
  priority: core
  page: 9
  quote_ru: Два разностных решения y  ( y1  y2 ) не зависят от знака σ и дают физически осмысленный результат.
  statement_en: 'Lowering the order of (20) for initial conditions y(0) = 0, y′(0) = p₀ = β²/2 under the condition
    |y| < 1 gives two approximate solutions of the form p ≈ p₀ + 2σγy: y1 ≈ (β²/4σγ)[exp(2σγθ) − 1] (22); similarly,
    for initial conditions y′(0) = −β²/2 from equation (21): y2 ≈ −(β²/4σγ)[1 − exp(−2σγψ)] (23); the sum of the
    two solutions gives an extraneous solution, while the two difference solutions y = ±(y1 − y2) do not depend
    on the sign σ and give a physically meaningful result: the seed collective field distribution in the plasmoids
    is y ≈ ±(β²/2γ)·exp(2γ²τ)·sh(2γξ) (24), the electron concentration distribution is z ≈ 1 ∓ (2/β²)·exp(2γ²τ)·ch(2γξ)
    (25), and the electron velocity distribution is u ≈ y((4γ²/β²z) − 1) (26).'
  quantities: []
  equations:
  - y_1 \approx \frac{\beta^2}{4\sigma\gamma}\left[\exp(2\sigma\gamma\theta)-1\right]
