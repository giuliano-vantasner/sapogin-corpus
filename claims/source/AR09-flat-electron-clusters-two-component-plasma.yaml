  quote_ru: Так, группой Голубничего П.И. наблюдались долгоживущие светящиеся объекты (ДСО) миллиметровых радиусов
    в очищенной воде [1]. Шабанов Г.Д. зафиксировал светящийся поверхностный разряд в водопроводной воде, формирующий
    разнообразные по форме светящиеся воздушные плёнки, имеющие сантиметровые размеры [2].
  statement_en: 'Over the last thirty years experiments on passing powerful short electric pulses through various
    conducting media were carried out in physical laboratories of many countries: the group of P.I. Golubnichiy
    observed long-lived glowing objects (LLO) of millimeter radii in purified water; G.D. Shabanov registered a
    luminous surface discharge in tap water forming luminous air films of various shapes with centimeter sizes.'
