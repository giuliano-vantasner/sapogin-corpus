  quote_ru: Из (24) – (26) видно, что все электроны, участвующие в формировании неустойчивости, разделены на четыре
    класса.
  statement_en: 'From (24)-(26) all electrons participating in the formation of the instability are divided into
    four classes: the first class — electrons located near the ξ = 0 plane, practically immobile at any moment of
    time; the second class — electrons with u = 0 in a certain region of space at a certain moment, their rest in
    the dynamical system explained by the equality of the forces holding the volume in equilibrium: for them the
    vector sum of the Bernoulli force fb = −kT∇n and the field-pressure gradient f = −enE acting on the electrons
    is zero; the third class — electrons moving in the direction of the field strength, their motion provided by
    the Bernoulli force, which in these plasma regions is greater than the field-pressure gradient; the fourth class
    — electrons moving against the collective field strength, their motion provided by the field-pressure gradient,
    which in these regions is greater than the Bernoulli force.'
  quantities: []
