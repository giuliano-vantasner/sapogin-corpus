  quote_ru: Интегрируя (10), получаем приближённое решение в классе периодических функций для начальных условий
    y( 0 )  0; y( 0 )  p0 , справедливое в области y  1
  statement_en: 'Lowering the order of (8) by the function p(y) = dy/dξ gives dp/dy = y(β²/p − 2) (9) — an equation
    with separable variables having solutions in implicit functions, which do not help obtain a physically meaningful
    result; since at y = 0, dp/dy = 0, approximate solutions of (9) are sought in the class of two-term series p
    ≈ p₀ + αy² (10) with α > 0, p₀ > 0; substituting (10) into (9) and keeping terms proportional to y gives y²(2p₀α
    + 2p₀ − β²) = 0 (11), whence p₀ = β²/2(1+α) and α = β²/2p₀ − 1 (12); the requirement α > 0 defines the range
    0 < p₀ < β²/2; integrating (10) gives the approximate solution in the class of periodic functions for initial
    conditions y(0) = 0, y′(0) = p₀, valid in the region |y| < 1: y ≈ [β/√(2α(1+α))]·tg[√(α/2(1+α))·βξ] (13).'
  quantities:
  - 0 < p0 < beta^2/2
  equations:
  - \frac{dp}{dy} = y\left(\frac{\beta^2}{p} - 2\right)
  - p \approx p_0 + \alpha y^2
  - p_0 = \frac{\beta^2}{2(1+\alpha)}
  - y \approx \frac{\beta}{\sqrt{2\alpha(1+\alpha)}}\,\mathrm{tg}\!\left[\sqrt{\frac{\alpha}{2(1+\alpha)}}\,\beta\xi\right]
