  quote_ru: 'описывается системой трёх дифференциальных уравнений в частных производных:'
  statement_en: 'In the authors'' view, the process of plasmoid formation by a collective electric field in a two-component
    plasma with uniform temperature is described by a system of three PDEs: enE + kT∇n + mnνu = 0 (1) — equilibrium
    of an elementary volume of nonstatic plasma; ∂n/∂t + div(nu) = 0 (2) — continuity equation; div E = 4πe(n₀ −
    n) (3) — Poisson equation (CGS), with E the collective electric field strength, n0 the positive-background charge
    concentration, n the drifting electron concentration, e the elementary charge, T the absolute temperature, m
    the electron mass, u the electron drift velocity, ν the electron-background collision frequency, k the Boltzmann
    constant.'
