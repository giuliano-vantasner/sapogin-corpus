  quote_ru: Более общий вид уравнения (7) был получен В.И.Пустовойтом в [3].
  statement_en: 'The nonstatic system (4)-(6) can be reduced to one equation for y(ξ,τ): ∂y/∂τ − y·∂y/∂ξ = (1/2)∂²y/∂ξ²
    − (β²/2)y (7); at β² = 0 equation (7) resembles the Burgers equation for kinematic viscosity 1/2; its differences
    from the Burgers equation: (1) the sign before the nonlinear term y·∂y/∂ξ is opposite; (2) the parameter β²
