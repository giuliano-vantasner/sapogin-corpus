  quote_ru: Поскольку максимальное значение концентрации электронов (16) всегда меньше, чем концентрация положительных
    зарядов фона, то полученное решение описывает ограниченный в пространстве плазмоид в виде электронного кластера
    в дырочной плазме.
  statement_en: The approximate solution (13) gives the distribution of the static collective plasma field in the
    region ξ < ξ0 (relation 14); in the plane ξ = 0 the strength vanishes and its spatial growth rate depends on
    the state parameter β; the collective-field vector is directed to both sides of the ξ = 0 plane; this orientation
    makes the plasma electrons redistribute so that near the zero-field-pressure plane (where y² = 0, ξ = 0) they
    form high-concentration regions; the approximate concentration law from (6) is z = 1 − (2/β²)dy/dξ ≈ 1 − (1+α)⁻¹cos²[√(α/2(1+α))·βξ]
    (15); the maximum of the electron concentration distribution falls on the ξ = 0 plane and equals zM = 1 − 1/(1+α)
    (16); since this maximum is always less than the positive-background concentration, the solution describes a
    spatially bounded plasmoid in the form of an electron cluster in a hole plasma.
