  statement_en: 'In dimensionless functions the system takes the form ∂z/∂ξ = −2(y+u)z (4), ∂u/∂ξ = (1/z)(∂z/∂τ
    + u·∂z/∂ξ) (5), ∂y/∂ξ = (β²/2)(1−z) (6), where β² = 2n₀kT/(E*²/8π) = T/T* is the state parameter of the system
    (T* — characteristic temperature) determining three possible plasma states: cold plasma 0 < β² < 1, equality
    of plasma temperature to the characteristic one (separatrix) β² = 1, hot plasma β² > 1; for any β the system
    has the solution of a uniform plasma (z = 1) without collective field (y = 0) and without directed electron
    motion (u = 0), which should be assigned to the case of an electrically neutral plasmoid.'
