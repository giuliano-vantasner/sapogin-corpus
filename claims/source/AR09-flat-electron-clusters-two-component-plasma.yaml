  quote_ru: 'Исследование статических решений модели указывает на возможность существования трёх видов плазмоидов:
    электронейтрального и заряженного положительно (электронный кластер в дырочной плазме), либо отрицательно (электронный
    кластер в электронной плазме).'
  statement_en: 'An approximate physical-mathematical model of plasmoid generation in a two-component plasma adequately
    describing their observed electrical properties is proposed; the study of static solutions of the model indicates
    the possibility of three kinds of plasmoids: electrically neutral, positively charged (electron cluster in hole
    plasma), or negatively charged (electron cluster in electron plasma); the study of nonstatic solutions at the
    initial stage indicates the possibility of two kinds of electrical instability: slow-wave instability and fast-wave
    instability.'
