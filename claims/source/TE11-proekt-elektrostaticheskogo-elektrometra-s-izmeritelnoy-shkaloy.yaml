- id: SC-TE11-004
  type: physical
  facet: schematic
  priority: normal
  page: 2
  quote_ru: Он состоит из металлической стрелки 1, закреплённой на вертикальном подвесе 2, соединённом
    со стальным стержнем 3. Конструкция помещена в заземлённый металлический цилиндрический корпус 4,
    который в верхней части изолирован от стержня диэлектриком.
  statement_en: The upgraded electrometer consists of a metal needle (1) fixed on a vertical suspension
    (2) connected to a steel rod (3); the assembly is placed in a grounded metal cylindrical housing (4)
    insulated from the rod by a dielectric at the top; supplying charge to the suspension turns the needle
    by an angle set by the potential difference between electrode 2 and housing 4.
  quantities: []
  equations: []
  materials:
