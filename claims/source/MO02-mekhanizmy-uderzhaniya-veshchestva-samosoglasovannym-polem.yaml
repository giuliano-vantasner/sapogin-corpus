  quote_ru: Одним из наиболее значительных возможных приложений EV- технологий станет переработка
  statement_en: The appendix names radioactive-waste processing with EVs (conversion into non-radioactive
    elements) as one of the most significant EV-technology applications; Shoulders filed a patent application
    for the process called "Plasma injection processing", with similar applications by other researchers
    (Rod Neal, Stan Gleeson etc.); an EV can serve as an accelerator with sufficient energy to inject
    a large group of nuclei into a target and generate a group nuclear reaction; EV structure allows it
    to enclose about 1e5 nuclides; EVs can absorb ions until the total system charge becomes positive
    — such EVs are called nuclide EVs (NEV); per Shoulders, NEV acts as a supermassive negative ion with
    a high charge-to-mass ratio, enabling a simple nuclear accelerator; NEVs can be created by mechanical
    energy stored in the crystal lattice and released by fractoemission of electrons, and in acoustic/water
    systems by charge separation in a collapsing bubble; analysis of palladium waste after NEV processing
    showed increased amounts of Mg, Ca, Si, Ga and Au; local fractoemission from NEV impacts provides
    significant reaction energy and may cause extremely fast energy propagation initiating or sustaining
    the reaction.
