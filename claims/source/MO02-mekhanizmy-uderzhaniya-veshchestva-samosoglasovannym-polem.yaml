- id: SC-MO02-016
  type: physical
  facet: phenomenology
  priority: normal
  page: 216
  quote_ru: Одним из важных теоретических результатов следует считать существование в сферическом случае
    внутренней атмосферы зарядов
  statement_en: 'The conclusion highlights: in the spherical case an internal charge atmosphere exists
    whose concentration grows toward the system center; it forms inside a thin-walled metal sphere carrying
    negative excess charge, with height from thousandths to hundreds of micrometers depending on accumulated
    charge, temperature and radius; the high-concentration layer has metal properties and should reflect
    coherent radiation well — interferometric methods with visible-light wavelengths are sensitive enough
    to measure the height dependence on the imparted charge; glowing ball-shaped charge clusters have
    long been observed in high-current experiments in various media (first glowing balls in a Leyden-jar
    discharge; long-lived glowing objects in liquids); in unpublished MRTI experiments a high-current
    cylindrical electron beam output into a gas atmosphere turned into glowing balls with lifetimes sufficient
    for visualization, and the retention mechanism explains static states of glowing balls in any media
    from a unified viewpoint.'
  quantities:
