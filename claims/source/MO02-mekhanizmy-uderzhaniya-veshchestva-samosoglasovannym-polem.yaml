  priority: normal
  page: 8
  quote_ru: Возьмем тонкостенную уединенную металличе- скую сферу в вакууме радиусом от 5 до 10 см
  statement_en: 'The author proposes constructing an unusual object: charge a thin-walled isolated metal
    sphere in vacuum of radius 5 to 10 cm with a negative charge four-five orders above the largest EV
    charge; after micron charge atmospheres form, mentally remove the sphere — under the retaining forces
    the atmospheres converge and a charge cluster arises with energy in the range 10 to 230 kJ; the object
    is lighter than a dust mote (no heavier than 1e-14 kg), can float freely in the atmosphere moving
    with air flows and act on surrounding metal objects as a charged body; its moving electrons radiate
    electromagnetic waves in a wide frequency range, heating adjacent atmosphere; irreversible contact
    losses guarantee decay — in some cases radiation with silent disappearance, in others an explosion
    upon reaching critical charge-concentration loss; similar objects often arise during thunderstorms
    and in experiments modeling large currents in gas atmospheres.'
  quantities:
  - радиус 5–10 см
  - заряд на 4–5 порядков выше EV
  - энергия 10–230 кДж
  - масса не тяжелее 10-14 кг
