  quote_ru: Второй кластер имеет характерные параметры, которые могут осу- ществиться в шаровой молнии
  statement_en: 'The author concludes the first cluster matches tip-cathode experiments at cathode temperature
    2e3 K — its charge approaches the upper experimental bound, small sizes carry large electric, thermal
    and field energy, the mass change is equivalent to 1.1e10 eV, and the boundary charge concentration
    exceeds the mean solid electron concentration, giving the experimentally observed diamond-abrasive
    hardness; the second cluster matches a high-temperature ball lightning: a thin-walled charge bubble
    with micrometer walls; for x/R from 1e-8 to 1e-6 its charge spans Q = 24e-6 to 2.4e-3 C, the charge
    mass 1.4e-16 to 1.4e-14 kg (extremely light), the electric energy We from 26 to 2.6e5 J matching observations,
    boundary forces from 60 to 6e5 N, inert-mass decrease equivalent to 0.75e14 to 4.2e16 eV, and boundary
    electron concentrations 5.9e21 to 5.9e25 m-3.'
