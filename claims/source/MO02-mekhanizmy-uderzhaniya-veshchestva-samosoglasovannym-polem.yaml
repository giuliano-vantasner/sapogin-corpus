  quote_ru: Второй физический объект можно построить на основе первого, за- менив в нем электроны на нейтроны
  statement_en: 'A second object: replace electrons by neutrons, increase the sphere radius to 5 km and
    the neutron concentration to nuclear — repulsion forces are replaced by attraction; the sign change
    only means the particle concentration in a gravitational cluster (GK) decreases outward in the external
    atmosphere and inward in the internal one; under certain conditions a cavity can appear inside the
    substance, with smooth concentration decrease on the outer and inner boundaries; such an object may
    interest researchers of matter distribution in "cold" neutron stars; at high temperatures or when
    the separating sphere radii are small compared with the internal atmosphere thickness the inner cavity
    disappears; the author also answers the Gauss-theorem objection, stating the investigation showed
    the limited applicability of the Gauss theorem for calculating fluxes of static self-consistent fields.'
