  statement_en: 'The author asserts that DC in any conductor consists of two interacting components: the
    conduction current inside the conductor and the current of excess charges flowing along the conductor
    surface, whose carrier mobilities differ strongly; introducing the "surface current of excess charges"
    enables a non-quantum explanation of autoelectron emission: at room temperature a charge atmosphere
    always exists in the near-cathode region of a vacuum diode (fed by a small number of thermoelectrons
    and charges from the external accelerating field); raising the cathode-anode voltage increases the
    atmosphere height — more excess charges maintain the arising displacement current and the external
    electrostatic field elastically deforms the atmosphere height; at a threshold external field strength
    the atmosphere height reaches the cathode-anode distance and the current must appear jump-wise when
    the atmosphere touches the anode — whereas the quantum model of autoelectron emission has no threshold
    values or current jumps.'
