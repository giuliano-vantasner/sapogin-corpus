- id: SC-MO02-002
  type: experimental
  facet: phenomenology
  priority: normal
  page: 5
  quote_ru: Эксперименты с высокой точностью показали, что остающийся на шаре заряд равен нулю.
  statement_en: 'The author analyzes Cavendish-type experiments (removable hemispherical shell over a
    charged ball): high-precision experiments showed zero residual charge on the ball, which he explains
    by the removed shell not leaving its internal charge atmosphere on the ball; the internal atmosphere
    height under the same conditions is less than the external one — fractions of a micrometer — and cannot
    be detected by any gross mechanical or electric measurements; due to Coulomb interaction the charge
    concentration in the external atmosphere grows outward and in the internal atmosphere inward; for
    large negative charges the concentration near the internal cavity can reach or exceed the mean electron
    concentration of the solid, giving the atmosphere the hardness of metal.'
  quantities:
  - 'внутренняя атмосфера: доли мкм'
  equations: []
  materials: []
  geometry: []
  procedure_steps:
  - charge a ball with a snug removable conductive shell
  - remove the shell with insulating handles
  - measure the residual ball charge
  measurements:
