  quote_ru: EV можно рассматривать как атом без ядра или сферический
  statement_en: 'Per the appendix (Shoulders material): EV can be viewed as an atom without a nucleus
    or a spherical oscillator of like charges; EVs display solitary-wave properties with a compaction
    count equal to the Avogadro number; these charged electron bunches possess binding energies exceeding
    atomic ones, permitting new types of nuclear reactions in matter; EV diameter is relatively small
    (about 0.1 um) with a high negative charge (usually about 1e11 electrons, minimum 1e8); an upper ion-concentration
    limit exists: 1 positive ion per 100,000 electrons; under an applied field EVs can reach speeds of
    order 1/10 the speed of light; the most frequently encountered quantum-level structure has diameter
    about 1 um, though EVs of order 1/10 um were observed; most probably a spheroid, it may be toroidal
    with fine structure; single EVs are rare — spheroids tend to form closed chains (quasi-stable ring-like
    structures about 20 um in diameter) that freely rotate and interweave, with inter-EV distance about
    the spheroid diameter; chains form chaotically at the cathode then automatically rearrange into rings,
    and strike surfaces without rotation, shear or tilt.'
