  quote_ru: Ни одно из них не может прояснить самый древний парадокс экс- периментальной электростатики.
  statement_en: The author states that none of the four known interactions (gravitational, strong, weak,
    electromagnetic) can clarify the oldest paradox of experimental electrostatics — what compensates
    Coulomb repulsion of the excess charge once it has formed a surface atmosphere; nuclear forces act
    at 1e-15 m and cannot explain micron charge atmospheres; he quotes Matveev's 1983 textbook remark
    that electrostatics does not study why surface charges do not leave the conductor and the nature of
    the retaining forces, and notes two opposite unsubstantiated views exist, with the second admitting
    autonomous bounded systems of excess charges — charge clusters (ZK) studied for the last 20 years,
    with experimental discovery priority belonging to K. Shoulders.
