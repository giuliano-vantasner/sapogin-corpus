  quote_ru: Объяснение, предложенное самим Шоулдерсом, ос- новано на работе
  statement_en: 'The author reports Shoulders'' own explanation of ZK properties, based on the concept
    of a polarized vacuum possessing zero-point oscillation energy: Shoulders asserted the initial electron
    motion at EV formation is maintained in equilibrium or even compressed by zero-point oscillation energy,
    and that EV is a perfect spherical generator built on an asymmetric vibrator exciting vector and scalar
    longitudinal waves without electric or magnetic fields; no quantitative relations allowing EV calculation
    are given, which the author criticizes as narrow-professional jargon, arguing part of the ZK properties
    coincide with those of excess-charge atmospheres — evidence of the same physical nature of the retaining
    forces and of an unknown property of collective charge interaction manifesting only at high concentration.'
