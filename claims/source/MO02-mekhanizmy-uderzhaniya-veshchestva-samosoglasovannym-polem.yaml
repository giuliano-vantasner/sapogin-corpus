- id: SC-MO02-004
  type: experimental
  facet: phenomenology
  priority: core
  page: 7
  quote_ru: EV, образующиеся при создании сильного (от 2 до 10 кВ) электри- ческого поля между катодом
    и анодом, имеют малые размеры
  statement_en: 'The author summarizes EV (Elektrum Validum) properties per Shoulders: EVs form under
    a strong field of 2 to 10 kV between cathode and anode, are small (fractions to tens of micrometers)
    and carry a large electron charge (1e8 to 1e11 electrons per sphere); individual EVs are rare — they
    usually form ring-like structures about 20 um in diameter consisting of EV chains; the mean EV lifetime
    is about 30 ps, for whose observation a special picoscope with 0.1 ps resolution was built; the mean
    electron concentration in EV is 6.6e23 cm-3, an order above the mean electron concentration of solids,
    and without a crystal lattice EV shows the hardness of diamond abrasive — given a channel smaller
    than its diameter it drills a wider one, and its passage through a film leaves a hole with burnt edges;
    pulsed EV generation at the tip cathode quickly wears its surface; EV flow interaction with a radioactive
    substrate reduces its radioactivity; EVs moving through gas are accompanied by a visible stream of
    particles (streamer) preceded by a narrow beam of light; EV decay releases energy as X-rays or explodes
    upon reaching a critically low charge density.'
  quantities:
  - 2–10 кВ
  - 108–1011 электронов
  - кольца ~20 мкм
  - время жизни ~30 пс
  - пикоскоп 0,1 пс
  - 6,6·1023 см-3
  equations: []
