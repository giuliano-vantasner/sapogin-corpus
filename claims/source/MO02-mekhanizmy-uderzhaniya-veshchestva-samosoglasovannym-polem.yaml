  statement_en: 'EV quantitative parameters (appendix): residual charge after collision of a 3 um EV with
    an electrode is 2e10 electrons; a 10 um EV loses 3.5e14 electrons over a 1 mm path; there are indications
    EV may explode upon reaching a critically low charge or density; Shoulders estimated the EV current
    density at approximately 6e11 A/cm3, the emission current at about 1.7e6 A, the characteristic lifetime
    at 3e-11 s, and the charge density at about 6.6e23 electrons/cm3, approaching the mean charge density
    of a solid; Shoulders explains EV retention by zero-point oscillation energy of the polarized vacuum/ether
    (Bergstrom), asserting the initial electron motion is maintained in equilibrium or compressed by the
    input electromagnetic zero-point energy; since the zero-point energy supply rate is limited, there
    is a finite energy-extraction rate, upon exceeding which (likely at EV contact with metal) the EV
    explodes, releasing its energy in a radiation band — for 1 um spheroids apparently the soft X-ray
    region; the constant diameter of drilled holes in aluminum oxide suggests either a very-high-energy
    mechanism unaffected by the process or constant energy pumping, and Shoulders chooses the latter.'
