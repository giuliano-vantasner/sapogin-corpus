- id: SC-MO02-001
  type: physical
  facet: phenomenology
  priority: normal
  page: 4
  quote_ru: В этом случае должны образоваться две “атмосферы” − внутренняя и внешняя, каждая со своей
    высотой.
  statement_en: 'The author argues that charging a thin-walled metal sphere must create two charge "atmospheres"
    — internal and external — each with its own height depending on temperature, surface curvature radius
    and the imparted charge (isotropy principle of Coulomb-force directions); analogous atmospheres form
    on a flat isolated plate; experiments with a "tunneling" microscope are reinterpreted: current arises
    when the excess-charge atmosphere on the tip (conical geometry) touches the opposite-sign charge atmosphere
    of the substrate, and the measured height of the external atmosphere on a tip lies in the range of
    several micrometers.'
  quantities:
  - 'высота внешней атмосферы: несколько мкм'
  equations: []
  materials: []
  geometry:
  - conical tip atmosphere
  procedure_steps: []
