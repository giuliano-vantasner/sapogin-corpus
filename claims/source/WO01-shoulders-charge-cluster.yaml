  quote_ru: 5. Любой элементарный объём электронов, если и может находиться в равновесии, то только под действием
    двух противоположно направленных сил. Одна из них  «сила притяжения к катоду», она же  кулоновская. А какая
    же вторая, компенсирующая кулоновскую?
  statement_en: 'Deeper consideration raises ''inconvenient'' questions: (1) the proposed picture fits electrons
    leaving the metal surface; (2) but who said they leave the metal? (3) and if electrons land on the cathode surface
    enveloping from all sides the surface of the conductor connecting the cathode to the current source — what then?
