  quote_ru: 'Основной экспериментальный закон электростатики гласит: если вы сообщили заряд гладкой металлической
    поверхности, то он распределится по поверхности очень тонким слоем с определённой поверхностной плотностью заряда.'
  statement_en: 'The basic experimental law of electrostatics states: if a charge is imparted to a smooth metal
    surface, it distributes over the surface in a very thin layer with a definite surface charge density; taking
    a smooth metal ball and charging it in any known way, the charge distributes in a thin layer and immediately
