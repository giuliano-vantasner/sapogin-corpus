  quote_ru: Лауэ не заметил, что решение задачи содержит фундаментальный закон сохранения.
  statement_en: Laue did not notice that the solution of the problem contains a fundamental conservation law; he
    did not check the dimension of the arbitrary constant; the arbitrary constant, as became clear 60 years after
    his studies, turned out to be the Hamilton function of the system describing the conservation law of the full
    pressure in the plane system; the full pressure consisted of the difference of the pressures of the field and
    the charges of the system; since he considered the pressure difference an arbitrary constant, he did not see
    the physical cause of the existence of three solutions and of the fact that the equations reduced to the canonical
    form after Hamilton; the cause of the existence of three solutions is three kinds of distributions of like charges
    in the collective field — positive full pressure, zero pressure, and negative full pressure; from the unnoticed
    conservation law followed the answer to the question by what forces the like-charge gas is held near the plane
    of zero field pressure; 60 years later it became clear that these forces are compensated by the retaining force
    of D. Bernoulli discovered in 1738.
