- id: SC-WO01-018
  type: physical
  facet: theory
  priority: core
  page: 6
  quote_ru: Электроны не выходят из катода в вакуум, как это принято считать в разработанных теоретических моделях,
    а транспортируются из источника тока по поверхности подводящих проводов, образуя у катода (или у всей отрицательно
    заряженной пластины конденсатора) плёнку пространственного заряда конечной толщины.
  statement_en: 'Such a force distribution creates on the surface of a cylindrical conductor a peculiar ''fur coat''
    of electrons forming a channel of charge transport from one ball to the other; the same happens in the vacuum
    diode and when charging any capacitor: electrons do not leave the cathode into vacuum as accepted in the developed
    theoretical models, but are transported from the current source along the surface of the connecting wires, forming
    at the cathode (or at the whole negatively charged capacitor plate) a space-charge film of finite thickness;
    the charges arriving from the current source have an insignificant influence on the distribution of free charges
    inside the metal conductor.'
