- id: SC-WO01-037
  type: physics
  facet: theory
  priority: normal
  page: 11
  quote_ru: То есть, одному и тому же уравнению могут удовлетворять бесконечное количество решений.
  statement_en: 'There is another ''defect'' in the exact science of mathematics discovered in solving ordinary
    differential equations: some classes of equations give several analytical solutions at once (mathematicians
    call it the complete set); the complete set of solutions can be obtained only knowing the algorithm of solving
    such equations; with another algorithm one obtains solutions that also satisfy the same differential equation
    but are no longer part of that complete set; i.e. infinitely many solutions can satisfy one and the same equation,
    all differing from each other by boundary or initial conditions; mathematics cannot suggest which of the obtained
    solutions is realized in Nature; the researcher is given only the right to choose from the obtained set that
    unique physical solution which will coincide with experiment if it is carried out.'
