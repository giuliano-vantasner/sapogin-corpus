  quote_ru: Этот разный знак в дивергенции рассматриваемых полей и отличал самосогласованные поля, создаваемые гравитирующими
    частицами (междучастичное взаимодействие – ньютоновское) от полей, создаваемых одноимёнными зарядами (междучастичное
    взаимодействие – кулоновское).
  statement_en: Almost 30 years after Laue's work, in 1948 Ya. Frenkel, in the monograph [9], continuing the pioneering
    studies of A. Vlasov [10], obtained systems of equations describing the static self-consistent equilibrium of
    both gravitating particles and like charges; the final equations for the potential differed only in sign; this
    different sign in the divergence of the fields distinguished the self-consistent fields created by gravitating
    particles (Newtonian interparticle interaction) from the fields created by like charges (Coulomb interaction);
    in the case of gravitating particles one system passed into the guessed equation of R. Emden, and in the case
    of like charges the other system passed into the guessed equation of M. Laue; Frenkel possibly knew nothing
    of the works of Emden and Laue since he did not refer to them.
