  type: physics
  facet: theory
  priority: normal
  page: 12
  quote_ru: Решая это уравнение, описывающее распределение массовой плотности вещества в газовом шаре с постоянной
    температурой, Эмден не нашёл ни точного, ни приближённого аналитических решений, которые бы удовлетворяли граничному
    условию существования максимума плотности вещества в центре шара.
  statement_en: The history of building theories of the cluster state of substance goes back a hundred years; the
    first to pave the way was the Swiss geophysicist R. Emden whose monograph 'Gas balls' was published in Munich
    in 1907; in it he generalized the results obtained by Lane, Ritter, Kelvin, and arrived at a new nonlinear second-order
    ordinary differential equation now bearing his name — the E-Emden equation (its structure Emden guessed); solving
    this equation describing the distribution of mass density of substance in a gas ball with constant temperature,
    Emden found neither exact nor approximate analytical solutions satisfying the boundary condition of the existence
    of a density maximum at the center of the ball.
