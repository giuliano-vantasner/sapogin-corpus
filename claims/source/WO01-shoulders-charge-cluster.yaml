  quote_ru: 'Вывод: приводимые аргументы говорят о том, что слоя электронов возле поверхности катода быть не может!'
  statement_en: 'Conclusion from the classical arguments: an electron layer near the cathode surface cannot exist!
    But experimental studies of the thermoelectron gas near the cathode surface assert exactly the opposite: (1)
    the electron gas can be in an equilibrium state when the current between cathode and anode is absent; (2) the
    electron gas occupies a bounded region of space which has its own thickness with a sharp boundary (thickness
    of the thermoelectron cloud); (3) in this equilibrium state the Coulomb repulsion of like charges is compensated
    by something.'
