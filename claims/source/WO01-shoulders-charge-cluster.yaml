  quote_ru: Было понятно, что в водородной плазме образуются электронные и протонные зарядовые кластеры со средним
    зарядом 30 мкКл. Каждый кластер содержал около 1014 электронов или протонов.
  statement_en: It was clear that electron and proton charge clusters with a mean charge of 30 μC form in the hydrogen
    plasma; each cluster contained about 10¹⁴ electrons or protons — three orders more than Shoulders'; the plasma
    heated because these clusters either arose in the plasma or decayed; i.e. in the installation there was not
    the 'cold nuclear fusion' of Fleischmann and Pons but a 'synthesis/decay of charge clusters of two signs' with
    a large release of energy; an anomalous Joule-Lenz effect arose leading to a coefficient of conversion of electric
    energy into thermal energy greater than 2; the process of 'synthesis/decay of CC' discovered at NPO Energomash
    is observed in the coronal plasma of the Sun; in the author's opinion this effect significantly increases its
    temperature compared with the temperature of the Sun's surface.
