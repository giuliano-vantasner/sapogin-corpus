  quote_ru: В заметке обсуждается физический аспект экспериментального открытия в 1987 году зарядового кластера
    Кена Шоулдерса и его влияние на процесс прорывного развития различных областей физических знаний.
  statement_en: 'The note discusses the physical aspect of the 1987 experimental discovery of Ken Shoulders'' charge
    cluster and its influence on the breakthrough development of various areas of physical knowledge: (1) technology
    of microscopic auto-electron cathodes for vacuum diodes, triodes, tetrodes and effective new-generation charge
    accumulators; (2) self-consistent theories explaining the causes of field retention of like charges and the
    distribution of their physical quantities in the cluster; (3) research of a new class of cluster reactions arising
    in the interaction of charge clusters with the metal crystal lattice; (4) effects of charge retention on a conductor
    surface in high-voltage electrophysics.'
