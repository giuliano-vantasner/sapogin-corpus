  page: 20
  quote_ru: 'Оно имеет максимум на расстоянии минимума потенциальной энергии системы, и очень похоже на распределение
    частиц в гравитационных ловушках, удерживаемых самосогласованным полем. Приводимые в работе оценки попадают
    в диапазон микроскопических геометрических размеров зарядового кластера, наблюдаемого в экспериментах Шоулдерса.
    Модель Сарфатти справедлива в случае, когда зарядовый кластер Шоулдерса изменяет внутри себя гравитационную
    постоянную на 20 порядков, формируя в своих пределах «экзотическую Вселенную». Она и компенсирует кулоновское
    взаимодействие зарядов кластера. Уважаемый читатель! Так что получается? Любой зарядовый кластер, образованный
    у поверхности проводника при протекании любого тока, тоже изменяет гравитационную постоянную на 20 порядков
    в области своего существования? Смелая математическая гипотеза, но верится с трудом! Вижу и другой недостаток
    предложенной теории, не замеченный авторами. А именно: усиление гравитационных эффектов за счёт увеличения G
    на двадцать порядков сохраняет у квантовой ловушки общие гравитационные свойства. Они проявляются в том, что
    во внешней атмосфере концентрация зарядов-частиц может только убывать с ростом радиуса, и она  диффузная. Других
    атмосфер у экзотических кластеров нет. В экспериментах Шоулдерса наблюдается способность зарядового кластера
    «взламывать и сверлить» кристаллическую решётку за счет большой концентрации зарядов на внешней поверхности.
    А этому факту противоречит теория Сарфатти. Её объект очень похож на зарядовый кластер, в котором концентрация
    зарядов-частиц убывает с ростом радиуса. Таким образом, «экзотический» кластер является виртуальным объектом,
    который не может быть образован в нашей Вселенной. В теории коллективного взаимодействия зарядов фундаментальные
    физические постоянные изменять не нужно.'
  statement_en: 'There exists a crafty qualitative explanation of the effect of electron retention near a heated
    cathode, connected with the appearance of ''image'' forces: any electron leaving the metal surface charges it
    positively, a positive ''image charge'' appears in the metal; the more electrons leave the cathode, the greater
    the positive ''image charge''; the thermoelectron is considered to interact with the ''image charge'' by Coulomb''s
    law analogously to two point charges, which makes it understandable why thermoelectrons can return to the cathode
    and form a cloud of finite thickness.'
