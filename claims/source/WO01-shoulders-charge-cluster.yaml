  priority: core
  page: 7
  quote_ru: После открытия зарядового кластера понятно, что можно построить ещё одну модель ядра – кластерную.
  statement_en: 'Physics has known for more than a hundred years the smallest, autonomous, and very stable charge
    clusters in nature — atomic nuclei; any nucleus contains various numbers of protons and neutrons; geometric
    sizes of nuclei are of the order of a fermi; the charges composing the nuclei of all atoms are usually in stable
    equilibrium; nuclear scientists explain that the Coulomb interaction arising between the charges of the nucleus
    is always compensated by ''nuclear forces''; several approaches to explaining various properties of nuclear
    matter exist: Frenkel''s droplet model of the nucleus, the Ivanenko-Tamm-Heisenberg exchange-interaction theory
    for the proton-neutron model; after the discovery of the charge cluster it is clear that one more model of the
    nucleus can be built — the cluster model, in which the charges of the nucleus represent an electron-proton plasma
    of extremely high density and temperature, with the nucleus in equilibrium held by the same powerful universal
    forces that hold the charge cluster; the model would allow obtaining the laws of charge distribution and internal
    electric fields of nuclear clusters still unknown to anyone.'
