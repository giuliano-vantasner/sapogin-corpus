  quote_ru: Вариант 2. Любые избыточные заряды, поступающие в проводник, начинают взаимодействовать друг с другом
    по закону Кулона и отталкиваются.
  statement_en: 'When the balls are connected by a metal conductor the electrons pass from one ball to the other
    until the potentials equalize; two variants of charge transfer are possible: (1) contracting forces act on the
    charges inside the conductor turning it into a cord, because the currents arising in the conductor are co-directed
    (current pinch) and the contracting Ampere forces dominate over the Coulomb ones; (2) any excess charges entering
    the conductor begin to interact by Coulomb''s law and repel, which makes them exit to the outer lateral surface
    of the conductor and form a charge cluster of finite thickness, which can no longer detach from the conductor
    surface thanks to the action of an unknown force retaining the charge layer in electrostatics.'
