  quote_ru: Независимую трактовку невозможности существования такой системы зарядов даёт известная в электростатике
    теорема Ирншоу.
  statement_en: 'By today''s knowledge a gas of like charges cannot occupy a bounded volume in space because the
    charges have the same sign; like charges must interact by Coulomb''s law; this interaction leads to the charges
    scattering in a very short time so they cannot form a volume bounded in space; an independent treatment of the
    impossibility of such a charge system is given by the Earnshaw theorem known in electrostatics: a system of
    resting charges located at any distances from each other cannot be in a state of stable equilibrium if only
    Coulomb forces act on the charges.'
