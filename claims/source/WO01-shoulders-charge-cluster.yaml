  quote_ru: Такие заряженные частицы назовём «экзотическими», поскольку они не будут ни притягиваться друг к другу,
    ни отталкиваться друг от друга, находясь на произвольном расстоянии.
  statement_en: 'A beautiful explanation later appeared: do ''exotic'' gravitational forces arising in the interaction
    between two point charges help retain the cluster? Taking two point charges with charge Q and mass M at some
    distance and computing the resultant force: if the Coulomb and Newtonian forces on an individual charge are
    compensated, such a state is realized at an arbitrary distance if a definite relation between the charge and
    mass holds, easily found from the equality of forces Q/M = sqrt(4πε₀G) = 8.6·10⁻¹¹ C/kg (G gravitational constant,
    ε₀ electric constant, taken for our Universe); such charged particles can be called ''exotic'' since they neither
    attract nor repel each other at arbitrary distance; filling an arbitrary sphere with such particles, they would
    ''live'' in the cluster in equilibrium with each other, and the external observer would record a Shoulders charge
    cluster consisting of ''exotic'' particles-charges; thus the physical causes of the retention of like charges
    become clear.'
