- id: SC-WO01-049
  type: physics
  facet: theory
  priority: core
  page: 14
  quote_ru: 'пределения зарядов, не входившие в полный набор решений, как у Лауэ. Не сделав оценок возникающих масштабов
    физических величин, он также объявил, что полученные формулы описывают газ термоэлектронов. Френкель решил уравнение
    для сферического гравитационного шара, получил решение для концентрации частиц с особенностью в начале координат,
    и не смог дать понятной физической интерпретации этого решения. К сожалению, работ Френкеля в современной учебной
    литературе по электронике найти не удаётся. И они неизвестны широкому читателю, получающему образование по электронике
    в России. Прошло 40 лет, и все работы первооткрывателей канули в Небытие. Ничего не зная о перечисленных выше
    работах, я пришёл к тем же уравнениям, применил к ним требуемый алгоритм, и за 10 лет подготовил монографию
    «Механизмы удержания вещества самосогласованным полем» [11], опубликовав около 15-и работ в региональных журналах.
    В монографии [11] было обнаружено неизвестное ранее свойство самосогласованных полей «давить» на вещество кластера,
    состоящего из гравитирующих частиц или одноимённых зарядов. Ведь в исследуемых системах нет ничего, кроме частиц
    вещества и создаваемых ими самосогласованных полей. Самосогласованное поле, создаваемое зарядами (частицами),
    оказывает на них обратное действие. Этим оно отличается от обычных полей, генерируемых либо отдельными зарядами,
    либо частицами. Силы, удерживающие систему частиц с ньютоновским взаимодействием, либо систему зарядов с кулоновским
    взаимодействием, связаны с одной и той же физической величиной – градиентом давления поля, – но имеют разные
    знаки. В опубликованных работах было показано, что система коллективного взаимодействия зарядов находится в
    состоянии газостатического равновесия с самосогласованным полем в том случае, когда равенство градиентов давления
    поля и зарядов выполняется в любом элементарном объёме системы. Градиент давления поля обычно огромен, и действует
    на массовую плотность либо зарядов, либо гравитирующих частиц так же, как сила Д. Бернулли. Результаты проделанной
    работы позволили:  выяснить причины временного удержания одноимённых зарядов в кластере К. Шоулдерса;  теоретически
    подтвердить возможность его существования в природе;  рассчитать распределения физических параметров и геометрические
    размеры полого зарядового кластера любой температуры;'
  statement_en: 'The results also allowed: approaching, in the phenomena of experimental electrostatics, the understanding
    of the nature of the volume forces retaining like charges at the surfaces of metals with a definite geometry;
    proposing an elementary theory of the operation of a gradient injector of an auto-emission cathode with angular
    aperture supplying charge clusters to an accumulator; investigating various mechanisms of charge-cluster formation
    usable for creating either super-efficient charge accumulation devices or high-voltage varicaps; comparing the
    theory with Shoulders'' experiments and finding their similarity in many parameters; discussing possible directions
    of research of microscopic injectors for creating new-generation highly efficient auto-emission cathodes usable
    for creating autonomous DC sources operating on the physical principle of converting a temperature gradient
    into an electromotive force; searching for experimental methods of generating charge clusters carrying microcoulomb
    charge with high binding energy.'
