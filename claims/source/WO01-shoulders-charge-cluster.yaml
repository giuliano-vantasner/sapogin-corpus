  priority: core
  page: 4
  quote_ru: Тот шарик, на котором скапливаются электроны, при таком напряжении начинает светиться в темноте.
  statement_en: 'An interesting observation can be made experimenting with a school electrostatic (Wimshurst) machine
    in darkness: the machine separates opposite-sign charges through brushes of rotating disks and imparts them
    to two metal balls; when the balls are far apart they can be charged to about 25 kV; the ball on which electrons
    accumulate begins to glow in the dark at that voltage; even with the naked eye a thin glowing layer of charges
    is visible, its thickness greater than the mean free path of air molecules (micrometers and tens of micrometers);
    the electrons forming the ''atmosphere'' at the negatively charged electrode excite oxygen molecules and atoms
    by inelastic impact, and the excited atoms radiate the energy of this interaction; the glow exists as long as
    the wheels of the machine rotate.'
