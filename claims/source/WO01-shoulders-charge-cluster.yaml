  quote_ru: Так же, как и Р. Эмден, он угадал основное уравнение, описывающее равновесное состояние взаимодействующих
    одноимённых зарядов.
  statement_en: 'The pioneer of theoretical research of charge clusters should be considered the Nobel laureate
    M. Laue; four years after receiving the prize he published an article ''Thermoelectrons'' in the Jahrbuch der
    Radioaktivitat und Elektronik; just like R. Emden he guessed the basic equation describing the equilibrium state
    of interacting like charges: he took the Poisson equation for the divergence of the space charge of one sign,
    in which he assumed this divergence defined by the Boltzmann distribution function having an exponential dependence
    on the potential of the system charges; the charge system was considered at constant temperature; in the plane
