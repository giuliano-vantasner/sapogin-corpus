  quote_ru: Скопления зарядов (зарядовые кластеры), наблюдаемые Шоулдерсом, имеют малые размеры (от долей до десятков
    микрометров), большой отрицательный заряд (от 108 до 1011 электронов в скоплении) и время высвечивания от 30
    до 100 пс, которое превышает время возможного разлета зарядов за счёт кулоновского расталкивания.
  statement_en: The charge clusters observed by Shoulders have small sizes (from fractions to tens of micrometers),
    a large negative charge (from 10^8 to 10^11 electrons in a cluster), and a flash-out (decay) time of 30 to 100
    ps, which exceeds the time of possible charge dispersal due to Coulomb repulsion.
  quantities:
