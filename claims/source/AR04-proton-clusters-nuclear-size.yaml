  quote_ru: Автономные скопления зарядов были обнаружены Шоулдерсом (США, Бодега, 1987) у поверхности острийного
    катода в вакууме, получили название “Electrum Validum” (EV) и были применены в технологии обработки металлических
    поверхностей [1].
  statement_en: Autonomous accumulations of like charges were discovered by Shoulders (USA, Bodega, 1987) at the
    surface of a sharp (point) cathode in vacuum, were named 'Electrum Validum' (EV), and were applied in metal-surface-processing
    technology.
