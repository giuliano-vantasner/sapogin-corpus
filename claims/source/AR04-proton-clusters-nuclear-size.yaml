  quote_ru: В эти же годы Флейшман и Понс зафиксировали избыточное тепло при электролизе тяжёлой воды. Объяснить
    причины выделения тепла в этих экспериментах можно было существованием нового класса ядерных реакций, протекающих
    без появления нейтронов (явление было названо холодный ядерный синтез, ХЯС, [2]).
