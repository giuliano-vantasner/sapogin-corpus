  quote_ru: Уравнение (15) относится к классу модифицированного E – уравнения Эмдена [9]. Его столетнее исследование
    показало, что оно не имеет точных аналитических решений в элементарных функциях.
  statement_en: In spherical symmetry equation (9) takes the form x·y″ + 2y′ = ±α²·x·exp(±2y) with y(x) = ±φ(r)/φ*,
    x = r/R, and state parameter α² = R²/l² = T*/T, characteristic temperature T* = 4πe²n₀R²/k; this equation belongs
    to the class of the modified Emden equation, whose century-long study has shown that it has no exact analytical
    solutions in elementary functions.
