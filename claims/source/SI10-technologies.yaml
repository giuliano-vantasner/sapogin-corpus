  page: § Неисчерпаемые Источники Электричества – Блеф или Прорывные Технологии?
  quote_ru: Если в плазме возникает область, у которой температура в центре ниже, чем на периферии, то электроны перемещаются к холодному центру, и образуют сжимающийся ЭДП. Если в локальной области температура
    больше, чем на периферии, то электроны уходят от центра и образуют расширяющийся ЭДП.
  statement_en: Sapogin asserts a plasma region cooler at the centre than the periphery drives electrons to the cold centre forming a compressing EDP, while a locally hotter region drives electrons from
    the centre forming an expanding EDP.
