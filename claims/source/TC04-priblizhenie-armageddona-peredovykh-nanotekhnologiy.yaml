  quote_ru: Приближающийся «Армагеддон» нано-технологий поможет решить проблему создания устройств, работающих на
    кольцевых токах Ампера-Фуко, имеющих радиусы 0,1 нм и меньше. На них можно реализовать суб-нано компьютеры и
