  type: physical
  facet: theory
  priority: core
  page: 3
  quote_ru: Токи таких радиусов не выделяют никакой тепловой энергии. Электроны, двигаясь по кольцу, перестают сталкиваться
    с положительными ионами проводника, находящимися в тепловом движении. Они вращаются как электроны атома в пустом
    пространстве. Время жизни кольцевых токов больше 100 лет (а может быть и вечность!).
  statement_en: 'Ring currents of such radii release no thermal energy: electrons moving along the ring stop colliding
    with the positive ions of the conductor in thermal motion and rotate like atomic electrons in empty space; the
    lifetime of ring currents exceeds 100 years (perhaps eternity).'
