  quote_ru: система уравнений в плоском случае имеет полный набор решений, состоящий из 4-х четных функций. Решения
    базируются на интеграле полного давления, состоящего из давления токов и давления электрического поля, взаимодействующих
    между собой. Три из них описывают скин-эффект (выталкивание тока на поверхность), а четвёртое – эффект сжатия
    токового слоя, который также может происходить на высоких частотах.
  statement_en: The system of Maxwell equations supplemented by Ohm's law has, in the plane case, a complete set
    of solutions of 4 even functions based on the integral of total pressure (pressure of currents and pressure
    of the electric field); three describe the skin effect, the fourth describes the compression of the current
    layer, also possible at high frequencies.
