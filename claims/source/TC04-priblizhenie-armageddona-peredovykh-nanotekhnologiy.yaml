- id: SC-TC04-003
  type: physical
  facet: phenomenology
  priority: core
  page: 1
  quote_ru: Электроны, вышедшие на поверхность проводника, не выбрасываются наружу действием силы Кулона, а образуют
    зарядовый кластер внешней оболочки с очень тонкой стенкой. Кластер одноимённых зарядов удерживается в стенке
    давлением собственного электрического поля так же, как давление магнитного поля удерживает горячую плазму при
    термоядерном синтезе.
  statement_en: Electrons emerging onto the conductor surface are not ejected by the Coulomb force but form a charge
    cluster of the outer shell with a very thin wall; the cluster of like charges is held in the wall by the pressure
    of its own electric field just as magnetic-field pressure holds hot plasma in thermonuclear fusion.
