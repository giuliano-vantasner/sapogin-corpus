- id: SC-TC04-021
  type: physics
  facet: theory
  priority: core
  page: 4
  quote_ru: ВС может быть только у кольцевых токов. Для прямолинейных токов ВС тоже будет, но только при сверхнизких
    температурах и на малых длинах. А у кольцевых токов сверхпроводимость будет сохраняться даже при температуре
    плавления металла!
  statement_en: High-temperature superconductivity (ВС) can exist only in ring currents; for straight currents it
    will also exist but only at ultra-low temperatures and short lengths, while ring currents retain superconductivity
    even at the melting temperature of the metal; ring currents open a new area of engineering-physical research
    — high-temperature superconductivity of the conductor.
