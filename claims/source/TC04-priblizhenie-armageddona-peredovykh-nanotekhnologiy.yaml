- id: SC-TC04-005
  type: physical
  facet: theory
  priority: core
  page: 1
  quote_ru: Любой ток, текущий в металле, представляет собой поток заряженных частиц одного знака, приходящих из
    источника. С одной стороны, между ними действует сила Кулона. С другой стороны, токи одного направления притягиваются
    друг к другу силой Ампера.
  statement_en: Any current flowing in a metal is a flux of like-sign charged particles coming from the source;
    Coulomb force acts between them, while currents of the same direction attract each other by the Ampere force;
    moving charges also interact with the crystal-lattice fields and their own field, and the interaction must depend
    essentially on the amplitude and frequency of the current, the wire diameter, and its resistivity.
  quantities: []
  equations: []
