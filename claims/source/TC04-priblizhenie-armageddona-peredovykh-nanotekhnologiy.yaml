  quote_ru: Проводник может взрываться и при отсутствии p-n перехода. Это явление недавно было проверено экспериментально
    профессором М.Марахтановым
  statement_en: 'The conductor can explode even without a p-n junction; this phenomenon was recently verified experimentally
    by professor M. Marakhtanov: current was passed through metal films of several hundred atomic layers, the cooled
    metal temperature was fixed at 180 °C, and at current densities above 1.43·10^9 A/m² in tungsten and 8.04·10^9
    A/m² in aluminum the conductors exploded within microseconds.'
  quantities:
