- id: SC-TC04-017
  type: physics
  facet: theory
  priority: core
  page: 3
  quote_ru: В проводнике переменным магнитным полем можно возбуждать кольцевые токи Ампера-Фуко (физические следствия
    решений уравнений Максвелла-Ома для азимутальной компоненты тока в проводящей плёнке подтверждают эксперименты).
    Их радиусы могут быть на порядок меньше 1 нм.
  statement_en: 'A real possibility appears of moving technologies into the sub-nano region of the conductor: an
    alternating magnetic field can excite Ampere-Foucault ring currents in the conductor (physical consequences
    of Maxwell-Ohm solutions for the azimuthal current component in a conducting film are confirmed by experiments);
    their radii can be an order of magnitude less than 1 nm.'
