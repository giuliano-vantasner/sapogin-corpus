    где заряд покоится, обладает свойством вырождения, характерным для плоского волнового процесса, фазовая скорость
    которого меньше скорости света в вакууме
  statement_en: 'The second canonical form of the action of a free charged material point, Sp = pt − γx (65), transformed
    to the frame moving with the charge-particle gives S′p = −x′ (66): in the frame where the charge is at rest
    it possesses the degeneracy property characteristic of a plane wave process whose phase velocity is less than
    the speed of light in vacuum, Ω/K = p/γ = u (67); in this frame ω′ = 0 and the action depends only on the coordinate.'
  quantities:
