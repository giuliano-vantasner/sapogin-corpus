- id: SC-AR01-074
  type: experimental
  facet: phenomenology
  priority: normal
  page: 18
  quote_ru: 13.Модель частицы-заряда в виде малого локализованного возмущения функции действия находит многолетнее
    экспериментальное подтверждение в известном явлении распада свободного нейтрона. В момент освобождения нейтрона
    из ядра электрон прижимается к протону силой около 300 Н. И кажется, что электрон никогда не сможет выбраться
    из потенциальной ямы глубиной 1,44 Мэв. Освобождает электрон непрерывное дрожание его струны, которое приводит
    к осцилляции его заряда [20,21]. Дрожание увеличивает полную энергию электрона до тех пор, пока электрическое
    взаимодействие электрона с протоном не прекращается, и электрон становится свободным.
  statement_en: 'The model of the charge-particle as a small localized perturbation of the action function finds
    long-term experimental confirmation in the known phenomenon of free neutron decay: at the moment of liberation
    of the neutron from the nucleus, the electron is pressed to the proton by a force of about 300 N, and it seems
    the electron could never escape the potential well 1.44 MeV deep; what liberates the electron is the continuous
    trembling of its string, which leads to oscillation of its charge — the trembling increases the total energy
    of the electron until the electric interaction of the electron with the proton ceases and the electron becomes
    free.'
  quantities:
  - 'force pressing electron to proton: ~300 N'
  - 'potential well depth: 1.44 MeV (as printed: ''Мэв'')'
