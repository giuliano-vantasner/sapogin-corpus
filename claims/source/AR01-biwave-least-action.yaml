  type: physics
  facet: theory
  priority: normal
  page: 4
  quote_ru: Как будет показано ниже, эта симметрия оказывается связанной с существованием канонической формы релятивистского
    действия заряженной частицы в произвольном электромагнитном поле векторного и скалярного потенциалов. Из них
    следуют два возможных способа канонического описания релятивистского движения заряженной материальной точки,
    соответствующие двум интегралам движения полной энергии (9) и полного импульса (11).
  statement_en: 'This symmetry is connected with the existence of a canonical form of the relativistic action of
    a charged particle in an arbitrary electromagnetic field of vector and scalar potentials; from it follow two
    possible methods of canonical description of the relativistic motion of a charged material point, corresponding
    to the two integrals of motion: full energy (9) and full momentum (11).'
