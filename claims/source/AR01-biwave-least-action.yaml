  page: 5
  quote_ru: Такое представление позволяет окончательно уточнить явление корпускулярно-волнового дуализма, открытого
    в физике в начале прошлого века, которое в этом случае переходит в явление корпускулярно-биволнового дуализма.
    То есть, при движении любой массовой частицы-заряда возникает не один плоский волновой процесс, как считалось
    ранее, а два. Каждый из них имеет свои пространственные и временные масштабы, зависящие от скорости его движения.
    Масштабы будут различны в разных инерциальных системах отсчёта.
  statement_en: 'This representation finally refines the corpuscular-wave dualism (discovered at the beginning of
    the last century) into a corpuscular-bi-wave dualism: during motion of any massive charge-particle there arise
    not one plane wave process, as previously believed, but two, each with its own spatial and temporal scales depending
    on the velocity of motion; the scales differ in different inertial reference frames.'
  quantities: []
  equations: []
  materials: []
  geometry: []
