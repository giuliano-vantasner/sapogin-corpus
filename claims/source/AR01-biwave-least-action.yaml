  quote_ru: При   kc (фазовая скорость плоской волны больше скорости света в вакууме) она вырождается и зависит
    только от времени в системе отсчёта K 2 , имеющей постоянную скорость V  kc2 /  . Обе системы отсчёта перемещаются
    вдоль направления распространения волны. Если же рассматривается электромагнитная волна с   kc , то систем
    отсчёта, в которых возможно вырождение фазы плоской волны не существует.
  statement_en: When ω > kc (phase velocity of the plane wave greater than the speed of light in vacuum) the phase
    degenerates and depends only on time in the frame K2 moving with constant velocity V = kc²/ω; both frames move
