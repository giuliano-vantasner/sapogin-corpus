- id: SC-AR01-020
  type: experimental
  facet: phenomenology
  priority: normal
  page: 4
  quote_ru: Точность существующих экспериментальных данных, служащих основанием волновой теории материи [11], не
    позволило в начале прошлого века выявить влияние второй волны действия на дифракцию нерелятивистских электронов.
    Причина этого заключалась в том, что длины волн, участвующие в дифракции электронов, отличаются друг от друга
    на несколько порядков, и влияние второй волны действия на дифракцию практически не проявляется.
  statement_en: The precision of the existing experimental data underlying the wave theory of matter did not allow,
    at the beginning of the last century, detection of the influence of the second action wave on diffraction of
    nonrelativistic electrons; the wavelengths participating in electron diffraction differ from each other by several
    orders of magnitude, so the influence of the second action wave on diffraction practically does not manifest
    itself.
  quantities: []
