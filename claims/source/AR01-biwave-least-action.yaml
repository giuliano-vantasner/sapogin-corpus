  quote_ru: Одна из них совпадает с де Бройлевской волной материи [10]
  statement_en: 'Two plane action waves are associated with the moving charge: the first coincides with the de Broglie
    matter wave, with ω = 2πE/h and k = 2πp/h (relations (12) in ordinary units), and the parameters of the second
    are expressed through the energy E and momentum p of the charge as K = 2πE/(hc), Ω = 2πpc/h (13); as seen from
    (13), its wavelength coincides with the Compton wavelength at small particle velocities — a parameter inherent
    to the electron that was discovered in Compton''s experiments on scattering of gamma quanta on electrons at
    rest.'
  quantities: []
  equations:
  - \omega = 2\pi E/h,\ k = 2\pi p/h
  - K = 2\pi E/(hc),\ \Omega = 2\pi pc/h
