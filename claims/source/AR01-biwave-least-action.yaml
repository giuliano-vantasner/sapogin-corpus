  quote_ru: В работах [1-4] было отмечено, что если плоская электромагнитная волна распространяется с фазовой скоростью,
    не равной скорости света в вакууме, то при   kc (фазовая скорость волны меньше скорости света в вакууме) существует
    выделенная инерциальная система отсчёта K1 , движущаяся с постоянной скоростью V   / k , в которой фаза волны
    вырождается и зависит только от координаты.
  statement_en: 'For a plane electromagnetic wave propagating with phase velocity different from the speed of light
    in vacuum: when ω < kc (phase velocity less than c) there exists a distinguished inertial frame K1, moving with
    constant velocity V = ω/k, in which the wave phase degenerates and depends only on the coordinate.'
