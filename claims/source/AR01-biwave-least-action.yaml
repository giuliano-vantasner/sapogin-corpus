  quote_ru: В 1983 году появилась работа Г.Сивашинского [12], которая была получена журналом Nuova Cimento 13 июля
    1982 года. В ней он предложил модифицированное уравнение Гамильтона-Якоби и оригинальную интерпретацию заряженной
    частицы как малого возмущения функции действия, локализованного в пространстве в размерах комптоновской длины
    волны.
  statement_en: In 1983 G. Sivashinsky's work [12] appeared (received by Nuovo Cimento on 13 July 1982), in which
    he proposed a modified Hamilton-Jacobi equation and an original interpretation of the charged particle as a
    small perturbation of the action function, localized in space within the Compton wavelength.
