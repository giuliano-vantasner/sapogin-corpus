  quote_ru: Интеграл содержит в себе две плоские волны действия, связанные с движущейся частицей-зарядом. Одна из
    них совпадает с де Бройлевской волной (временная волна действия), имеющей фазовую скорость больше скорости света.
    Другая плоская волна (координатная волна действия) движется с фазовой скоростью меньше скорости света.
  statement_en: 'The complete integral contains two plane action waves associated with the moving charge-particle:
    one coincides with the de Broglie wave (the temporal action wave), whose phase velocity is greater than the
    speed of light; the other plane wave (the coordinate action wave) moves with a phase velocity smaller than the
    speed of light.'
