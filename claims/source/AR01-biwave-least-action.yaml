    Он заметил, что структура инварианта не изменяется, если время принять за координату, а энергию, взятую с противоположным
    знаком, – за импульс. Тогда роль гамильтоновой функции играет несохраняющаяся величина – компонента кинетического
    импульса частицы, взятая с противоположным знаком. Роль независимой переменной переходит к сопряжённой пространственной
    координате.
  statement_en: 'Gantmakher [14] discovered the symmetry of time and coordinate in the Poincare-Cartan integral
    invariant: the structure of the invariant does not change if time is taken as a coordinate and the energy, taken
    with the opposite sign, as a momentum; then the role of the Hamilton function is played by a non-conserved quantity
    — a component of the kinetic momentum of the particle taken with the opposite sign — and the role of the independent
    variable passes to the conjugate spatial coordinate.'
