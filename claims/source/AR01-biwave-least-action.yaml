  quote_ru: Исследуются биволновые свойства принципа наименьшего действия, описывающего релятивистское движение
    свободной заряженной материальной точки. Они следуют из анализа движения частицы-заряда в статических и переменных
    полях скалярного и векторного потенциалов с высокой симметрией.
  statement_en: The bi-wave properties of the least-action principle describing the relativistic motion of a free
    charged material point follow from analysis of the motion of a charge-particle in static and variable fields
    of scalar and vector potentials with high symmetry.
