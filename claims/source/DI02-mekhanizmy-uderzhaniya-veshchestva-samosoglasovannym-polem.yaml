  quote_ru: фун- даментальный вклад был сделан Лэном, Риттером, Кельвином, Эмденом и Фаулером
  statement_en: The dissertation introduction credits Lane, Ritter, Kelvin, Emden and Fowler with the
    fundamental contribution to the gravitational-equilibrium problem whose solution methods were the
    first step toward a universal calculation method for static macroscopic self-consistent fields; the
    imposed density requirement (no increase from center to surface) restricted accepted configurations
    to those where the gravitational field vector and radius vector are opposite, with other solutions
    discarded as extraneous because their fields violate the Gauss theorem; the mathematical equilibrium
    condition does not reveal the physical retention cause, which chapter 7 ties to a compensating force
    connected with the field pressure gradient, equal to it in magnitude and direction; the thermoelectron
    equilibrium equation in spherical coordinates differs from the Emden E-equation only by the right-hand-side
    sign (attraction replaced by like-charge repulsion), and the image-charge potential does not enter
    the equation nor influence its solutions, leaving the retention condition and force nature unexplained
    in that approach.
