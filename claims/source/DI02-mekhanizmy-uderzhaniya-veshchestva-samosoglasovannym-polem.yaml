  statement_en: 'The conclusion lists further promising charge-cluster applications: straight-through
    microwave generators in which spreading bunched electron bunches are replaced by charge clusters —
    a new class of microwave devices with output power significantly exceeding modern klystrons, traveling-wave
    and backward-wave tubes; explosions of a non-radiated cluster can generate gamma quanta; the greatest
    effort should go to nonlinear interaction of charge clusters with the wall of a metal resonator where
    an image charge arises; the discovered elastic deformation of the excess-charge atmosphere thickness
    sensitive to temperature gradient allows microwave oscillation generators on a new physical principle
    — a vacuum diode in the no-current mode placed in a resonator tuned to the atmosphere-height oscillation
    frequency will generate oscillations whose frequency depends on the cathode temperature gradient and
    the external electric field, attractive for a new generation of micron-size solid-state vacuum electronics.'
