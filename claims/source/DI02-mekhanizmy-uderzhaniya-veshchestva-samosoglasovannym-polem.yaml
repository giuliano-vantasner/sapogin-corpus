  statement_en: The conclusion states that creating a theory of charge-cluster nucleation on a tip cathode
    is pending (per the Section 5 review, one possible cluster-formation mechanism is ecton appearance);
    it would replace the semi-intuitive Shoulders-patent experiments with generation devices having preset
    physical parameters (diameter, layer thickness, surface charge concentration, accumulated charge,
    lifetime); only this path should yield clusters with charges in the range 1e-6 to 1e-3 C, approaching
    the charge that ball lightning can store and hence real possibility of its artificial reproduction;
    cluster-generation technology could form new energy capsules with limited but controlled lifetime
    — ecologically clean engines on new physical principles (special conditions would force the cluster
    to explode before radiating at a fixed time after birth) — and also various kinds of non-lethal weapons
    using low-charge clusters causing short-term incapacitation.
