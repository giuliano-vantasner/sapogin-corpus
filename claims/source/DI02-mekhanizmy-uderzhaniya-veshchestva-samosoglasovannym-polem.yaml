  quote_ru: Как показывает моделирование процессов в эктоне для меди при энерговкладе эквивалентном 10
  statement_en: 'Ecton modeling for copper (dissertation Section 5 review): at energy input equivalent
    to 1e4 K the initial current density in the ecton is of order 1e8 A/cm2, and at 7e3 K only 5e6 A/cm2
    — cooling the ecton zone by 30% reduces the current density 20-fold; assuming an ecton lifetime of
    about 1e-8 s emerging from a crater of radius about 1e-4 cm, such an ecton contains charge of about
    16 nC, matching by order of magnitude the upper value of about 1e11 electrons recorded by Shoulders
    in charge accumulations at a tip cathode — an ecton can be an EV source.'
