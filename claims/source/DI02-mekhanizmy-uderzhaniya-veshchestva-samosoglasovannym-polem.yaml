  quote_ru: Введение понятия “поверхностный ток избыточных зарядов” позво- ляет предложить неквантовое
    объяснение известному явлению автоэлек
  statement_en: 'The conclusion introduces the "surface current of excess charges" enabling a non-quantum
    explanation of autoelectron emission: at room temperatures an excess-charge atmosphere always exists
    in the near-cathode region of a vacuum diode (fed by a small number of thermoelectrons plus charges
    from an external accelerating field); raising the cathode-anode voltage increases the atmosphere height
    via two factors — more excess charges maintain the arising displacement current, and the external
    electrostatic field elastically deforms the atmosphere height; at a threshold external-field strength
    the atmosphere height reaches the cathode-anode distance and the current must arise jump-wise at atmosphere-anode
    contact, whereas the quantum model of autoelectron emission has no threshold field values or current
    jumps.'
