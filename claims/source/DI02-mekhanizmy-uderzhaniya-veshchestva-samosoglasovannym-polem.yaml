  statement_en: 'The dissertation summarizes Vlasov''s collective-interaction theory as resting on two
    physical premises: (1) rejection of the principle of spatial and velocity localization of a particle
    (in the classical-mechanics sense) independent of force interactions; (2) introduction of force interactions
    by analogy with classical mechanics but accounting for the new non-localization principle; their mathematical
    realization leads to a system describing two particles interacting via central forces and electromagnetically.'
