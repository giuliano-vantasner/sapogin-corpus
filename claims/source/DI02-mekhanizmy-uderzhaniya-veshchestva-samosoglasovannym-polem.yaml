  statement_en: The dissertation shows that Frenkel's equation (4.5b) can be strictly derived from the
    Maxwell-Vlasov system for a gas of like-sign charges and currents (rot H - (1/c)dE/dt = (4*pi/c) j;
    rot E = -(1/c)dH/dt; div H = 0; div E = 4*pi*rho; the Vlasov kinetic equation), with current and charge
    densities expressed through the distribution function; the ensemble moves in a smoothed macroscopic
    field where the force on one charge is a smoothed averaged force independent of the concrete position
    of any other charge.
