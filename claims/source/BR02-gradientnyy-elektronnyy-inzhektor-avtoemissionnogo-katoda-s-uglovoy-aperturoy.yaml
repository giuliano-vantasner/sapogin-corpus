  quote_ru: система плоских электродов не может быть использована в качестве конструкции инжектора электронов.
  statement_en: 'The authors assert (conclusion 2) that a plane-electrode system cannot serve as an electron
    injector: the field pressure is uniform, the pressure gradient is zero everywhere between the plates,
    so it exerts no action on the electron coat, which collective forces hold at the cathode; a plane
    capacitor field is also technically unrealizable — any plate skew produces a pressure gradient that
    drives the electron coat across the field direction and discharges to the positive electrode over
    the dielectric surface (high-voltage breakdown of plane capacitors).'
