  quote_ru: Из изложенного выше ясно, что система зарядов и полей внутри зарядового кластера обладают
    сильной неоднородностью.
  statement_en: 'The authors assert that the charge and field system inside a charge cluster is strongly
    inhomogeneous at its boundary: on the outer and inner surfaces of a spherical cluster the electron
    concentration grows above the average concentration in a solid, which explains its unusual behavior
