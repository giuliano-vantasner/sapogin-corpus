  quote_ru: Такое же, двухсиловое, взаимодействие существует и при гравитационном взаимодействии протяжённых
    тел.
  statement_en: 'The authors extend the two-force interaction to gravitation: any extended volume of gravitating
    masses in an external gravitational field feels the gravitational force and a gasostatic force tied
