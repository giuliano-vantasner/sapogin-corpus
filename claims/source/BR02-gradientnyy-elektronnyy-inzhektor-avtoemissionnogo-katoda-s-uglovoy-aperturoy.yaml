  quote_ru: А в триоде Шоулдерса (см. рис.1) расстояние между острийным катодом и управляющим электродом
    было порядка микрометра.
  statement_en: 'The authors analyze the Shoulders triode: the tip cathode to control-electrode distance
    was of order a micrometer, making the external field strongly transversely inhomogeneous; the field
    both thickens the electron "coat" and produces a volume force density (field-pressure gradient) pushing
    the thin electron layer toward smaller collective-interaction forces; the control electrode plays
