  quote_ru: элементарный объём зарядов любого знака в кластере удерживается двумя противоположно направленными
    силами.
  statement_en: 'The authors assert that an elementary volume of charges of either sign in a cluster is
    held by two oppositely directed forces: the electric force directed along the field-strength vector
    (for positive charges) acting on the charge density, and a Bernoulli-like gasostatic force directed
    against the self-consistent field-pressure gradient acting on the mass density; these retention conditions
