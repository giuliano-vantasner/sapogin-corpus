- id: SC-BR02-016
  type: mathematical
  facet: theory
  priority: core
  page: 22
  quote_ru: О двух режимах вывода зарядов из инжектора
  statement_en: 'The authors derive two regimes of charge output from the aperture injector for a planar
    bunch of thickness d, width H, length R2-R1, cross-section S = Hd: (1) accelerated motion of an incompressible
    layer center of mass with scales a* = D*/(m*n0*R2), v* = E*sqrt(eps0/(m*n0)), tau* = 2*sqrt(m*n0/eps0)/E*,
    current-density scale j* = e*E**sqrt(eps0*n0/m), ohmic resistance R* = (theta*R1/(e*d*H))*sqrt(m/(n0*eps0))
    independent of voltage — a linear volt-ampere characteristic; (2) viscous motion with volume-reduced
    viscosity mu giving stationary speed v_c = (D*/(mu*R2))*(1+R1/R2), current-density scale j* = e*n0*D*/(mu*R2),
    resistance scale R* = 2*mu*R1*R2*theta/(e*eps0*n0*E**d*H) — a quadratic volt-ampere characteristic;
    the regimes differ by hundreds of times, indicating the Shoulders triode and Spindt cathode operated
    in different output regimes.'
  quantities:
  - a* = D*/(m·n0·R2)
  - v* = E*·√(ε0/mn0)
  - τ* = 2√(mn0/ε0)/E*
  - j* = eE*√(ε0n0/m)
  - 'режим 1: линейная ВАХ'
  - 'режим 2: квадратичная ВАХ'
  equations:
