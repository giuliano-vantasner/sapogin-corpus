    размеров является тот факт, что при
  statement_en: 'The authors assert that asymmetric cm- and mm-scale injectors possess valve (rectifying)
    properties at certain geometries: an applied alternating voltage tears the electron cushion off the
    injector only during the negative half-wave on the cathode (forming the electron coat for 20 ms and
    tearing it toward the target); during the positive half-wave the pressure gradient, which depends
    only on the square of the field strength and cannot change direction, presses the electrons to their
    electrode; nano-scale injectors lose the valve property since both electrodes sit permanently in a
    polarity-independent conducting electron cloud; the property enables air storage capacitors and a
    new class of powerful rectifying devices on vacuum triodes; the aperture injector itself lacks the
    valve property — polarity swap ejects the coat in the other direction, usable for charging two accumulators
    simultaneously.'
