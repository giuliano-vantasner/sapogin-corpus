  quote_ru: Таким образом, на весь слой в начальный момент времени действует поле ускорений, которое уменьшается
    обратно пропорционально кубу расстояния.
  statement_en: 'The authors describe charge-cluster formation: the acceleration field over the electron
    coat decreases as the inverse cube of distance, so elementary layers at different x gain different
    accelerations and velocities; the layer compresses and mixes (similar to bunch self-compression in
    klystrons), forming a spatially bounded charge cluster (ZK); under simplifying assumptions (a: edge-layer
    accelerations constant; b: uniform concentration growth) the cluster-formation time is estimated as
    t_3k = tau_3k*(1-R1/R2)/sqrt(1-R1^3/R2^3), and a density-transformation parameter beta = rho_k/rho_0
    > 1 of the injector is introduced.'
  quantities:
  - поле ускорений ~ 1/r3
  - β = ρk/ρ0 > 1
  equations:
  - t_{3k} = \tau_{3k}^*\,(1-R_1/R_2)/\sqrt{1-R_1^3/R_2^3}
  - \beta = \rho_k/\rho_0 > 1
