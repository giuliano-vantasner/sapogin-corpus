  quote_ru: На рис. 8 представлен схематично инжектор с угловой апертурой в полярных координатах
  statement_en: 'The proposed gradient electron injector with angular aperture: the cathode plate lies
    in the plane phi = 0 and the anode plate is symmetrically rotated by the aperture angle theta; distances
    from the z axis to the near parts of the plates are R1 and to the far parts R2; field lines are bounded
    circle arcs; the potential depends only on the angle and the approximate Laplace solution phi = C1*phi_angle
    + C2 gives a single field component E_phi decreasing as 1/r, with scales U* = U/theta, E* = U*/R1,
    U = E*R1*theta, D* = eps0*E*^2/2, G* = eps0*E*^2/R1 = 2D*/R1; the force f opposite the gradient pulls
    the electron coat toward increasing r where the drift space and electron accumulator should be placed.'
