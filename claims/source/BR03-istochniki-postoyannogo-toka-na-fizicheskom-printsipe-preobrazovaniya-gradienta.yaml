  quote_ru: В этом и заключается не­ квантовое объяснение
  statement_en: 'The authors propose a non-quantum explanation of auto(field) electron emission via the
    thermoelectron cloud: if the cloud film at the cathode is slightly thinner than the cathode-anode
    distance, a negative anode potential thins the film so the cloud charges never touch the anode and
    the diode current is zero (huge ohmic resistance); a positive anode potential grows the film until
    the thermoelectron gas reaches the anode, the resistance drops sharply and current flows.'
