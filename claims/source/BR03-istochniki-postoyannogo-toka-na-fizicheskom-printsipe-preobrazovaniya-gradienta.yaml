  statement_en: 'The authors derive for a gas of non-interacting charges in a temperature gradient: with
    Poisson equation div E = b*e*n, state equation p = nkT, and volume-force balance (Bernoulli pressure-gradient
    force against Coulomb repulsion), the concentration turns out constant (n = const) — the gas is unperturbed
