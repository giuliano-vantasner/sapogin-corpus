  quote_ru: Температура нагрева увеличивалась до определённого значения, которое назовём температурой Росси Tp.
    Она зависела от давления водорода и могла изменяться от 2000С до 5000С.
  statement_en: 'Qualitatively the phenomenon proceeded as follows: at the initial stage of the source operation
    there were two heat fluxes — one of power P1 heated the tube, the other of power P2 was thrown out of the source
    heating the environment; the heating temperature increased up to a definite value called the Rossi temperature
    Tp, which depended on the hydrogen pressure and could vary from 200°C to 500°C; at this temperature the heating
    element no longer needs the heat flux P1 and generates only the heat flux P2 which is thrown out of the source
    for a long time; at the Rossi temperature a thermal power balance arises in the system — the power thrown out
    of the thermal element coincides with the power absorbed by the cooling medium.'
