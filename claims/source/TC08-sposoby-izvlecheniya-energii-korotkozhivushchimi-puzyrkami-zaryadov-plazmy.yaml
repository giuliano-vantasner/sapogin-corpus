  quote_ru: 4. Автор работы высказывает мнение о том, что на микроскопическом уровне нагрев плазмы осуществляет
    ток смещения Максвелла, который генерируют короткоживущие пузырьки зарядов на остриях опилок. Пузырьки зарядов
    возникают при температуре закипания плазмы твёрдого тела и поставляют во внешнее пространство закольцованный
    ток смещения. Его мощность обеспечивает непрерывный процесс генерации неисчерпаемой электромагнитной энергии.
  statement_en: 'Twelve-year searches for the physical causes of heat release in the Rossi-Focardi experiments divided
    into four directions: (1) the experiment authors explain the heat release by cold nuclear synthesis involving
    nickel and lithium nuclei in the hydrogen atmosphere — the metal nuclei take protons from hydrogen and move
    up the periodic table by one cell; (2) the Russian researchers Bazhutov-Koretsky-Parkhomov refined the existence
    of the nuclear reaction class named cold transmutation of nuclei (ХТЯ), discovered neutron fluxes, and did not
    report heat release accompanying ХТЯ; (3) professor Sapogin L.G. suggested that in the metal-hydrogen system
    a class of ''cold nucleus decay'' reactions, or K-capture, is possible in which the nucleus charge decreases
    — the possibility follows from the solutions of the oscillating-charge particle motion equation and they can
    also lead to thermal chip heating; (4) the author of this work opines that at the microscopic level the plasma
    is heated by the Maxwell displacement current generated by short-lived charge bubbles on the chip points, arising
    at the solid-plasma boiling temperature and supplying a looped displacement current to the external space whose
    power ensures the continuous generation of inexhaustible electromagnetic energy.'
