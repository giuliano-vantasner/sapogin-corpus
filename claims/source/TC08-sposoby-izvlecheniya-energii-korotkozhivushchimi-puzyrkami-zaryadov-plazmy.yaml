  statement_en: 'Direction 1: a scheme of additional energy extraction from the Maxwell displacement current realized
    when heating bodies with mains voltage — a stationary capacitor or an inductance is switched into the circuit
    (after idea verification, ''screwdriver production'' of economical heaters can be quickly set up). Direction
    2: schemes of high-voltage varicaps in which the Maxwell displacement current can be increased by charge bubbles
    — they are also simple to manufacture in centimeter scales with ''screwdriver production'' and can throw large
    power into the circuit. Direction 3: varicap schemes in which the displacement current can be increased by increasing
