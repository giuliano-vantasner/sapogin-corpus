  page: 48
  quote_ru: Второй вариант движения. Электрон доходит до поверхности протона и попадает в состояние, когда его полная
    энергия всё время уменьшается, и он опускается на дно ямы. Образуется связанное состояние уже в виде нейтрона.
    Это состояние может существовать бесконечно долго, если заряд электрона перестаёт осциллировать. Вариант этого
    движения можно назвать «холодным синтезом» нейтрона.
  statement_en: 'Example of electron-proton interaction: an electron incident on a proton along the radius enters
    the interaction sphere, begins oscillating and forms a bound electron-proton state called ''neutron-like'';
    variant 1: the electron travels to the proton surface, reflects, and leaves to infinity — the bound state exists
    a finite time; variant 2: the electron reaches the proton surface and enters a state where its total energy
    keeps decreasing and it sinks to the well bottom — a bound state in the form of a neutron forms which can exist
    infinitely long if the electron charge stops oscillating; this motion variant can be called the ''cold synthesis''
    of the neutron; variant 3: the bound state can be short in time if the charge of the stationary electron keeps
    oscillating — a variable force opposite to the Coulomb one acts on it, increasing its energy until it leaves
    the interaction sphere; the electron becomes free and the neutron decays; this variant can be called the ''cold
    decay'' of the neutron; as experiments show, the decay lasts 16 minutes.'
