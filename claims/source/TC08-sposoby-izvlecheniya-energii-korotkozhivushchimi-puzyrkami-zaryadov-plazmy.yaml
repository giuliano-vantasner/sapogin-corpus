- id: SC-TC08-002
  type: physics
  facet: theory
  priority: core
  page: 1
  quote_ru: Все устройства извлечения энергии оказываются токовыми. Источником тока в них является ток смещения
    Максвелла, известный в электродинамике. В некоторых устройствах он может быть таким большим, что порождаемый
    им тепловой нагрев взрывает плазму. Введена критическая плотность тока смещения для замкнутой энергетической
    цепочки.
  statement_en: All energy-extraction devices turn out to be current devices; the current source in them is the
    Maxwell displacement current known in electrodynamics; in some devices it can be so large that the thermal heating
    it produces explodes the plasma; a critical displacement current density is introduced for a closed energy chain.
