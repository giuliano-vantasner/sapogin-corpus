- id: SC-TC08-017
  type: experimental
  facet: experiment
  priority: core
  page: 4
  quote_ru: 'Варикап с плазменным наполнением позволил ему создать работающие устройства с мощностью, как утверждал
    автор, от 300 Вт до 10 кВт. Обратим внимание на важное физическое свойство у работающих преобразователей: увеличение
    выходной мощности было пропорционально увеличению объёма устройства.'
  statement_en: 'The Franklin-arrow analog allowed P. Bauman to remove the external motor of the Mandelstam-Papaleksi
    installation and create a self-rotating mechanical varicap; the varicap with plasma filling allowed him to create
    working devices with power, as the author claimed, from 300 W to 10 kW; an important physical property of the
    working converters: the increase of output power was proportional to the increase of the device volume.'
