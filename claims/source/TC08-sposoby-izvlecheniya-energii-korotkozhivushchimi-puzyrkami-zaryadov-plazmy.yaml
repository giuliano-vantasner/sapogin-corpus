  statement_en: 'The solution for the number of electrons N localized in the bubble has the form N = 4ε0 m l³ ω²/e²,
    where m and e are the electron mass and charge, l the rod length, ω the rod angular rotation speed; the number
    of electrons thrown to the rod end depends on the ratio of the doubled rotational kinetic energy of an electron
    to the potential energy of single electrons at the rod ends; the electric-to-mechanical energy conversion coefficient
    depends on the number of thrown electrons α = 2/N: one electron at the rod end gives conversion coefficient
    2, two electrons give 1, more than two gives always less than unity.'
