  type: physics
  facet: theory
  priority: core
  page: 13
  quote_ru: В электронном состоянии плазмы распределение электронов асимметричное. Их больше на одном краю пластины,
    чем на другом. Если разделить такой слой зарядов, то получится конденсатор с одинаковыми разноимёнными зарядами.
    Такие пластины будут притягиваться, как у обычного конденсатора.
  statement_en: 'In the electron state of the plasma the electron distribution is asymmetric: more electrons on
    one edge of the plate than on the other; splitting such a charge layer gives a capacitor with equal opposite
    charges — such plates attract as in an ordinary capacitor; this resembles the appearance of Casimir forces between
    thin metal plates: in the Casimir experiment two thin conducting plates are also drawn apart and an attraction
    arises explained by forces from the physical vacuum; at that time Casimir did not know that a metal plate is
    nothing but plasma and two plates can interact as two plasma regions with different charges; the possibility
    of charge separation is proven by Beletsky''s experiments.'
