  quote_ru: Численное моделирование законов движения гипотетической частицы в квадратичной потенциальной яме указало
    на существование неожиданных решений. Движение заряда не подчинялось закону сохранения полной механической энергии.
  statement_en: 'A motion equation was built for a hypothetical particle whose charge oscillates by the law of the
    cosine square of the wave function phase; splitting the cosine square of the half-angle gives two forces in
    the right side — one static, coordinate-dependent, the other variable, connected with the charge oscillation;
    numerical modeling of the motion laws in a quadratic potential well indicated unexpected solutions: the charge
    motion does not obey the total mechanical energy conservation law — for some initial wave-function phases the
    particle energy increases (the class of solutions named ''родильный дом'' — maternity ward), for others it decreases
    and the particle sinks to the well bottom (''крематорий'' — crematorium); the motion scales are of the order
    of fermi and fractions of a fermi — a class of subnuclear motions in which alone the discovered mechanism of
    energy gain/loss of the oscillating-charge particle in a potential relief can hold.'
