  quote_ru: Первыми в нашей стране их обнаружили академики Мандельштам и Папалекси. В 50-х годах они создали первый
    механический варикап, пластины которого вращались электрическим мотором, а электроёмкость вырабатывала переменный
    электрический ток [1].
  statement_en: 'In the last 70 years researchers ran into new physical phenomena in mechano-electric energy converters
    using rotating capacitor plates; the first to discover them in this country were academicians Mandelstam and
    Papaleksi: in the 1950s they created the first mechanical varicap whose plates were rotated by an electric motor
    and whose capacitance produced alternating electric current.'
