  priority: core
  page: 14
  quote_ru: В области движения пластин возникает изменение во времени потока вектора электрической индукции. Это
    изменение приводит к появлению тока смещения Максвелла, который может “протекать” даже там, где нет электрических
    зарядов.
  statement_en: 'Third step: when one plate rotates around the other the charge on them increases — taken from the
    same place as the charge in rotating-variable-capacitor experiments (Mandelstam-Papaleksi, Bauman, Dzhanibekov-Sapogin):
    in the plate-motion region a time change of the electric induction vector flux arises, leading to a Maxwell
    displacement current which can ''flow'' even where there are no electric charges; two displacement currents
    (one in the conducting channel, the other in the non-conducting channel) increase the plate charges until breakdown
    — a second, independent way of extracting alternating-current energy compared with the law of electromagnetic
    induction; mastering powerful displacement current will help engineers master extracting AC energy from gas
    systems of oscillating charged dipoles — Bauman''s experiments showed such sources need no fuel and can work
    unlimited time.'
