- id: SC-TC08-090
  type: physics
  facet: theory
  priority: core
  page: 33
  quote_ru: Причины возникновения неустойчивости в контуре связаны с физическими причинами появления пузырьков зарядов
    в твердотельном проводнике. Проводник начинает проявлять свойства плазмы. В момент проявления неустойчивости
    плазма генерирует пузырьки зарядов прямо в цепи. Процессы синтеза/распада этих пузырьков увеличивают электрическую
    энергию контура.
  statement_en: 'The causes of the circuit instability are connected with the physical causes of charge bubble appearance
    in the solid-state conductor: the conductor begins to show plasma properties; at the moment of instability the
    plasma generates charge bubbles right in the circuit — the synthesis/decay processes of these bubbles increase
    the electric energy of the circuit; in real conditions (circuit in air) the instability will be limited by air
    discharge processes creating gaseous plasma between the capacitor plates; further development is not described
    by the Hill equation and the instability saturates.'
