  quote_ru: причина заключена в том, что ХТЯ не выделяет тепловую энергию, а только отбирает её из нагретой плазмы
    твёрдого тела.
  statement_en: 'Ten years have passed but serial creation of autonomous heat sources on ХТЯ has not succeeded;
    in the author''s view the possible cause is that ХТЯ does not release thermal energy but only takes it from
    the heated solid plasma: the synthesis of any nucleus occurs with energy absorption while nucleus decay releases
    energy as in atomic reactors; any nuclear reactions divide into exothermic (releasing) and endothermic (absorbing)
    classes; the binding energy of the new nucleus with increased charge number is always greater than that of the
    old nucleus, so the new nucleus will need energy taken from the plasma — this estimate indicates the ХТЯ reactions
    are energy-absorbing; if the ХТЯ reactions are endothermic they cannot explain the observed heat output and
    the researchers'' final conclusion needs refinement.'
