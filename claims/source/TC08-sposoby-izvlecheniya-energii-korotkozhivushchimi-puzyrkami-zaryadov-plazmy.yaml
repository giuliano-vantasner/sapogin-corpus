    плазмоид, направлены по радиусу во внешней атмосфере и против радиуса во внутренней атмосфере, как у кластера
    положительных зарядов. Они достигают экстремальных значений на границе плазмоида.'
  statement_en: 'The distribution of forces, fields, and charges in a hole plasmoid with small collective-field
    divergence (fewer electrons than positive background charges), calculated in [11-12], is shown in fig. 3: the
    plasmoid has two atmospheres, external and internal; the Coulomb forces tearing the plasmoid are directed along
    the radius in the external atmosphere and against the radius in the internal atmosphere, as in a positive-charge
    cluster, reaching extreme values at the plasmoid boundary; the collective field strength vector has the same
    direction; the field strength inside the layer varies by the sine law and has no singularity at the plasmoid
    boundaries; the compensating forces are created by the Bernoulli force directed opposite to the Coulomb forces
    in each layer (compression forces); the Bernoulli force coincides with the collective-field pressure gradient,
    is opposite to it, and acts on the mass density of charges; the positive plasma background is homogeneous, the
    electron distribution has a minimum at the atmosphere boundary; at the plasmoid boundaries the electron and
    positive-charge concentrations coincide; there are no charges inside the plasmoid.'
