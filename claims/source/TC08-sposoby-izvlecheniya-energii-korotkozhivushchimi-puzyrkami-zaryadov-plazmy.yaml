  quote_ru: Ответ на вопрос, какой механизм нагрева является преобладающим, могут дать эксперименты с нагревом опилок
    Li - Ni, из которых удалён водород. Удаление водорода должно увеличить тепловой эффект нагрева по причине того,
    что реакции холодного синтеза и трансмутации ядер эндотермические, и они охлаждают плазму. Отсутствие водорода
    позволит устранить третий возможный механизм поступления энергии.
  statement_en: 'Experiments with heating Li-Ni chips from which hydrogen has been removed can answer which heating
    mechanism is predominant: hydrogen removal should increase the thermal heating effect because cold synthesis
    and nuclear transmutation reactions are endothermic and cool the plasma; the absence of hydrogen will eliminate
    the third possible mechanism of energy input; further addition of various amounts of hydrogen will make it possible
    to determine in detail the contribution of the nuclear mechanisms to the energy picture of solid-plasma heating/cooling.'
