  quote_ru: Падение электрона на любое ядро известно в экспериментах и названо К-захватом. При К-захвате электрон
    попадает в ядро, связывает протон, и ядро теряет положительный заряд. Ядро перемещается по таблице элементов
    влево и при таком переходе уменьшает свою энергию связи. Такую реакцию можно назвать холодным распадом ядра
    с выделением тепловой энергии.
  statement_en: 'The fall of an electron onto any nucleus is known in experiments as K-capture: the electron enters
    the nucleus, binds a proton, and the nucleus loses positive charge; the nucleus moves left in the table of elements
    and in such a transition decreases its binding energy — such a reaction can be called the cold decay of a nucleus
    with release of thermal energy; the spectrum of possible trajectories describes processes of increasing the
    nucleus charge by one proton with creation of a stable nucleus, and of the nucleus losing one proton with creation
    of a stable nucleus; these phenomena cover all possible variants of synthesis and decay of any nuclei in the
    periodic system; the motion equation indicates the possibility of any cold synthesis/decay nuclear reactions
    both with increase and decrease of the nuclear charge number.'
