  quote_ru: Почему опилки лучше, чем пыль из круглых шариков или фольга? Каждая из опилок имеет острия. При нагревании
    острия становятся областями, на которых возникают пузырьки зарядов, как на катоде К. Шоулдерса.
  statement_en: Why are chips better than dust of round balls or foil? Each chip has points; on heating the points
    become regions where charge bubbles arise as on K. Shoulders' cathode; there are many chips and they supply
    a large Maxwell current into the plasma; this region discovered on the surface of a heated cathode was called
    an 'ecton' by academician G. Mesyats who noticed it on the roughnesses of the cathode material; the ecton throws
    an electron avalanche out of the cathode and the avalanche turns into a short-lived charge bubble; a large chip
    concentration leads both to a high charge-bubble concentration and to a large electric dipole moment in the
    substance; a large concentration of heated chips can transfer the heating element into a closed energy chain.
