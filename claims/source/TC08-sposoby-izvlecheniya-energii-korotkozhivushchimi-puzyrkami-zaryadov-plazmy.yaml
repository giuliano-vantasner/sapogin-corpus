  quote_ru: Извлечение энергии в системе осуществляется механическим вращением ёмкости с радиальными металлическими
    секторами, достаточно большого диаметра. Чем больше диаметр, тем больше мощность. Ёмкость шумит, как двигатель,
    и могут возникнуть большие проблемы при её установке на движущемся транспорте.
  statement_en: 'Drawbacks of Bauman''s devices to be eliminated (1): energy extraction is done by mechanical rotation
    of a capacitance with radial metal sectors of rather large diameter — the larger the diameter the more power;
    the capacitance is noisy like an engine and may have big problems mounted on moving transport.'
