  quote_ru: Подача высокого напряжения на стрелку, находящуюся в воздухе, приводит к возникновению двух токов дискретных
    зарядов, выходящих из острия стрелки в противоположные стороны.
  statement_en: 'A similar unidirectional electric moment arises in the high-voltage Franklin arrow: applying high
    voltage to the arrow in air leads to two currents of discrete charges leaving the arrow point in opposite directions;
