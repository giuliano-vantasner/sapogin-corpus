  quote_ru: Вращение сообщает электронам проводимости плазмы твёрдого тела центробежное ускорение, а индуцированное
    электрическое поле его компенсирует (см. рис. 5).
  statement_en: 'In the Mandelstam-Papaleksi and Bauman experiments a conducting plate with radial sectors was used;
