- id: SC-TC08-094
  type: physical
  facet: recipe
  priority: core
  page: 34
  quote_ru: Он состоит из двух металлических электродов, помещённых в обкладки П-образного конденсатора. На выводы
    a,b подаётся высоковольтное переменное напряжение определённой частоты. Для проявления эффектов высоковольтной
    электрофизики напряжение, приложенное к клеммам a b, должно быть больше 10 кВ, а расстояние между электродами
    больше 5 мм.
  statement_en: One simple variant of a varicap with points (fig. 17) consists of two metal electrodes placed in
    the plates of a П-shaped capacitor; high-voltage AC voltage of a definite frequency is fed to terminals a,b
    — for the manifestation of high-voltage electrophysics effects the voltage must exceed 10 kV and the electrode
    distance exceed 5 mm; the voltage forms the first (seed) displacement current, alternately charging the stationary
    electrodes and forming between them a variable dipole electric moment replacing the dipole gas; to outputs c-d
    either an ohmic resistance is connected (a second displacement current flows through it) or the c-d output can
    be made pointed — a pointed output is loaded on the external space and always forms in it a third displacement
    current of the 'non-conducting channel' closing the electrodes c-d; the larger the electrode distance and the
    AC voltage amplitude, the larger the dipole moment created between a-b.
