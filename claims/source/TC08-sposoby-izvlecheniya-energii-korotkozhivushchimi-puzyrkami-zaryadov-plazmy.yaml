  type: physical
  facet: recipe
  priority: normal
  page: 3
  quote_ru: 'Второе различие: съём энергии осуществлялся через две П- образные пластины конденсатора, расположенные
    на горизонтальном диаметре устройства. Геометрия съёма была похожа на геометрию съёма энергии в известной электрофорной
