  quote_ru: Но металлокерамические подшипники не проводят электричество. Поэтому в установке для съёма тока используется
    пара горизонтальных П-образных пластин.
  statement_en: 'Drawbacks (2)-(3): the axis uses metal-ceramic bearings of Chinese manufacture which reduce mechanical
    friction well (otherwise the moment of electric-origin forces could not exceed the friction moment and spin
    the capacitance), but they do not conduct electricity, so a pair of horizontal П-shaped plates is used for current
    takeoff; these plates select only the difference displacement current of the system arising on the П-shaped
    capacitors — the only way out is a Nikolaev magnetic conducting bearing with low friction.'
