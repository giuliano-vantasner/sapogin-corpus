  quote_ru: Взаимодействие заключалось в том, что в момент пролёта сектора появлялся постоянный внешний электрический
    момент, который вращал диск в одну сторону и создавал затравочный ток смещения в варикапе.
  statement_en: 'Third difference: a radial conducting sector with electric charge on its outer part, flying inside
