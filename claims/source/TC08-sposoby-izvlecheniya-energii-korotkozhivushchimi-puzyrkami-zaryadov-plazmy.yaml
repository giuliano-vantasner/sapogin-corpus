  quote_ru: В записке изложена цепочка физических принципов, позволяющих понять причины непрерывного выделения энергии
    переменного тока в механо- электрических преобразователях, использующих вращательное движение пластин конденсатора.
  statement_en: The note sets out a chain of physical principles allowing understanding of the causes of continuous
    AC energy release in mechano-electric converters using rotational motion of capacitor plates; the principles
    allow full expertise of devices with various constructive solutions; the devices herald a new field of energetics
    — economical energetics on charge bubbles, requiring no fossil fuel and having no production waste.
