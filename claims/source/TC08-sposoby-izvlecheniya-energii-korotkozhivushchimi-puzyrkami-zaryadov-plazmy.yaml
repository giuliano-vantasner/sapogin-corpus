  quote_ru: По-видимому, этот параметрический резонанс мощности возникает в том случае, когда плотность тока смещения
    достигает критических значений. Варикап становится автономным неисчерпаемым источником энергии.
  statement_en: 'At equal frequencies ν = ν* the conversion coefficient is 1: the amplitude powers pumped through
    the channels between the ohmic resistance and the capacitor are equal — a condition of a peculiar ''resonance''
    called ''parametric'' power resonance; apparently this parametric power resonance arises when the displacement
    current density reaches critical values — the varicap becomes an autonomous inexhaustible energy source; for
