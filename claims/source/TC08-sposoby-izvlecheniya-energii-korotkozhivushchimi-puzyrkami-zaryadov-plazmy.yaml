    created by them exits the entire cylinder surface during one half-period and returns during the second half-period;
    the current is distributed in space as in I. Zhuravkov''s subcritical discharge; the displacement current arises
    at different frequencies and continuously heats the chips, exiting through the lateral surface of the chips
