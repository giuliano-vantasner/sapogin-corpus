    of high concentration throughout the volume; a larger number of bubbles will be in the compression state so
    the plasma will self-heat; after that the direct-current source can be switched off — it will stop introducing
    the heating power P1 and the chips will pass into the state of continuously heating the cooling medium; at that
    moment a critical density of Maxwell displacement current arises in the tube due to the oscillating motion of
