  quote_ru: Из соотношения (4) видно, что ток смещения всегда содержит две компоненты. Одна связана со скоростью
    изменения напряжённости электрического поля. Она образована движением либо одиночных, либо множественных пузырьков
    зарядов внутри конденсатора. Вторая компонента связана со скоростью изменения вектора поляризации.
  statement_en: 'Any alternating current flowing in an ohmic conductor, inductance, or through a capacitance can
    contain a displacement-current component; increasing its frequency always leads to a second current in the conductor
    — the displacement current formed by the ''bound'' electrons of the crystal lattice in oscillatory motion; from
    relation (4) the displacement current always contains two components: one connected with the rate of change
    of the field strength, formed by the motion of single or multiple charge bubbles inside the capacitor; the second
    connected with the rate of change of the polarization vector, formed by the motion of bound charges at oscillation
    of multiple dipole moments.'
