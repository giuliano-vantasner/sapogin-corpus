  page: 39
  quote_ru: Процесс сжатия заканчивается кратковременным состоянием равновесия зарядов с полем. После чего плазмоид
    начинает излучать и происходит его реакция распада. Реакция распада чаще всего заканчивается взрывом. Распад
    выделяет энергию в кипящую плазму.
  statement_en: 'The compression process ends in a short-time state of charge equilibrium with the field, after
    which the plasmoid begins to radiate and its decay reaction proceeds — the decay most often ends in an explosion
    releasing energy into the boiling plasma which receives additional electromagnetic radiation energy and heating;
    expansion plasmoids form in local regions with a maximum-temperature point: electrons are dumped into the external
    cold plasma region by the Bernoulli force, plasmoid expansion begins driven by the temperature gradient, the
    bubble also does not change its charge; expansion decreases its charge density, binding energy, and field divergence;
    the expansion ends in a short equilibrium after which the plasmoid radiates and decays — the decay supplies
    less energy into the plasma, and for expansion plasmoids the synthesis energy costs are always greater than
    the decay energy.'
