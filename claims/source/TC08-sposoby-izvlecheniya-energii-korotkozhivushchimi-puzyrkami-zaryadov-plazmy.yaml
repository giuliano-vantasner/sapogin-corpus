- id: SC-TC08-088
  type: mathematical
  facet: theory
  priority: normal
  page: 31
  quote_ru: 'В дифференциальное уравнение второго порядка, записанного относительно переменного заряда в контуре,
    вошли три безразмерных параметра системы: добротность Q, отношение частоты модуляции ёмкости к частоте колебательного
    контура с невозмущённой ёмкостью n   / 0 , приведённая амплитуда модуляции ёмкости   C / C0 .'
  statement_en: 'The second-order differential equation for the variable charge in the circuit contains three dimensionless
    system parameters: quality Q, ratio n of the capacitance modulation frequency to the unperturbed-circuit frequency,
    and reduced modulation amplitude γ = ΔC/C0; the equation y'''' + y''/Q + y/(1+γ cos(nx)) = 0 with substitution
    y = z(x)exp(-x/2Q) reduces to the Hill equation z'''' + Ω²z = 0 with frequency depending on γ, n, Q and time;
    the canonical Hill equation describes a mechanical oscillatory system whose generalized ''stiffness'' depends
    on two competing factors — static dissipation ~1/4Q² and dynamic pumping by the periodic restoring ''force'';
    the dynamic pumping factor depends on n and in the special case n=2 gives the Mandelstam-Papaleksi parametric
    resonance; dynamic pumping exists at all frequencies, so the term ''parametric resonance'' determines nothing.'
  quantities: []
  equations:
  - y'' + y'/Q + y/(1+\gamma\cos(nx)) = 0
  - z'' + \Omega^2 z = 0
  materials: []
  geometry: []
  procedure_steps: []
  measurements: []
  schematic_refs: []
