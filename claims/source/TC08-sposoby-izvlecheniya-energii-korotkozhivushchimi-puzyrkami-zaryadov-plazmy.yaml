- id: SC-TC08-015
  type: physical
  facet: theory
  priority: core
  page: 4
  quote_ru: Предложенный Бауманом конструктив установки позволил развивать напряжение на П-образных пластинах до
    12-15 кВ. Это приводило к высоковольтному пробою воздуха внутри пластин П-образного конденсатора, и образованию
    тонкого шнура газоразрядной плазмы. В плазме с таким напряжением наблюдаются высоковольтные электрофизические
    эффекты, которые приводят к образованию пузырьков зарядов и их дипольных моментов.
  statement_en: 'Fourth difference: the design proposed by Bauman allowed developing voltage on the П-shaped plates
    up to 12-15 kV; this led to high-voltage air breakdown inside the plates and the formation of a thin filament
    of gas-discharge plasma; in plasma at such voltage, high-voltage electrophysical effects are observed which
    lead to the formation of charge bubbles and their dipole moments.'
