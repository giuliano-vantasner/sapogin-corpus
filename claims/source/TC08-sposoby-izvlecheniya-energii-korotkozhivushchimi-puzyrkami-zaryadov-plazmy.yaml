- id: SC-TC08-089
  type: physics
  facet: theory
  priority: core
  page: 33
  quote_ru: Токовая неустойчивость проявляет себя в том, что приводит к неограниченному росту колебаний заряда и
    тока ёмкости для определённых значений глубины модуляции реактивного параметра. Для глубины модуляции в 20 %,
    амплитуда заряда в контуре увеличивается в 6 раз за восемь периодов колебаний. Для глубины модуляции в 80 %
    на том же количестве периодов, амплитуда зарядов в контуре возрастает более чем в 10 000 раз.
  statement_en: 'Numerical solution of the Hill equation shows three classes of periodic solutions: a low-Q circuit
    gives damped oscillations; a medium-Q circuit gives beats arising at any pumping frequency; a high-Q circuit
    gives oscillations growing in time with increment depending on system parameters — these describe the development
    of the circuit current instability; the current instability manifests itself in unlimited growth of charge and
    capacitance-current oscillations for certain modulation depths of the reactive parameter: at 20% modulation
    depth the charge amplitude in the circuit increases 6 times in eight oscillation periods; at 80% depth over
    the same periods the charge amplitude grows more than 10,000 times.'
  quantities:
  - глубина модуляции 20% ⇒ амплитуда ×6 за 8 периодов
  - глубина 80% ⇒ амплитуда > 10 000 раз
  equations: []
