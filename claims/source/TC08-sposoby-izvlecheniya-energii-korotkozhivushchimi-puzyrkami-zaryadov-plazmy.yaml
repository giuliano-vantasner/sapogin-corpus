  page: 13
  quote_ru: Первое основное состояние названо дырочным. В плазме возникает симметричное распределение электронов
    относительно срединной плоскости. На срединной плоскости электронов минимум, а на границах системы их концентрация
    наибольшая.
  statement_en: 'Possible physical causes of macroscopic charge separation in solid-state plasma at uniform temperature:
    calculated by the Pustovoit equations (metal is plasma — conduction electrons move against a positive background),
    two ground states of charge distribution are possible, described by the conservation law of total plasma pressure
    (in any plane the sum of field and plasma charge pressures at uniform temperature remains unchanged — where
    the field pressure is greater the charge pressure is less, and vice versa). The first ground state is called
    hole: a symmetric electron distribution about the midplane arises in the plasma — minimum of electrons at the
    midplane, maximum concentration at the system boundaries; splitting such a charge layer in half gives two layers
    with equal positive charge — capacitor plates with equal positive charges which should repel but are held in
    equilibrium by the collective-field pressure.'
