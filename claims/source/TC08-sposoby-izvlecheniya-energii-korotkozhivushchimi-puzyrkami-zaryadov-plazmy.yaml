  type: physical
  facet: recipe
  priority: normal
  page: 6
  quote_ru: Конструкцию согнутого под углом радиального сектора можно позаимствовать у жгутиковых бактерий (см.
    рис. 2), а потом, для ещё большего увеличения электрического момента вращения, сектор выполнить в виде пера
    птицы, имеющего большое количество окончаний в виде острия с одной стороны.
  statement_en: 'Drawback (5): the ratio between friction and electric-force moments can be changed another way
