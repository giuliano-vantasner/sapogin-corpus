- id: SC-TC08-105
  type: physical
  facet: process
  priority: core
  page: 38
  quote_ru: Плазмоиды сжатия образуются в локальных областях плазмы, в которой есть точка наименьшей температуры.
    Электроны сбрасываются в холодную точечную область плазмы силой Бернулли и начинают сжиматься градиентом температуры.
    Возникший пузырь не изменяет своего заряда во время синтеза. Кратковременное сжатие приводит к увеличению его
    объёмной плотности заряда и энергии связи.
  statement_en: 'Compression plasmoids form in local plasma regions containing a minimum-temperature point: electrons
    are dumped into the cold point region of the plasma by the Bernoulli force and begin compressing by the temperature
    gradient; the arisen bubble does not change its charge during synthesis; the short-term compression leads to
    an increase of its volume charge density and binding energy; the increase of the volume charge density increases
    the collective-field divergence; the time-varying collective field of the plasmoid does positive work on the
    plasmoid charges increasing the binding energy at its compression — herein lies the main cause that the energy
    of the compressing plasmoid is not conserved (the charge motion occurs in variable electric fields where conservation
    laws do not hold in nonstatic fields); the plasmoid energy increase at compression is the most important cause
    of additional energy input into the plasma, providing the mechanism of plasma self-heating by compressing charge
    bubbles.'
