<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>sapogin-corpus explorer</title>
<style>
  :root { --bg:#14161a; --panel:#1d2026; --edge:#2c313a; --fg:#d7dae0; --dim:#8a919c;
          --accent:#4da3ff; --core:#ffb84d; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column;
         font:14px/1.45 system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; gap:14px; align-items:center; padding:14px 18px;
           background:var(--panel); border-bottom:1px solid var(--edge); flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0 14px 0 0; white-space:nowrap; }
  header a { color:var(--dim); font-size:12px; text-decoration:none; }
  #search { flex:1; min-width:280px; max-width:560px; padding:10px 14px; font-size:15px;
            border-radius:8px; border:1px solid var(--edge); background:var(--bg); color:var(--fg); }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { padding:4px 10px; border-radius:12px; font-size:12px; cursor:pointer;
          border:1px solid var(--edge); color:var(--dim); user-select:none; }
  .chip.on { color:#fff; border-color:transparent; }
  main { flex:1; display:flex; min-height:0; }
  #graph { flex:1; min-width:0; }
  #dragbar { width:8px; cursor:col-resize; background:var(--panel); border-left:1px solid var(--edge);
             display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  #dragbar:hover, #dragbar.active { background:#2a3a4d; }
  #dragbar::before { content:""; width:3px; height:36px; border-radius:2px;
                     background:var(--accent); opacity:.45; }
  #dragbar:hover::before, #dragbar.active::before { opacity:1; }
  #side { width:480px; min-width:320px; max-width:85vw; flex-shrink:0; overflow-y:auto;
          background:var(--panel); padding:14px 18px; }
  h2 { font-size:15px; margin:14px 0 6px; } h3 { font-size:13px; margin:12px 0 4px; color:var(--dim); }
  .claim { border:1px solid var(--edge); border-radius:8px; padding:8px 10px; margin:8px 0;
           cursor:pointer; }
  .claim:hover { border-color:var(--accent); }
  .claim.sel { border-color:var(--accent); background:#22303f; }
  .cid { font-family:ui-monospace,monospace; font-size:12px; color:var(--accent); }
  .pri-core { color:var(--core); font-size:11px; font-weight:600; }
  .meta { color:var(--dim); font-size:12px; margin-top:2px; }
  .quote { font-size:12px; color:var(--dim); font-style:italic; margin-top:4px;
           border-left:2px solid var(--edge); padding-left:8px; }
  .kv { font-size:12px; margin:2px 0; } .kv b { color:var(--dim); font-weight:500; }
  table { border-collapse:collapse; font-size:12px; width:100%; }
  td,th { border:1px solid var(--edge); padding:3px 7px; text-align:left; }
  th { color:var(--dim); font-weight:500; }
  .md h1 { font-size:16px; } .md h2 { font-size:14px; color:var(--accent); } .md table { margin:8px 0; }
  .btn { padding:6px 12px; border-radius:6px; border:1px solid var(--edge); background:none;
         color:var(--fg); cursor:pointer; font-size:13px; }
  .btn.on { border-color:var(--accent); color:var(--accent); }
  .brow { display:flex; justify-content:space-between; gap:8px; padding:7px 10px; margin:4px 0;
          border:1px solid var(--edge); border-radius:8px; cursor:pointer; }
  .brow:hover { border-color:var(--accent); }
  .brow .sw { margin-top:4px; }
  details { margin:2px 0; } summary { cursor:pointer; color:var(--fg); padding:4px 2px; }
  .crow { display:flex; justify-content:space-between; gap:8px; padding:4px 8px 4px 18px;
          font-size:12px; color:var(--dim); cursor:pointer; border-radius:6px; }
  .crow:hover { background:#242a33; color:var(--fg); }
  #legend { display:flex; gap:10px; padding:5px 16px; font-size:11px; color:var(--dim);
            background:var(--panel); border-top:1px solid var(--edge); flex-wrap:wrap; }
  .sw { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:3px; }
</style>
</head>
<body>
<header>
  <h1>sapogin-corpus</h1>
  <input id="search" placeholder="search 1,641 claims — id, statement, tags, quote…">
  <div class="chips" id="chips"></div>
  <button class="btn" id="modeBtn">view: graph</button>
</header>
<main>
  <div id="graph"></div>
  <div id="dragbar" title="drag to resize the results panel"></div>
  <div id="side"></div>
</main>
<div id="legend"></div>
<script src="vendor/vis-network.min.js"></script>
<script src="vendor/minisearch.min.js"></script>
<script src="vendor/marked.min.js"></script>
<script src="vendor/webmcp.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
